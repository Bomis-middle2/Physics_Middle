<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Science Lab: Force & Friction</title>
    <style>
        :root {
            --lab-blue: #1a73e8;
            --science-yellow: #f9ab00;
            --success-green: #1e8e3e;
            --error-red: #d93025;
            --panel-bg: #ffffff;
            --body-bg: #f1f3f4;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--body-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border-radius: 24px;
            padding: 25px;
            margin: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            min-height: 550px;
            border-top: 8px solid var(--lab-blue);
        }

        /* --- LOGO SPLASH SCREEN --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .logo-main { 
            width: 280px; 
            height: auto; 
            max-width: 85%; 
            margin-bottom: 30px;
            display: block;
        }

        .loading-ring { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid var(--lab-blue); 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- GAME UI --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .lab-badge { background: var(--lab-blue); color: white; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; }
        .score-box { font-weight: 800; color: var(--lab-blue); }

        .timer-track { width: 100%; height: 8px; background: #e8eaed; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--lab-blue); transition: width 1s linear; }

        .question-text { font-size: 1.1rem; font-weight: 600; line-height: 1.4; margin-bottom: 15px; }

        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.9rem; background: #fff; }
        .data-table th, .data-table td { border: 1px solid #dadce0; padding: 12px; text-align: left; }
        .data-table th { background: #f1f3f4; color: #202124; font-weight: 700; }

        .options-grid { display: grid; gap: 10px; }
        .opt-btn {
            background: #fff; border: 2px solid #dadce0; padding: 16px;
            border-radius: 14px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s;
            color: #3c4043; font-weight: 500;
        }
        
        .opt-btn.correct { background: var(--success-green) !important; color: white; border-color: var(--success-green); }
        .opt-btn.wrong { background: var(--error-red) !important; color: white; border-color: var(--error-red); opacity: 0.7; }

        .feedback { margin-top: 15px; padding: 15px; border-radius: 14px; display: none; line-height: 1.4; font-size: 0.9rem; }
        .hint-box { background: #fff7e0; border-left: 5px solid var(--science-yellow); color: #b06000; }
        .expl-box { background: #e8f0fe; border-left: 5px solid var(--lab-blue); color: #1967d2; }

        #action-btn { 
            width: 100%; margin-top: 20px; padding: 18px; 
            background: var(--lab-blue); color: white; 
            border: none; border-radius: 16px; font-weight: 700; 
            font-size: 1rem; cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" class="logo-main" onerror="this.src='https://via.placeholder.com/280x100?text=INNOVINE'" alt="Logo">
        <div class="loading-ring"></div>
    </div>

    <div id="intro-view" class="hidden" style="text-align: center;">
        <div style="font-size: 3.5rem; margin-bottom: 15px;">🧪</div>
        <h1 style="color: var(--lab-blue); margin: 0;">Force & Friction Lab</h1>
        <p style="color: #5f6368; margin-top: 10px;">Grade 5 Science Challenge</p>
        <div style="background: #f8f9fa; padding: 20px; border-radius: 20px; margin: 25px 0; text-align: left; border: 1px dashed #dadce0;">
            Welcome, Researcher! Analyze experimental data and identify forces. You have <b>2 attempts</b> per question.
        </div>
        <button id="start-btn" style="width:100%; padding:20px; background:var(--lab-blue); color:white; border:none; border-radius:50px; font-weight:bold; font-size:1.1rem; cursor:pointer;">START RESEARCH</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="header">
            <div class="lab-badge">LOG #<span id="q-num">1</span></div>
            <div class="score-box">XP: <span id="score-val">0</span></div>
        </div>
        <div class="timer-track"><div id="timer-bar"></div></div>
        <div id="q-text" class="question-text"></div>
        <div id="table-area"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">NEXT LOG →</button>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <div style="font-size: 4rem; margin-bottom: 10px;">🏅</div>
        <h2 style="color: var(--lab-blue);">Lab Evaluation</h2>
        <div style="font-size: 4.5rem; font-weight: 900; color: #3c4043; margin: 10px 0;"><span id="final-pts">0</span>/10</div>
        <p id="result-msg" style="color:#5f6368; margin-bottom:30px;"></p>
        <button onclick="location.reload()" style="width:100%; padding:18px; background:var(--lab-blue); color:white; border:none; border-radius:16px; font-weight:700; cursor:pointer;">RESTART RESEARCH</button>
    </div>
</div>

<script>
    // --- SOUND SYSTEM ---
    const sfx = {
        correct: new Audio('assets/correct.mp3'),
        wrong: new Audio('assets/wrong.mp3'),
        victory: new Audio('assets/freesound_community-claps-44774.mp3')
    };

    const questions = [
        { 
            q: "Investigation: Three students pushed identical boxes. Based on the table, why did Student A need the least effort?", 
            table: `<tr><th>Student</th><th>Surface</th><th>Result</th></tr>
                    <tr><td>A</td><td>Marble floor</td><td>Box moved easily</td></tr>
                    <tr><td>B</td><td>Grass</td><td>Box moved slowly</td></tr>
                    <tr><td>C</td><td>Sand</td><td>Box hardly moved</td></tr>`,
            opts: ["Marble increases gravity", "Marble has less friction", "Sand reduces force", "Grass increases mass"], 
            ans: 1, hint: "Smoother surfaces allow objects to slide more easily.", expl: "Marble is a smooth surface that offers very little resistance (friction) compared to grass or sand." 
        },
        { 
            q: "After rain, the corridor became slippery. Why did the principal ask students to walk carefully?", 
            opts: ["Water increases muscular force", "Friction between shoes and floor decreases", "Gravity becomes stronger", "Air resistance increases"], 
            ans: 1, hint: "Slippery surfaces mean your shoes can't 'grip' the floor.", expl: "Water acts as a lubricant, reducing friction and making it easier to slip." 
        },
        { 
            q: "Design Challenge: Rohan is designing shoes for mountain climbing. Which sole should he select for safety?", 
            opts: ["Smooth plastic sole", "Metal sole", "Rough rubber sole", "Glass surface sole"], 
            ans: 2, hint: "Climbers need 'grippy' soles to stay on rocks.", expl: "Rough surfaces increase friction, providing the grip needed for climbing." 
        },
        { 
            q: "Data Interpretation: Students placed objects in water. What scientific conclusion is correct?", 
            table: `<tr><th>Object</th><th>Observation</th></tr>
                    <tr><td>Stone</td><td>Sank</td></tr>
                    <tr><td>Plastic ball</td><td>Floated</td></tr>
                    <tr><td>Wooden block</td><td>Floated</td></tr>`,
            opts: ["Water pushes objects upward", "Floating depends only on size", "Gravity stops in water", "Floating objects have no weight"], 
            ans: 0, hint: "Why do some objects stay on top of the water?", expl: "Water exerts an upward force (buoyancy) that supports floating objects." 
        },
        { 
            q: "Riya pushes an empty trolley (fast) vs a loaded trolley (slow). Why the difference?", 
            opts: ["Force decreased", "Mass increased needing more force", "Gravity stopped working", "Speed controls force"], 
            ans: 1, hint: "Heavier things are harder to speed up.", expl: "Increasing mass means you need more force to achieve the same movement." 
        },
        { 
            q: "Assertion: A stationary ball moves when kicked. Reason: Force can change state of motion.", 
            opts: ["Both are true and R explains A", "Both true but not explanation", "A true, R false", "A false, R true"], 
            ans: 0, hint: "Does a kick count as a force? Does it make the ball move?", expl: "Force is required to change an object's state from rest to motion." 
        },
        { 
            q: "Error Detection: A student says: 'Force is ONLY needed to start motion, not to stop it.' Find the error.", 
            opts: ["Force is also needed to stop motion", "Motion stops automatically", "Gravity stops objects", "Air stops objects"], 
            ans: 0, hint: "How do you catch and stop a moving ball?", expl: "To stop or slow down a moving object, an opposite force must be applied." 
        },
        { 
            q: "Why do heavy buses take longer to stop than bicycles at the same speed?", 
            opts: ["Larger mass requires more stopping force", "Less friction", "More gravity", "Less speed"], 
            ans: 0, hint: "Which one is much heavier and harder to slow down?", expl: "Greater mass means greater inertia, requiring more force to stop." 
        },
        { 
            q: "Concept Investigation: Why is a rolling suitcase easier to move than a dragging bag?", 
            opts: ["Rolling friction < sliding friction", "Gravity reduced", "Mass decreased", "Air resistance increased"], 
            ans: 0, hint: "Think about why we use wheels.", expl: "Rolling friction is much weaker than sliding friction, allowing easier movement." 
        },
        { 
            q: "Why is friction called a 'necessary evil'?", 
            opts: ["It stops all motion", "It allows us to control movement", "It reduces force completely", "It removes gravity"], 
            ans: 1, hint: "Try to imagine walking on perfectly smooth oil.", expl: "We need friction to walk, write, and safely control vehicles." 
        }
    ];

    let current = 0, score = 0, attempts = 0, timer, timeLeft = 45;

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro-view').classList.remove('hidden');
        }, 5000);
    };

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        loadQuestion();
    };

    function loadQuestion() {
        attempts = 0; timeLeft = 45;
        const q = questions[current];
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('q-text').innerText = q.q;
        
        const tableArea = document.getElementById('table-area');
        tableArea.innerHTML = q.table ? `<table class="data-table">${q.table}</table>` : "";
        
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => handleChoice(i, b);
            area.appendChild(b);
        });
        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-bar').style.width = (timeLeft/45*100) + "%";
            if(timeLeft <= 0) { clearInterval(timer); endTurn(); }
        }, 1000);
    }

    function handleChoice(i, b) {
        if(i === questions[current].ans) {
            clearInterval(timer);
            sfx.correct.play().catch(e => {}); // PLAY CORRECT SOUND
            b.classList.add('correct');
            score++;
            document.getElementById('score-val').innerText = score * 100;
            endTurn();
        } else {
            attempts++;
            sfx.wrong.play().catch(e => {}); // PLAY WRONG SOUND
            b.classList.add('wrong');
            b.disabled = true;
            if(attempts === 1) {
                const f = document.getElementById('feedback-box');
                f.className = 'feedback hint-box';
                f.innerHTML = "💡 <b>LAB HINT:</b> " + questions[current].hint;
                f.style.display = 'block';
            } else {
                clearInterval(timer);
                endTurn();
            }
        }
    }

    function endTurn() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        document.querySelectorAll('.opt-btn')[questions[current].ans].classList.add('correct');
        const f = document.getElementById('feedback-box');
        f.className = 'feedback expl-box';
        f.innerHTML = "📝 <b>RESEARCH LOG:</b> " + questions[current].expl;
        f.style.display = 'block';
        document.getElementById('action-btn').classList.remove('hidden');
    }

    document.getElementById('action-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else {
            sfx.victory.play().catch(e => {}); // PLAY VICTORY SOUND
            showResults();
        }
    };

    function showResults() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        document.getElementById('final-pts').innerText = score;
        const msg = document.getElementById('result-msg');
        if(score >= 9) msg.innerText = "Excellent! You are a Certified Lab Lead.";
        else if(score >= 7) msg.innerText = "Good job! You've passed the safety inspection.";
        else msg.innerText = "Keep researching! Your science skills are growing.";
    }
</script>
</body>
</html>
