<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G5 Measurement Lab</title>
    <style>
        :root { --lab-blue: #1a73e8; --lab-success: #1e8e3e; --lab-danger: #d93025; --bg-shade: #f1f3f4; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-shade); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #app-container { width: 95%; max-width: 500px; background: white; border-radius: 24px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; min-height: 550px; border-top: 8px solid var(--lab-blue); }
        
        /* Splash Screen */
        #splash-screen { position: absolute; top:0; left:0; width:100%; height:100%; background:white; z-index:1000; display:flex; flex-direction:column; justify-content:center; align-items:center; }
        .logo-img { width: 250px; margin-bottom: 20px; }
        
        /* Intro Screen */
        #intro-view { text-align: center; }
        .lab-icon { font-size: 5rem; margin-bottom: 20px; display: block; }

        .hidden { display: none !important; }
        .opt-btn { width: 100%; padding: 18px; margin: 8px 0; border: 2px solid #dadce0; border-radius: 14px; background: white; cursor: pointer; text-align: left; font-size: 1rem; font-weight: 500; }
        .correct { background: var(--lab-success) !important; color: white; border-color: var(--lab-success); }
        .wrong { background: var(--lab-danger) !important; color: white; border-color: var(--lab-danger); }
        
        .btn-main { width: 100%; padding: 20px; background: var(--lab-blue); color: white; border: none; border-radius: 15px; margin-top: 20px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .feedback { padding: 15px; border-radius: 12px; margin-top: 15px; background: #e8f0fe; font-size: 0.95rem; border-left: 5px solid var(--lab-blue); }
        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; background: #fafafa; }
        .data-table td { border: 1px solid #ddd; padding: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/250x100?text=INNOVINE'" alt="Logo">
        <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--lab-blue); border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>

    <div id="intro-view" class="hidden">
        <span class="lab-icon">🔬</span>
        <h1 style="color: var(--lab-blue); margin: 0;">Measurement Lab</h1>
        <p style="color: #666; margin-bottom: 30px;">Welcome Scientist! Complete the accuracy challenge.</p>
        <div style="background: #fff9e6; padding: 15px; border-radius: 10px; font-size: 0.9rem; color: #856404; margin-bottom: 20px;">
            ⚠️ <b>Rule:</b> You have 2 attempts per question!
        </div>
        <button class="btn-main" onclick="startLab()">START RESEARCH</button>
    </div>

    <div id="quiz-area" class="hidden">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 20px;">
            <span id="q-num" style="background:var(--lab-blue); color:white; padding:5px 15px; border-radius:20px; font-weight:bold;">Q1</span>
            <span style="font-weight:bold; color:var(--lab-blue);">Score: <span id="score-val">0</span></span>
        </div>
        <p id="q-text" style="font-size: 1.1rem; font-weight: 600; color:#222; line-height:1.4;"></p>
        <div id="table-area"></div>
        <div id="options"></div>
        <div id="feedback" class="feedback hidden"></div>
        <button id="next-btn" class="btn-main hidden">CONTINUE →</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align:center;">
        <h1 style="color:var(--lab-blue);">Research Complete!</h1>
        <div style="font-size: 4rem; margin: 20px 0;">🏆</div>
        <p style="font-size: 1.5rem; font-weight:bold;">Final Score: <span id="final-score">0</span> / 13</p>
        <button class="btn-main" onclick="location.reload()">RESTART LAB</button>
    </div>
</div>

<script>
    const questions = [
        { q: "Two groups measured the same table. One group used hand spans while another used a measuring tape. Why did this happen?", opts: ["Table changed size", "Hand spans are non-standard units", "Measuring tape is incorrect", "Gravity affects it"], ans: 1, expl: "Hand spans vary between people, making them non-standard." },
        { q: "Assertion (A): Standard units are important. Reason (R): They help people compare measurements accurately.", opts: ["Both A & R true, R explains A", "Both true, R doesn't explain A", "A is true, R is false", "A is false, R is true"], ans: 0, expl: "Standard units ensure universal consistency." },
        { q: "Observe the table: Morning: 37°C | Evening: 38°C. What can be concluded?", opts: ["Temp decreased", "Temp increased", "Temp constant", "Broken thermometer"], ans: 1, expl: "The data shows a 1°C increase." },
        { q: "Why is a thermometer better than touching the forehead to check temperature?", opts: ["Reduces fever", "Provides accurate standard units", "Touch increases heat", "Measures weight"], ans: 1, expl: "Thermometers give precise numerical values." },
        { q: "Milk is usually sold in litres instead of kilograms because litres measure:", opts: ["Force", "Liquid capacity", "Temperature", "Distance"], ans: 1, expl: "Litres measure volume/capacity." },
        { q: "Error check: 'The classroom is 700 grams long.'", opts: ["Wrong unit", "Wrong room", "Cannot measure length", "Grams are for distance"], ans: 0, expl: "Grams measure mass, not length." },
        { q: "Why are city distances measured in kilometres instead of metres?", opts: ["Km is for long distances", "Metres are incorrect", "Km reduces distance", "Metres increase speed"], ans: 0, expl: "Km is standard for large geographical distances." },
        { q: "What is the best reason to use a stopwatch for a race?", opts: ["Reduces time", "Increases accuracy", "Counting is heavy", "Measures speed"], ans: 1, expl: "Stopwatches provide high scientific precision." },
        { q: "Odd One Out:", opts: ["Metre", "Kilometre", "Centimetre", "Litre"], ans: 3, expl: "Litre is for volume; others are for length." },
        { q: "Why do scientists prefer a measuring cylinder over a normal glass?", opts: ["Changes color", "Precise volume measurement", "Reduces liquid", "Increases heat"], ans: 1, expl: "Cylinders have marked graduations for accuracy." },
        { q: "Why did hand spans give different results in the Science Fair?", opts: ["Desk grew", "Non-standard units", "Ruler error", "Gravity change"], ans: 1, expl: "Hand sizes vary from person to person." },
        { q: "A measuring cylinder is mainly used to measure:", opts: ["Mass", "Temperature", "Liquid volume", "Force"], ans: 2, expl: "It is the standard tool for liquid capacity." },
        { q: "Why are standard measuring instruments important in science?", opts: ["Reduce gravity", "Accurate and uniform data", "Increase speed", "Remove all errors"], ans: 1, expl: "They ensure data is consistent and reliable." }
    ];

    let current = 0, score = 0, attempts = 0;
    const sfxCorrect = new Audio('assets/correct.mp3');
    const sfxWrong = new Audio('assets/wrong.mp3');

    // Handle Splash -> Intro
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('intro-view').classList.remove('hidden');
        }, 5000); // 5 second Logo Screen
    };

    function startLab() {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-area').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        attempts = 0;
        const q = questions[current];
        document.getElementById('q-num').innerText = "Q" + (current + 1);
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        const tableArea = document.getElementById('table-area');
        tableArea.innerHTML = (current === 2) ? 
            `<table class="data-table"><tr><td>Morning</td><td>37°C</td></tr><tr><td>Evening</td><td>38°C</td></tr></table>` : "";

        const optContainer = document.getElementById('options');
        optContainer.innerHTML = '';
        q.opts.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAns(i, btn);
            optContainer.appendChild(btn);
        });
    }

    function checkAns(idx, btn) {
        const correct = questions[current].ans;
        const allBtns = document.querySelectorAll('.opt-btn');

        if(idx === correct) {
            btn.classList.add('correct');
            allBtns.forEach(b => b.disabled = true);
            score++;
            document.getElementById('score-val').innerText = score * 100;
            sfxCorrect.play().catch(()=>{});
            showFeedback();
        } else {
            attempts++;
            btn.classList.add('wrong');
            btn.disabled = true;
            sfxWrong.play().catch(()=>{});
            
            if(attempts >= 2) {
                allBtns.forEach(b => b.disabled = true);
                allBtns[correct].classList.add('correct');
                showFeedback();
            }
        }
    }

    function showFeedback() {
        const fb = document.getElementById('feedback');
        fb.innerHTML = "<b>Lab Analysis:</b> " + questions[current].expl;
        fb.classList.remove('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    document.getElementById('next-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
        }
    };
</script>
<style> @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } </style>
</body>
</html>
