<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G5 Measurement Lab</title>
    <style>
        :root {
            --lab-blue: #1a73e8;
            --lab-gold: #f9ab00;
            --lab-success: #1e8e3e;
            --lab-danger: #d93025;
            --bg-shade: #f1f3f4;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-shade);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            padding: 25px;
            margin: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            min-height: 550px;
            border-top: 8px solid var(--lab-blue);
        }

        /* SPLASH SCREEN */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .logo-img { width: 280px; height: auto; max-width: 85%; margin-bottom: 30px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--lab-blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* UI ELEMENTS */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .q-badge { background: var(--lab-blue); color: white; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; }
        .score-txt { font-weight: 800; color: var(--lab-blue); }

        .timer-track { width: 100%; height: 8px; background: #e8eaed; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--lab-blue); transition: width 1s linear; }

        .q-text { font-size: 1.1rem; font-weight: 600; line-height: 1.4; margin-bottom: 20px; color: #202124; }
        
        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .data-table td { border: 1px solid #dadce0; padding: 12px; text-align: left; font-size: 0.95rem; }

        .options-stack { display: grid; gap: 12px; }
        .opt-btn {
            background: #fff; border: 2px solid #dadce0; padding: 16px;
            border-radius: 14px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s;
            font-weight: 500; color: #3c4043;
        }
        .opt-btn.correct { background: var(--lab-success) !important; color: white; border-color: var(--lab-success); }
        .opt-btn.wrong { background: var(--lab-danger) !important; color: white; border-color: var(--lab-danger); opacity: 0.7; }

        .feedback { margin-top: 15px; padding: 15px; border-radius: 14px; display: none; line-height: 1.5; font-size: 0.95rem; }
        .hint { background: #fff7e0; border-left: 5px solid var(--lab-gold); color: #856404; }
        .expl { background: #e8f0fe; border-left: 5px solid var(--lab-blue); color: #1967d2; }

        #next-btn { width: 100%; margin-top: 20px; padding: 18px; background: var(--lab-blue); color: white; border: none; border-radius: 16px; font-weight: 700; font-size: 1rem; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" class="logo-img" alt="Innovine">
        <div class="loader"></div>
    </div>

    <div id="intro-view" class="hidden" style="text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 15px;">📏</div>
        <h1 style="color: var(--lab-blue); margin: 0;">Measurement Lab</h1>
        <p style="color: #5f6368; margin-top: 10px;">Scientific Accuracy Challenge</p>
        <button id="start-btn" style="width:100%; padding:20px; background:var(--lab-blue); color:white; border:none; border-radius:50px; font-weight:bold; font-size:1.1rem; cursor:pointer; margin-top: 20px;">INITIALIZE MISSION</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="header">
            <div class="q-badge" id="q-label">Q1</div>
            <div class="score-txt">XP: <span id="score-val">0</span></div>
        </div>
        <div class="timer-track"><div id="timer-bar"></div></div>
        
        <div id="q-text" class="q-text"></div>
        <div id="table-area"></div>
        
        <div id="options-area" class="options-stack"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="next-btn" class="hidden">CONTINUE →</button>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <div style="font-size: 4.5rem; margin-bottom: 10px;">🔬</div>
        <h2 style="color: var(--lab-blue);">Lab Mission Accomplished</h2>
