<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Electro-Guard: Mission Control</title>
    <style>
        :root {
            --primary-blue: #4361ee;
            --electric-yellow: #ffd60a;
            --success-green: #2ec4b6;
            --error-red: #e71d36;
            --light-bg: #f0f2f5;
            --text-dark: #2b2d42;
            --panel-white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-white);
            border-radius: 28px;
            padding: 25px;
            margin: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            min-height: 550px;
            border-top: 10px solid var(--primary-blue);
        }

        /* --- SPLASH SCREEN (Blinks Once) --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: blinkOnce 2s ease-in-out forwards;
        }

        .splash-logo {
            max-width: 200px;
            max-height: 200px;
            object-fit: contain;
        }

        @keyframes blinkOnce {
            0% { opacity: 0; }
            25% { opacity: 1; }
            75% { opacity: 1; }
            100% { opacity: 0; pointer-events: none; }
        }

        /* --- GAME UI --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .case-badge { background: var(--primary-blue); color: white; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 0.8rem; letter-spacing: 1px; }
        .score-box { font-weight: 800; color: var(--primary-blue); }

        .question-text { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
        
        .image-container { 
            width: 100%; margin-bottom: 20px; border-radius: 15px; overflow: hidden; border: 2px solid #f1f3f5;
            display: flex; justify-content: center; background: #fff; padding: 10px;
        }
        .q-img { max-height: 160px; object-fit: contain; display: block; }

        .options-grid { display: grid; gap: 12px; }
        .opt-btn {
            background: #fff; border: 2px solid #edf2f4; padding: 16px;
            border-radius: 15px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s;
            color: var(--text-dark); font-weight: 500; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .opt-btn:hover { border-color: var(--primary-blue); }
        
        .opt-btn.correct { background: var(--success-green) !important; color: white; border-color: var(--success-green); transform: scale(1.02); }
        .opt-btn.wrong { background: var(--error-red) !important; color: white; border-color: var(--error-red); opacity: 0.7; }

        .feedback { margin-top: 20px; padding: 15px; border-radius: 15px; display: none; line-height: 1.5; margin-bottom: 10px; animation: slideUp 0.4s ease; }
        .hint-mode { background: #fff3cd; border-left: 5px solid var(--electric-yellow); color: #856404; }
        .expl-mode { background: #d1ecf1; border-left: 5px solid var(--primary-blue); color: #0c5460; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #action-btn { 
            width: 100%; margin-top: 20px; padding: 18px; 
            background: var(--primary-blue); color: white; 
            border: none; border-radius: 16px; font-weight: 800; 
            font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo" class="splash-logo">
    </div>

    <div id="intro-view" class="hidden" style="text-align: center;">
        <div style="margin-bottom: 15px;">
           
        </div>
        <h1 style="color: var(--primary-blue); margin: 0; font-weight: 800;">Electro-Guard</h1>
        <p style="color: #6c757d; margin-top: 5px; margin-bottom: 20px;">Electrical Safety Mission Control</p>
        <div style="background: #f8f9fa; padding: 20px; border-radius: 20px; margin: 25px 0; text-align: left; border: 1px dashed #dee2e6;">
            The city's power systems need urgent inspection. You have <b>2 attempts</b> per critical node. Can you stabilize the network?
        </div>
        <button id="start-btn" style="width:100%; padding:20px; background:var(--primary-blue); color:white; border:none; border-radius:50px; font-weight:bold; font-size:1.1rem; cursor:pointer;">ENGAGE SYSTEM</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="header">
            <div class="case-badge">NODE #<span id="q-num">1</span></div>
            <div class="score-box">VOLTS: <span id="score-val">0</span>V</div>
        </div>
        <div id="q-text" class="question-text"></div>
        <div id="image-area"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">CONTINUE →</button>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <div id="result-icon" style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
        <h2 style="color: var(--primary-blue);">Mission Report</h2>
        <div style="font-size: 4.5rem; font-weight: 900; color: var(--text-dark); margin: 10px 0;"><span id="final-pts">0</span>/1000</div>
        <p id="result-msg" style="color:#6c757d; margin-bottom:30px; line-height: 1.4;"></p>
        <button onclick="location.reload()" style="width:100%; padding:18px; background:var(--primary-blue); color:white; border:none; border-radius:16px; font-weight:700; cursor:pointer;">REBOOT SYSTEM</button>
    </div>
</div>

<script>
    const questions = [
        { q: "An electrician is repairing a room heater. He notices the 'element' is broken. Why can't he just replace it with a regular copper wire?", opts: ["Copper is too expensive.", "Copper doesn't conduct electricity.", "Copper has low resistance and won't glow red-hot like the element.", "Copper will melt the heater's plastic body."], ans: 2, hint: "Consider the property needed to generate high amounts of heat energy.", expl: "Heating elements need high resistance to generate heat. Copper has low resistance, making it an excellent path for current, but it won't glow red-hot." },
        { q: "If Bulb A fuses (breaks), what happens to Bulb B?", img: "assets/q2.png", opts: ["It glows brighter.", "It stops glowing because the circuit is now open.", "It stays the same.", "It flickers."], ans: 1, hint: "Look at whether electricity has a secondary path to loop through.", expl: "In a series circuit configuration, there is only one complete continuous loop. If one component breaks, the line opens and all flow terminates." },
        { q: "A fuse wire is labelled '5A'. If a current of 8A flows through the circuit, what will happen?", opts: ["The appliance will work faster.", "The wire will turn green.", "The wire will melt and break the circuit to prevent a fire.", "Nothing will happen."], ans: 2, hint: "A fuse acts as an intentional structural weak point.", expl: "Fuses are protective safety barriers. Exceeding their current load threshold heats up and melts the structural wire link to block hazards." },
        { q: "You want to make an electromagnet stronger to lift heavier iron scrap. Which action helps?", opts: ["Using a plastic core instead of iron.", "Decreasing the number of coils.", "Increasing the number of turns in the coil.", "Using a thinner wire."], ans: 2, hint: "Think about wrapping more fields around the core material.", expl: "The magnetic field strength is directly proportional to loop density. Increasing coil wraps intensifies the structural magnetic pull." },
        { q: "Sneha connects a battery where the positive terminal of one cell touches the positive terminal of the next. Why won't the bulb glow?", opts: ["The cells are too old.", "The cells must be connected positive-to-negative to allow current flow.", "The bulbs are afraid of the battery.", "High voltage is produced."], ans: 1, hint: "Examine how polarity orientation directs structural movement.", expl: "Chemical energy cells require matching chain orientations (+ to -) to generate standard forward loop currents." },
        { q: "Which of these appliances does NOT work on the heating effect of electric current?", opts: ["Electric Iron", "Geyser", "Electric Bell", "Toaster"], ans: 2, hint: "One of these options turns electrical energy into structural movement sound waves.", expl: "Electric irons, geysers, and toasters generate explicit thermal properties. Electric bells function fundamentally on magnetic properties." },
        { q: "Why is a fuse called a 'safety device'?", opts: ["It provides extra electricity.", "It breaks the circuit during short-circuits to prevent damage.", "It makes the bulb glow brighter.", "It saves money on bills."], ans: 1, hint: "What protection does it trigger when a circuit fails?", expl: "Fuses isolate system overloads. They stop short circuits from over-heating local infrastructure." },
        { q: "What happens to the iron strip when the switch is pressed?", img: "assets/q8.jpg", opts: ["It gets attracted to the electromagnet.", "It repels the electromagnet.", "It turns into a battery.", "It melts."], ans: 0, hint: "An iron piece reacts to the presence of structural fields.", expl: "Pressing the switch turns on the magnetic field, drawing the structural strip forward to ring the bell." },
        { q: "Identify the odd one out based on the effect used: Electric Heater, Electric Fuse, Electric Kettle, Electric Fan.", opts: ["Electric Heater", "Electric Fuse", "Electric Kettle", "Electric Fan"], ans: 3, hint: "Which system yields mechanical movement over raw heat generation?", expl: "Heaters, fuses, and kettles use the heating effect. The fan uses magnetic forces to turn its internal motor mechanism." },
        { q: "A technician uses an MCB (Miniature Circuit Breaker) instead of a wire fuse. What is the main advantage?", opts: ["It is cheaper.", "It can be reset easily without replacing a wire.", "It produces light.", "It works without electricity."], ans: 1, hint: "What physical work must you perform when it triggers?", expl: "An MCB utilizes a mechanical toggle switch that trips open. It can be easily flicked back into service without replacing parts." }
    ];

    let current = 0, score = 0, attempts = 0;
    
    // --- AUDIO INSTANCES ---
    const sndC = new Audio('assets/correct.mp3');
    const sndW = new Audio('assets/wrong.mp3');
    const sndF = new Audio('assets/freesound_community-claps-44774.mp3');

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro-view').classList.remove('hidden');
        }, 2000);
    };

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        loadQuestion();
    };

    function loadQuestion() {
        attempts = 0;
        const q = questions[current];
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('q-text').innerText = q.q;
        
        const imgArea = document.getElementById('image-area');
        imgArea.innerHTML = q.img ? `<div class="image-container"><img src="${q.img}" class="q-img"></div>` : "";
        
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => handleChoice(i, b);
            area.appendChild(b);
        });
    }

    function handleChoice(i, b) {
        if(i === questions[current].ans) {
            b.classList.add('correct');
            score += 100;
            document.getElementById('score-val').innerText = score;
            sndC.play().catch(e => console.log("Audio waiting for interaction"));
            endTurn();
        } else {
            attempts++;
            b.classList.add('wrong');
            b.disabled = true;
            sndW.play().catch(e => console.log("Audio waiting for interaction"));
            if(attempts === 1) {
                const f = document.getElementById('feedback-box');
                f.className = 'feedback hint-mode';
                f.innerHTML = "🔍 <b>DIAGNOSTIC HINT:</b> " + questions[current].hint;
                f.style.display = 'block';
            } else {
                endTurn();
            }
        }
    }

    function endTurn() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        document.querySelectorAll('.opt-btn')[questions[current].ans].classList.add('correct');
        const f = document.getElementById('feedback-box');
        f.className = 'feedback expl-mode';
        f.innerHTML = "📋 <b>ENGINEER NOTE:</b> " + questions[current].expl;
        f.style.display = 'block';
        document.getElementById('action-btn').classList.remove('hidden');
    }

    document.getElementById('action-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else showResults();
    };

    function showResults() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        document.getElementById('final-pts').innerText = score;
        
        sndF.play().catch(e => console.log("Audio playback blocked"));
        
        const msg = document.getElementById('result-msg');
        if(score >= 900) msg.innerText = "Exceptional! The grid is fully operational. Grid security level is optimal.";
        else if(score >= 700) msg.innerText = "System stabilized. Normal operations successfully resumed.";
        else msg.innerText = "Suboptimal performance. Review standard schematics to handle high power lines.";
    }
</script>
</body>
</html>
