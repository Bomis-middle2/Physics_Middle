<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spark City: Electrical Inspector</title>
    <style>
        :root {
            --primary-blue: #4361ee;
            --electric-yellow: #ffd60a;
            --success-green: #2ec4b6;
            --error-red: #e71d36;
            --light-bg: #f8f9fa;
            --text-dark: #2b2d42;
            --panel-white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-white);
            border-radius: 24px;
            padding: 25px;
            margin: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            min-height: 520px;
            border-top: 8px solid var(--primary-blue);
        }

        /* --- LOGO SPLASH SCREEN --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .logo-main {
            width: 280px;
            height: auto;
            max-width: 85%;
            margin-bottom: 20px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-blue);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- UI ELEMENTS --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .case-label { background: var(--primary-blue); color: white; padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; }
        .score-display { color: var(--primary-blue); font-weight: 800; font-size: 1rem; }

        .timer-track { width: 100%; height: 10px; background: #edf2f4; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--primary-blue); transition: width 1s linear; }

        .question-text { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin-bottom: 15px; color: var(--text-dark); }
        
        .img-container { width: 100%; margin-bottom: 15px; text-align: center; border: 1px solid #dee2e6; border-radius: 12px; overflow: hidden; }
        .q-img { max-width: 100%; height: auto; display: block; margin: 0 auto; }

        .options-grid { display: grid; gap: 10px; }
        .opt-btn {
            background: #fff; border: 2px solid #edf2f4; padding: 14px;
            border-radius: 12px; text-align: left; font-size: 0.95rem; cursor: pointer; transition: 0.2s;
            color: var(--text-dark); font-weight: 500;
        }
        
        .opt-btn.correct { background: var(--success-green) !important; color: white; border-color: var(--success-green); }
        .opt-btn.wrong { background: var(--error-red) !important; color: white; border-color: var(--error-red); }

        .feedback { margin-top: 15px; padding: 15px; border-radius: 12px; display: none; line-height: 1.4; font-size: 0.9rem; }
        .expl-box { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }

        #action-btn { 
            width: 100%; margin-top: 20px; padding: 18px; 
            background: var(--primary-blue); color: white; 
            border: none; border-radius: 14px; font-weight: 700; 
            font-size: 1rem; cursor: pointer; 
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" class="logo-main" alt="Innovine Solutions">
        <div class="loader"></div>
    </div>

    <div id="intro-view" class="hidden" style="text-align: center;">
        <h1 style="color: var(--primary-blue); margin-top: 0;">Spark City</h1>
        <p style="color: #6c757d; font-size: 1rem;">Electrical Inspector Mission</p>
        <div style="background: #f1f3f5; padding: 20px; border-radius: 15px; margin: 25px 0; text-align: left; font-size: 0.95rem;">
            Welcome, Young Scientist! Today you are an electrical inspector. Use your knowledge of circuits and safety to solve problems in Spark City.
        </div>
        <button id="start-btn" style="width:100%; padding:20px; background:var(--primary-blue); color:white; border:none; border-radius:50px; font-weight:bold; font-size:1.1rem; cursor:pointer;">BEGIN INSPECTION</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="header">
            <div class="case-label">CASE <span id="q-num">1</span></div>
            <div class="score-display">POINTS: <span id="score-val">0</span></div>
        </div>
        
        <div class="timer-track"><div id="timer-bar"></div></div>
        <div id="q-text" class="question-text"></div>
        <div id="image-area"></div>
        <div id="options-area" class="options-grid"></div>
        
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">NEXT CASE →</button>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <h2 style="color: var(--primary-blue);">Mission Report</h2>
        <div style="font-size: 4rem; font-weight: 900; color: var(--text-dark); margin: 20px 0;"><span id="final-pts">0</span>/10</div>
        <p id="result-msg" style="color:#6c757d; margin-bottom:30px;"></p>
        <button onclick="location.reload()" style="width:100%; padding:18px; background:var(--primary-blue); color:white; border:none; border-radius:14px; font-weight:700; cursor:pointer;">RESTART MISSION</button>
    </div>
</div>

<script>
    const questions = [
        { q: "Riya's clock stopped. She put the negative (flat) end against the spring where the positive (cap) used to be. Why won't it work?", opts: ["The cell is fused", "Chemicals can't react upside down", "Terminals are reversed, blocking current flow", "Dry cells only work in torches"], ans: 2, expl: "Terminals must be aligned correctly for the current to flow correctly through the clock's circuit." },
        { q: "What happens if a Dry Cell is missing its Ammonium Chloride paste?", img: "q2.png", opts: ["Produces more power", "The chemical reaction would not take place", "Rod turns to metal", "Zinc container melts"], ans: 1, expl: "Electricity is produced by chemical reactions. No chemicals means no energy can be generated." },
        { q: "Arjun connects both wires from the same positive terminal to a bulb. Why does it NOT glow?", opts: ["Copper wires don't conduct", "Path is not complete (must use both terminals)", "It will explode without a switch", "Needs plastic wires"], ans: 1, expl: "To form a complete circuit, wires must connect to both the positive and negative terminals." },
        { q: "Which is LEAST safe to use as a barrier when touching a live wire?", opts: ["Dry rubber gloves", "Thick plastic sheet", "A metal ruler held with a cloth", "A dry wooden plank"], ans: 2, expl: "Metal is a conductor. Even if held with a cloth, the current can travel through the ruler to your hand." },
        { q: "A 'fused' bulb has a broken tungsten filament. Why does it stay dark?", opts: ["Glass blocks the electricity", "The broken filament creates a 'break' in the circuit", "Battery is too strong", "Only works with secondary cells"], ans: 1, expl: "A broken filament acts like an open switch, creating a gap that stops the flow of electricity." },
        { q: "Data: Steel glows, Rubber doesn't, Graphite glows. Which material should cover an electric plug?", opts: ["Steel key material", "Rubber eraser material", "Graphite material", "Any of these"], ans: 1, expl: "Rubber is an insulator. It stops electricity from reaching your hand, keeping you safe." },
        { q: "Statement: Never touch a switch with wet hands. Reason: Pure water is a perfect insulator.", opts: ["Both are true", "Statement is true, Reason is false (tap water conducts)", "Statement is false, Reason is true", "Both are false"], ans: 1, expl: "While pure water is an insulator, the water from taps contains minerals that make it conduct electricity." },
        { q: "Why is it dangerous to pull a kite from power lines with a metallic rod?", opts: ["Kite might tear", "Metal conducts current to your body", "Rod is too heavy", "Electricity stays in wires"], ans: 1, expl: "High-voltage electricity will travel down the metal rod through your body to reach the ground." },
        { q: "To turn a light ON using a safety-pin switch, what must the pin do?", img: "q9.png", opts: ["Be removed completely", "Touch both drawing pins to complete the path", "Be covered with tape", "Touch the battery"], ans: 1, expl: "Touching both drawing pins creates a complete path for the electricity to flow." },
        { q: "What is the most sustainable choice for a field bulb using sun energy?", opts: ["Primary Dry Cell", "Solar Cell", "Button Cell", "Secondary Cell"], ans: 1, expl: "Solar cells convert sunlight directly into electrical energy." }
    ];

    let current = 0, score = 0, timer, timeLeft = 45;

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro-view').classList.remove('hidden');
        }, 5000);
    };

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        loadQuestion();
    };

    function loadQuestion() {
        timeLeft = 45;
        const q = questions[current];
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('q-text').innerText = q.q;
        
        const imgArea = document.getElementById('image-area');
        imgArea.innerHTML = q.img ? `<div class="img-container"><img src="assets/${q.img}" class="q-img"></div>` : "";
        
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => checkAnswer(i, b);
            area.appendChild(b);
        });
        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-bar').style.width = (timeLeft/45*100) + "%";
            if(timeLeft <= 0) { clearInterval(timer); showFeedback(); }
        }, 1000);
    }

    function checkAnswer(i, b) {
        clearInterval(timer);
        const correct = questions[current].ans;
        if(i === correct) {
            b.classList.add('correct');
            score++;
            document.getElementById('score-val').innerText = score * 10;
        } else {
            b.classList.add('wrong');
            document.querySelectorAll('.opt-btn')[correct].classList.add('correct');
        }
        showFeedback();
    }

    function showFeedback() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        const f = document.getElementById('feedback-box');
        f.className = 'feedback expl-box';
        f.innerHTML = "<b>Inspector Finding:</b> " + questions[current].expl;
        f.style.display = 'block';
        document.getElementById('action-btn').classList.remove('hidden');
    }

    document.getElementById('action-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else {
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('final-pts').innerText = score;
            document.getElementById('result-msg').innerText = score >= 7 ? "Excellent job, Inspector!" : "Keep practicing your skills!";
        }
    };
</script>
</body>
</html>
