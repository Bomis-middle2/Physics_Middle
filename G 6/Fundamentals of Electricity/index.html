<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spark City: Electrical Inspector</title>
    <style>
        :root {
            --electric-blue: #00d4ff;
            --volt-yellow: #fee440;
            --danger-red: #ff0054;
            --circuit-bg: #0a1128;
            --panel-bg: #1282a2;
            --success: #2ec4b6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--circuit-bg);
            background-image: radial-gradient(var(--panel-bg) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            color: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 450px;
            background: rgba(2, 62, 138, 0.95);
            border: 3px solid var(--electric-blue);
            border-radius: 25px;
            padding: 20px;
            margin: 10px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* --- SPLASH --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .logo-only { width: 200px; height: auto; }

        /* --- PROGRESS --- */
        .header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .badge { background: var(--volt-yellow); color: #000; padding: 4px 10px; border-radius: 15px; font-weight: 800; font-size: 0.75rem; }
        
        .timer-track { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 15px; overflow: hidden; border: 1px solid var(--electric-blue); }
        #timer-bar { height: 100%; width: 100%; background: var(--electric-blue); transition: width 1s linear; }

        /* --- CONTENT --- */
        .question-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; border-left: 4px solid var(--volt-yellow); margin-bottom: 15px; }
        .question-text { font-size: 1.05rem; font-weight: 600; line-height: 1.4; }
        
        .img-container { width: 100%; margin-bottom: 15px; border-radius: 10px; overflow: hidden; background: #fff; }
        .q-img { width: 100%; height: auto; display: block; }

        .options-grid { display: grid; gap: 10px; }
        .opt-btn {
            background: rgba(255, 255, 255, 0.1); 
            border: 2px solid rgba(255, 255, 255, 0.2); 
            padding: 14px; border-radius: 12px; color: #fff;
            text-align: left; font-size: 0.95rem; cursor: pointer;
        }
        
        .opt-btn.correct { background: var(--success) !important; border-color: #fff; }
        .opt-btn.wrong { background: var(--danger-red) !important; border-color: #fff; }

        .feedback { margin-top: 15px; padding: 12px; border-radius: 12px; display: none; font-size: 0.9rem; line-height: 1.4; }
        .hint-box { background: var(--volt-yellow); color: #000; }
        .expl-box { background: #fff; color: #000; }

        #action-btn { 
            width: 100%; margin-top: 15px; padding: 16px; 
            background: var(--volt-yellow); color: #000; 
            border: none; border-radius: 12px; font-weight: 800; cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen"><img src="assets/logo.png" class="logo-only"></div>

    <div id="intro-view" class="hidden" style="text-align:center;">
        <h1 style="color:var(--volt-yellow);">SPARK CITY</h1>
        <p>Master the circuits and keep the city glowing!</p>
        <button id="start-btn" style="width:100%; padding:18px; background:var(--volt-yellow); border:none; border-radius:50px; font-weight:900; margin-top:20px;">START INSPECTION</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="header">
            <div class="badge">Case <span id="q-num">1</span></div>
            <div style="color:var(--volt-yellow); font-weight:800;">XP: <span id="score-val">0</span></div>
        </div>
        <div class="timer-track"><div id="timer-bar"></div></div>
        <div class="question-box"><div id="q-text" class="question-text"></div></div>
        <div id="image-area"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">NEXT CASE →</button>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <h2 style="color:var(--volt-yellow);">INSPECTION COMPLETE</h2>
        <div style="font-size:4rem; font-weight:900;"><span id="final-pts">0</span>/10</div>
        <button onclick="location.reload()" style="width:100%; padding:15px; background:var(--electric-blue); color:#fff; border:none; border-radius:12px; font-weight:700;">RESTART</button>
    </div>
</div>
