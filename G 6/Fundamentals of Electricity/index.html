<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spark City: Electrical Inspector</title>
    <style>
        :root {
            --primary-blue: #4361ee;
            --electric-yellow: #ffd60a;
            --success-green: #2ec4b6;
            --error-red: #e71d36;
            --light-bg: #f0f2f5;
            --text-dark: #2b2d42;
            --panel-white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-white);
            border-radius: 28px;
            padding: 25px;
            margin: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            min-height: 550px;
            border-top: 10px solid var(--primary-blue);
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .logo-main { width: 260px; height: auto; max-width: 80%; margin-bottom: 20px; }

        /* --- GAME UI --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .case-badge { background: var(--primary-blue); color: white; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 0.8rem; letter-spacing: 1px; }
        .score-box { font-weight: 800; color: var(--primary-blue); }

        .timer-track { width: 100%; height: 8px; background: #e9ecef; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--primary-blue); transition: width 1s linear; }

        .question-text { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
        
        .img-box { width: 100%; margin-bottom: 20px; border-radius: 15px; overflow: hidden; border: 2px solid #f1f3f5; }
        .q-img { width: 100%; display: block; }

        .options-grid { display: grid; gap: 12px; }
        .opt-btn {
            background: #fff; border: 2px solid #edf2f4; padding: 16px;
            border-radius: 15px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s;
            color: var(--text-dark); font-weight: 500; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        
        .opt-btn.correct { background: var(--success-green) !important; color: white; border-color: var(--success-green); transform: scale(1.02); }
        .opt-btn.wrong { background: var(--error-red) !important; color: white; border-color: var(--error-red); opacity: 0.7; }

        .feedback { margin-top: 20px; padding: 15px; border-radius: 15px; display: none; line-height: 1.5; animation: slideUp 0.4s ease; }
        .hint-mode { background: #fff3cd; border-left: 5px solid var(--electric-yellow); color: #856404; }
        .expl-mode { background: #d1ecf1; border-left: 5px solid var(--primary-blue); color: #0c5460; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #action-btn { 
            width: 100%; margin-top: 20px; padding: 18px; 
            background: var(--primary-blue); color: white; 
            border: none; border-radius: 16px; font-weight: 800; 
            font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" class="logo-main" alt="Innovine Solutions">
    </div>

    <div id="intro-view" class="hidden" style="text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 10px;">⚡</div>
        <h1 style="color: var(--primary-blue); margin: 0;">Spark City</h1>
        <p style="color: #6c757d; margin-top: 10px;">Electrical Inspector Level: <b>Junior</b></p>
        <div style="background: #f8f9fa; padding: 20px; border-radius: 20px; margin: 25px 0; text-align: left; border: 1px dashed #dee2e6;">
            Inspect the city's electrical systems. You have <b>2 attempts</b> per case. Can you earn your Master License?
        </div>
        <button id="start-btn" style="width:100%; padding:20px; background:var(--primary-blue); color:white; border:none; border-radius:50px; font-weight:bold; font-size:1.1rem; cursor:pointer;">START MISSION</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="header">
            <div class="case-badge">CASE #<span id="q-num">1</span></div>
            <div class="score-box">XP: <span id="score-val">0</span></div>
        </div>
        <div class="timer-track"><div id="timer-bar"></div></div>
        <div id="q-text" class="question-text"></div>
        <div id="image-area"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">CONTINUE →</button>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <div id="result-icon" style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
        <h2 style="color: var(--primary-blue);">Mission Report</h2>
        <div style="font-size: 4.5rem; font-weight: 900; color: var(--text-dark); margin: 10px 0;"><span id="final-pts">0</span>/10</div>
        <p id="result-msg" style="color:#6c757d; margin-bottom:30px; line-height: 1.4;"></p>
        <button onclick="location.reload()" style="width:100%; padding:18px; background:var(--primary-blue); color:white; border:none; border-radius:16px; font-weight:700; cursor:pointer;">NEW MISSION</button>
    </div>
</div>

<script>
    const questions = [
        { q: "Riya's wall clock stopped. She put the negative (flat) end against the spring where the positive cap should go. Why won't it tick?", opts: ["The cell is fused", "Chemicals can't react upside down", "Terminals are reversed, blocking flow", "Dry cells only work in torches"], ans: 2, hint: "Look at the alignment of the '+' and '-' symbols.", expl: "A circuit needs terminals to match (+ to +) for the current to flow through the device correctly." },
        { q: "Inside a Dry Cell is a chemical paste. If this was missing and the cell was empty, what would happen?", img: "q2.png", opts: ["It produces double power", "The chemical reaction cannot happen", "The carbon rod turns to wire", "The zinc container melts"], ans: 1, hint: "Paste is like the 'fuel' for the battery.", expl: "Electricity is created by a chemical reaction. No paste means no reaction and no power!" },
        { q: "Arjun connects two wires from the SAME positive terminal to a bulb. Why does it stay dark?", opts: ["Copper doesn't conduct", "Path isn't complete (needs both terminals)", "It will explode", "Needs plastic wires"], ans: 1, hint: "A loop needs a start and an end on the battery.", expl: "Electricity must flow out of one terminal and return to the other to form a complete circuit." },
        { q: "Which of these is the LEAST safe barrier for an electrician touching a live wire?", opts: ["Dry rubber gloves", "Thick plastic sheet", "A metal ruler held with cloth", "A dry wooden plank"], ans: 2, hint: "One of these materials is a conductor.", expl: "Metal allows electricity to pass through easily. Even with a cloth, the current will reach your hand instantly." },
        { q: "A 'fused' bulb has a broken tungsten filament. Why does it stay dark?", opts: ["Glass blocks energy", "The broken filament creates a 'break' or gap", "Battery is too strong", "Needs a secondary cell"], ans: 1, hint: "Think of a bridge with a missing middle section.", expl: "Electricity needs a continuous path. A broken filament acts like a gap that stops the flow." },
        { q: "Test Results: Steel glows, Rubber doesn't. Which material should cover an electric plug?", opts: ["Material A (Steel)", "Material B (Rubber)", "Material C (Graphite)", "All are safe"], ans: 1, hint: "You need an 'insulator' to block the shock.", expl: "Rubber is an insulator. it keeps the electricity inside the wire and away from your skin." },
        { q: "Warning: Never touch a switch with wet hands. This is because ordinary water contains minerals that conduct.", opts: ["Statement is true", "Statement is false", "Only true for salt water", "Only true for distilled water"], ans: 0, hint: "Think about why we dry our hands before plugging things in.", expl: "Water from taps or rain contains impurities that make it a conductor, creating a shock risk." },
        { q: "Why is using a metallic rod to pull a kite from power lines extremely dangerous?", opts: ["Kite might tear", "Metal is a conductor; current travels to you", "Rod is too heavy", "Electricity stays in wires"], ans: 1, hint: "Metal acts as a bridge for electricity.", expl: "High-voltage electricity will travel down the metal rod and through your body to reach the ground." },
        { q: "To turn a light ON using a safety-pin switch, what must the pin do?", img: "q9.png", opts: ["Be removed completely", "Touch both drawing pins to bridge the gap", "Be taped down", "Touch the battery"], ans: 1, hint: "You need to 'close' the circuit.", expl: "Closing the gap allows electricity to travel through the switch to the bulb." },
        { q: "Which choice is best for a farmer needing sustainable power from the sun?", opts: ["Primary Dry Cell", "Solar Cell", "Button Cell", "Used Secondary Cell"], ans: 1, hint: "Which one uses light energy?", expl: "Solar cells are designed to convert sunlight directly into electrical energy." }
    ];

    let current = 0, score = 0, attempts = 0, timer, timeLeft = 45;

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro-view').classList.remove('hidden');
        }, 5000);
    };

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        loadQuestion();
    };

    function loadQuestion() {
        attempts = 0; timeLeft = 45;
        const q = questions[current];
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('q-text').innerText = q.q;
        
        const imgArea = document.getElementById('image-area');
        imgArea.innerHTML = q.img ? `<div class="img-box"><img src="assets/${q.img}" class="q-img"></div>` : "";
        
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => handleChoice(i, b);
            area.appendChild(b);
        });
        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-bar').style.width = (timeLeft/45*100) + "%";
            if(timeLeft <= 0) { clearInterval(timer); endTurn(); }
        }, 1000);
    }

    function handleChoice(i, b) {
        if(i === questions[current].ans) {
            clearInterval(timer);
            b.classList.add('correct');
            score++;
            document.getElementById('score-val').innerText = score * 100;
            endTurn();
        } else {
            attempts++;
            b.classList.add('wrong');
            b.disabled = true;
            if(attempts === 1) {
                const f = document.getElementById('feedback-box');
                f.className = 'feedback hint-mode';
                f.innerHTML = "🔍 <b>HINT:</b> " + questions[current].hint;
                f.style.display = 'block';
            } else {
                clearInterval(timer);
                endTurn();
            }
        }
    }

    function endTurn() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        document.querySelectorAll('.opt-btn')[questions[current].ans].classList.add('correct');
        const f = document.getElementById('feedback-box');
        f.className = 'feedback expl-mode';
        f.innerHTML = "📋 <b>INSPECTOR NOTE:</b> " + questions[current].expl;
        f.style.display = 'block';
        document.getElementById('action-btn').classList.remove('hidden');
    }

    document.getElementById('action-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else showResults();
    };

    function showResults() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        document.getElementById('final-pts').innerText = score;
        const msg = document.getElementById('result-msg');
        if(score >= 9) msg.innerText = "Incredible! You've been promoted to Master Inspector. Spark City is safe!";
        else if(score >= 7) msg.innerText = "Great work! You are now a Certified Inspector.";
        else msg.innerText = "Good effort, Apprentice. Keep studying your circuits to earn your license!";
    }
</script>
</body>
</html>
