<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 6 Science - Motion & Measurement</title>
    <style>
        :root {
            --primary: #273c75;
            --accent: #44bd32;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #f5f6fa;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            margin: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Branding Overlay */
        #brand-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.8s ease;
        }
        #brand-layer img { max-width: 200px; }

        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-color: #f5f6fa;
            background-image: radial-gradient(#dcdde1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .game-card {
            width: 95%;
            max-width: 750px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }

        .hidden { display: none !important; }

        .hud {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--primary);
        }

        .timer-track {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 25px;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 1s linear;
        }

        h2 { font-size: 1.1rem; line-height: 1.5; color: #2f3640; margin-bottom: 20px; }

        .options-list { display: grid; gap: 12px; }

        .option-item {
            background: #fff;
            border: 2px solid #f1f2f6;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: 0.2s;
        }

        .option-item:hover:not(:disabled) {
            border-color: var(--accent);
            background: #f1f9f1;
        }

        .correct { background: var(--success) !important; color: white; border-color: #27ae60; }
        .wrong { background: var(--danger) !important; color: white; border-color: #c0392b; }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.95rem;
            background: #eef2f7;
            border-left: 5px solid var(--primary);
        }

        .btn-next {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            cursor: pointer;
            float: right;
            margin-top: 20px;
            font-weight: bold;
        }

        .intro-text { text-align: center; color: #353b48; }
    </style>
</head>
<body>

    <div id="brand-layer">
        <img src="assets/logo.png" alt="Innovine Logo">
    </div>

    <div class="bg-pattern"></div>

    <div class="game-card">
        <div id="screen-start" class="intro-text">
            <h1 style="color:var(--primary)">Motion & Measurement</h1>
            <p><strong>Riya and her friends</strong> are preparing for a science exhibition. Help them solve real-life measurement and motion puzzles!</p>
            <button class="btn-next" style="float:none" onclick="startQuiz()">Enter Exhibition</button>
        </div>

        <div id="screen-quiz" class="hidden">
            <div class="hud">
                <span>QUESTION: <span id="q-count">1</span>/12</span>
                <span>SCORE: <span id="score">0</span></span>
            </div>
            <div class="timer-track"><div id="timer-bar"></div></div>

            <h2 id="q-text"></h2>
            
            <div class="options-list" id="options-box"></div>
            <div id="feedback-box" class="feedback hidden"></div>
            
            <button id="btn-continue" class="btn-next hidden" onclick="nextQuestion()">Continue</button>
        </div>

        <div id="screen-result" class="hidden intro-text">
            <h2 style="font-size: 2rem;">Activity Complete!</h2>
            <h1 id="final-score" style="font-size: 4rem; color: var(--accent);">0/12</h1>
            <p id="result-msg"></p>
            <button class="btn-next" style="float:none" onclick="location.reload()">Restart</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "Riya measures a classroom using her footsteps. Her friend measures the same room and gets a different answer. Why?",
                options: ["The classroom changed size.", "Their footsteps are of different lengths.", "One student counted wrongly.", "The floor is uneven."],
                ans: 1,
                hint: "Is everyone's foot the same size?",
                explain: "Footsteps are non-standard units. Because everyone has different foot sizes, the measurement will vary."
            },
            {
                q: "A tailor measures cloth using a measuring tape instead of a hand span. What is the main advantage?",
                options: ["Faster measurement", "Cloth appears longer", "Uniform and accurate measurement", "Easier folding"],
                ans: 2,
                hint: "A tape is the same for everyone in the world.",
                explain: "A measuring tape is a standard tool, ensuring the measurement is consistent no matter who uses it."
            },
            {
                q: "A student wants to measure the thickness of a coin. Which unit is most suitable?",
                options: ["Kilometre", "Metre", "Centimetre", "Millimetre"],
                ans: 3,
                hint: "A coin is very, very thin.",
                explain: "Millimetre (mm) is the smallest metric unit here, perfect for measuring tiny thicknesses."
            },
            {
                q: "Distances travelled to school: Aman (500 m), Neha (2 km), Kabir (800 m), Sara (1 km). Who travels the longest?",
                options: ["Aman", "Neha", "Kabir", "Sara"],
                ans: 1,
                hint: "Convert all to metres. 1 km = 1000 m.",
                explain: "Neha travels 2 km (2000 m), which is more than 1000 m (Sara), 800 m (Kabir), or 500 m (Aman)."
            },
            {
                q: "A student measures a pencil starting from the 1 cm mark and reads 15 cm at the other end. What is the true length?",
                options: ["Accept 15 cm", "Add 1 cm", "Subtract starting reading from final reading", "Ignore the reading"],
                ans: 2,
                hint: "If you didn't start at 0, you must account for that gap.",
                explain: "True length = Final Reading - Initial Reading (15cm - 1cm = 14cm)."
            },
            {
                q: "Rohan wants to measure the length of a curved garden path. Which method should he use?",
                options: ["Measure with a ruler only", "Use a string and then measure it", "Guess the distance", "Count footsteps"],
                ans: 1,
                hint: "Rulers don't bend well. What can you lay along a curve?",
                explain: "Lay a string along the curve, mark the ends, and then straighten the string against a ruler."
            },
            {
                q: "Assertion: A passenger in a moving bus is in motion. Reason: Motion depends on the reference point.",
                options: ["Both are correct and Reason explains Assertion", "Both correct but Reason doesn't explain", "Assertion correct but Reason wrong", "Assertion wrong but Reason correct"],
                ans: 0,
                hint: "To a person on the road, you move. To the seat next to you, you don't move.",
                explain: "Motion is relative. It depends on who is watching and from where (the reference point)."
            },
            {
                q: "A ceiling fan rotates continuously at the same speed. This motion is:",
                options: ["Translatory motion", "Circular motion", "Oscillatory motion", "Rectilinear motion"],
                ans: 1,
                hint: "The blades move around a fixed center point.",
                explain: "In circular motion, an object moves along a circular path around a center."
            },
            {
                q: "A car moves slowly in traffic and faster on an open road. This motion is:",
                options: ["Uniform motion", "Non-uniform motion", "Circular motion", "Vibratory motion"],
                ans: 1,
                hint: "Does the car cover the same distance every minute?",
                explain: "Because the speed changes, it is non-uniform motion."
            },
            {
                q: "Identify the odd one out: Swing, Pendulum, Vibrating string, Moving train.",
                options: ["Swing", "Pendulum", "Vibrating string", "Moving train"],
                ans: 3,
                hint: "Three of these go back-and-forth (Periodic).",
                explain: "Swing, Pendulum, and Strings show periodic/oscillatory motion. A train moves in a line (rectilinear)."
            },
            {
                q: "Meera walks 600m in 10 mins. Her brother walks 600m in 6 mins. Who is moving faster?",
                options: ["Meera", "Brother", "Both have same speed", "Cannot be determined"],
                ans: 1,
                hint: "Who took less time to cover the same distance?",
                explain: "The brother covers the same distance in less time, meaning his speed is higher."
            },
            {
                q: "When a screw is tightened with a screwdriver, which motions occur together?",
                options: ["Only translatory", "Only circular", "Circular and translatory", "Oscillatory"],
                ans: 2,
                hint: "The screw turns (rotates) and moves forward into the wood.",
                explain: "The turning is circular motion, and the forward movement is translatory motion."
            }
        ];

        let curIdx = 0, score = 0, timer, timeLeft = 45, attempts = 0;

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('brand-layer').style.opacity = '0';
                setTimeout(() => document.getElementById('brand-layer').classList.add('hidden'), 800);
            }, 3000);
        };

        function startQuiz() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const data = questions[curIdx];
            attempts = 0;
            document.getElementById('q-count').innerText = curIdx + 1;
            document.getElementById('q-text').innerText = data.q;
            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('btn-continue').classList.add('hidden');
            
            const box = document.getElementById('options-box');
            box.innerHTML = '';
            data.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-item';
                btn.innerText = opt;
                btn.onclick = () => checkAns(i, btn);
                box.appendChild(btn);
            });
            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 45;
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';
            timer = setInterval(() => {
                timeLeft--;
                bar.style.width = (timeLeft/45 * 100) + '%';
                if(timeLeft <= 0) { clearInterval(timer); revealCorrect(); }
            }, 1000);
        }

        function checkAns(idx, btn) {
            const data = questions[curIdx];
            const feedback = document.getElementById('feedback-box');
            
            if(idx === data.ans) {
                clearInterval(timer);
                btn.classList.add('correct');
                score++;
                document.getElementById('score').innerText = score;
                feedback.innerHTML = `<strong>Correct!</strong> ${data.explain}`;
                feedback.classList.remove('hidden');
                disableOptions();
                document.getElementById('btn-continue').classList.remove('hidden');
            } else {
                attempts++;
                btn.classList.add('wrong');
                btn.disabled = true;
                if(attempts === 1) {
                    feedback.innerHTML = `<strong>Think again!</strong> Hint: ${data.hint}`;
                    feedback.classList.remove('hidden');
                } else {
                    clearInterval(timer);
                    revealCorrect();
                }
            }
        }

        function revealCorrect() {
            const data = questions[curIdx];
            const btns = document.querySelectorAll('.option-item');
            btns[data.ans].classList.add('correct');
            document.getElementById('feedback-box').innerHTML = `<strong>Science Fact:</strong> ${data.explain}`;
            document.getElementById('feedback-box').classList.remove('hidden');
            disableOptions();
            document.getElementById('btn-continue').classList.remove('hidden');
        }

        function disableOptions() {
            document.querySelectorAll('.option-item').forEach(b => b.disabled = true);
        }

        function nextQuestion() {
            curIdx++;
            if(curIdx < questions.length) loadQuestion();
            else showResult();
        }

        function showResult() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score}/12`;
            let msg = "";
            if(score === 12) msg = "Fantastic! You successfully applied concepts of measurement and motion to real-life situations.";
            else if(score > 8) msg = "Great job! You are a Measurement Master.";
            else msg = "Good effort! Remember: Always use standard units for accuracy.";
            document.getElementById('result-msg').innerText = msg;
        }
    </script>
</body>
</html>
