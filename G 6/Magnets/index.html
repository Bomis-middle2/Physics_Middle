<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magnetism Challenge</title>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --error: #e71d36;
            --bg: #f8f9fa;
            --text: #2b2d42;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            min-height: 480px;
        }

        /* Splash Screen */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .logo-only {
            width: 250px;
            height: auto;
            max-width: 85%;
            object-fit: contain;
        }

        /* Quiz UI */
        .header { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 10px; font-size: 0.9rem; }
        .timer-track { width: 100%; height: 8px; background: #edf2f4; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--primary); transition: width 1s linear; }

        .question-text { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin-bottom: 15px; }
        
        /* Image Logic */
        .img-container { width: 100%; margin: 15px 0; text-align: center; background: #fdfdfd; border-radius: 12px; }
        .q-img { max-width: 100%; height: auto; border-radius: 12px; border: 1px solid #eee; display: block; margin: 0 auto; }

        .options-grid { display: grid; gap: 12px; }
        .opt-btn {
            background: #fff; border: 2px solid #edf2f4; padding: 16px;
            border-radius: 14px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        .opt-btn.correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .opt-btn.wrong { background: var(--error) !important; color: white; border-color: var(--error); }

        .feedback { margin-top: 20px; padding: 15px; border-radius: 12px; display: none; line-height: 1.5; font-size: 0.95rem; }
        .hint-box { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
        .expl-box { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }

        #action-btn { width: 100%; margin-top: 20px; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; }
        
        .red-cross { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; color: rgba(231, 29, 54, 0.3); pointer-events: none; display: none; z-index: 10; }
        .star { position: absolute; width: 12px; height: 12px; background: #FFD700; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); pointer-events: none; animation: pop 1s ease-out forwards; }

        @keyframes pop { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.5) translate(var(--tx), var(--ty)); opacity: 0; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" class="logo-only" alt="Logo">
    </div>

    <div id="intro-view" class="hidden">
        <h1 style="text-align:center; color:var(--primary); margin-bottom: 5px;">Magnetism Mission</h1>
        <p style="text-align:center; color:#6c757d; margin-top: 0;">Arctic Rescue Challenge</p>
        <button id="start-btn" style="width:100%; padding:18px; background:var(--primary); color:white; border:none; border-radius:14px; font-weight:bold; cursor:pointer; margin-top: 30px;">Start Quiz</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="header">
            <span>Mission <span id="q-num">1</span>/10</span>
            <span style="color:var(--primary);">Score: <span id="score-val">0</span></span>
        </div>
        <div class="timer-track"><div id="timer-bar"></div></div>
        <div id="q-text" class="question-text"></div>
        <div id="image-area"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">Next →</button>
        <div id="cross-mark" class="red-cross">✖</div>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <h2 style="font-size:1.5rem;">Mission Complete</h2>
        <div style="font-size: 4rem; font-weight: 800; color: var(--primary); margin: 15px 0;"><span id="final-pts">0</span>/10</div>
        <button onclick="location.reload()" style="width:100%; padding:16px; background:var(--primary); color:white; border:none; border-radius:14px; font-weight:700; cursor:pointer;">Restart Challenge</button>
    </div>
</div>

<script>
    const questions = [
        { q: "A rescue worker drops steel nails and brass screws into deep snow. Which will the magnet recover?", img: "q1.png", opts: ["Both the nails and screws", "Only the steel nails", "Only the brass screws", "Neither"], ans: 1, hint: "Check which material contains iron.", expl: "Steel is a magnetic material because it contains iron. Brass is non-magnetic and will not be attracted to the magnet." },
        { q: "A sailor's compass needle points toward Geographic North. Which magnetic pole attracts it?", img: "q2.png", opts: ["Earth's Magnetic North", "Earth's Magnetic South", "The Equator", "The Sun"], ans: 1, hint: "Remember that opposite poles attract.", expl: "The North pole of the compass needle is attracted to Earth's Magnetic South Pole, which is located near the Geographic North." },
        { q: "You test three metal bars. Bar 1 attracts filings. Bar 3 repels Bar 1. Which is a magnet?", opts: ["Bar 2", "Bar 1 only", "Bar 3 only", "Both Bar 1 and Bar 3"], ans: 3, hint: "Repulsion is the only sure test for a magnet.", expl: "Bar 1 shows attraction and Bar 3 shows repulsion. Repulsion only occurs between two magnets." },
        { q: "How does a 'Maglev' train stay above the tracks?", img: "q4.png", opts: ["Gravity pull", "Magnetic repulsion", "Magnetic attraction", "Friction"], ans: 1, hint: "Think about poles that push away from each other.", expl: "Maglev trains use the principle of magnetic repulsion where like poles push against each other to lift the train." },
        { q: "Why keep magnets away from computers and credit cards?", opts: ["Magnets lose strength", "Magnetic fields can scramble data", "The screen will break", "Magnets get too hot"], ans: 1, hint: "Data is often stored using magnetic patterns.", expl: "Electronic devices and magnetic strips on cards store data that can be erased or corrupted by strong magnetic fields." },
        { q: "What happens if you cut a bar magnet in half?", img: "q6.png", opts: ["One North and one South piece", "Two smaller, complete magnets", "Two non-magnetic pieces", "It becomes twice as strong"], ans: 1, hint: "Magnetic poles always exist in pairs.", expl: "Magnets are dipoles. Cutting a magnet results in two smaller magnets, each having its own North and South pole." },
        { q: "A crane uses electricity to lift scrap metal. This is a/an:", img: "q7.png", opts: ["Permanent magnet", "Natural magnet", "Electromagnet", "Bar magnet"], ans: 2, hint: "The magnetism is turned on and off with a switch.", expl: "An electromagnet works only when an electric current flows through it, making it ideal for industrial lifting." },
        { q: "Which action will cause a magnet to lose its strength?", opts: ["Painting it blue", "Heating it in a flame", "Storing it in a wooden box", "Cleaning it with water"], ans: 1, hint: "Extreme energy can ruin a magnet's internal alignment.", expl: "Heating, dropping, or hammering a magnet misaligns its internal magnetic domains, causing it to lose magnetism." },
        { q: "What is the only sure test to identify a magnet?", opts: ["Attraction to iron", "Repulsion of another magnet", "The way it looks", "Its weight"], ans: 1, hint: "Non-magnets like iron can still be attracted to magnets.", expl: "Only a magnet can repel another magnet. Magnetic materials like iron are always attracted but never repelled." },
        { q: "What is the best material for a 'keeper' to store magnets?", opts: ["Plastic", "Wood", "Soft Iron", "Copper"], ans: 2, hint: "It must allow magnetic lines to pass through it.", expl: "Soft iron keepers are used to provide a closed path for the magnetic field, preserving the magnet's strength over time." }
    ];

    let current = 0, score = 0, attempts = 0, timer, timeLeft = 45;
    const sndC = new Audio('assets/correct.mp3');
    const sndW = new Audio('assets/wrong.mp3');
    const sndF = new Audio('assets/freesound_community-claps-44774.mp3');

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro-view').classList.remove('hidden');
        }, 5000);
    };

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        loadQuestion();
    };

    function loadQuestion() {
        attempts = 0; timeLeft = 45;
        const q = questions[current];
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('q-text').innerText = q.q;
        
        const imgArea = document.getElementById('image-area');
        // Ensuring the path is assets/filename.png
        imgArea.innerHTML = q.img ? `<div class="img-container"><img src="assets/${q.img}" class="q-img" alt="Illustration"></div>` : "";
        
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => check(i, b);
            area.appendChild(b);
        });
        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-bar').style.width = (timeLeft/45*100) + "%";
            if(timeLeft <= 0) { clearInterval(timer); endTurn(); }
        }, 1000);
    }

    function check(i, b) {
        if(i === questions[current].ans) {
            clearInterval(timer);
            b.classList.add('correct');
            score++;
            document.getElementById('score-val').innerText = score;
            sndC.play();
            createStars();
            endTurn();
        } else {
            attempts++;
            sndW.play();
            showCross();
            b.classList.add('wrong');
            b.disabled = true;
            if(attempts === 1) {
                const f = document.getElementById('feedback-box');
                f.className = 'feedback hint-box';
                f.innerText = "Hint: " + questions[current].hint;
                f.style.display = 'block';
            } else {
                clearInterval(timer);
                endTurn();
            }
        }
    }

    function endTurn() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        const f = document.getElementById('feedback-box');
        f.className = 'feedback expl-box';
        f.innerText = questions[current].expl;
        f.style.display = 'block';
        document.querySelectorAll('.opt-btn')[questions[current].ans].classList.add('correct');
        document.getElementById('action-btn').classList.remove('hidden');
    }

    function showCross() {
        const c = document.getElementById('cross-mark');
        c.style.display = 'block';
        setTimeout(() => c.style.display = 'none', 600);
    }

    function createStars() {
        for(let i=0; i<15; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.setProperty('--tx', (Math.random()*200 - 100) + 'px');
            s.style.setProperty('--ty', (Math.random()*200 - 100) + 'px');
            s.style.left = '50%'; s.style.top = '50%';
            document.getElementById('app-container').appendChild(s);
            setTimeout(() => s.remove(), 1000);
        }
    }

    document.getElementById('action-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else {
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('final-pts').innerText = score;
            sndF.play();
        }
    };
</script>
</body>
</html>
