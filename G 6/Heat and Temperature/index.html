<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heat & Temperature Challenge</title>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --error: #e71d36;
            --bg: #f8f9fa;
            --text: #2b2d42;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            min-height: 450px;
        }

        /* --- MANDATORY SPLASH SCREEN --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .logo-main {
            width: 110px; /* Increased size for visibility */
            height: auto;
            max-width: 80%;
            object-fit: contain;
        }

        .loader-text {
            margin-top: 20px;
            font-size: 12px;
            letter-spacing: 3px;
            color: #adb5bd;
            font-weight: bold;
        }

        /* --- PROGRESS & TIMER --- */
        .header { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 10px; font-size: 0.9rem; }
        .timer-track { width: 100%; height: 8px; background: #edf2f4; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--primary); transition: width 1s linear; }

        /* --- CONTENT --- */
        .question-text { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin-bottom: 15px; }
        
        .table-container { width: 100%; overflow-x: auto; margin: 15px 0; border: 1px solid #dee2e6; border-radius: 10px; background: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; }
        th { background: #f1f4ff; color: var(--primary); }

        .options-grid { display: grid; gap: 12px; }
        .opt-btn {
            background: #fff; border: 2px solid #edf2f4; padding: 16px;
            border-radius: 14px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        .opt-btn.correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .opt-btn.wrong { background: var(--error) !important; color: white; border-color: var(--error); }

        .feedback { margin-top: 20px; padding: 15px; border-radius: 12px; display: none; line-height: 1.5; font-size: 0.95rem; }
        .hint-box { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
        .expl-box { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }

        #action-btn { width: 100%; margin-top: 20px; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; }
        
        .red-cross { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; color: rgba(231, 29, 54, 0.3); pointer-events: none; display: none; z-index: 10; }
        .star { position: absolute; width: 12px; height: 12px; background: #FFD700; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); pointer-events: none; animation: pop 1s ease-out forwards; }

        @keyframes pop { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.5) translate(var(--tx), var(--ty)); opacity: 0; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" class="logo-main" alt="Innovine Logo">
        <div class="loader-text">POWERED BY INNOVINE</div>
    </div>

    <div id="intro-view" class="hidden">
        <h1 style="text-align:center; color:var(--primary); margin-bottom: 5px;">Heat & Temperature</h1>
        <p style="text-align:center; color:#6c757d; margin-top: 0;">Grade 6 Challenge</p>
        <button id="start-btn" style="width:100%; padding:18px; background:var(--primary); color:white; border:none; border-radius:14px; font-weight:bold; font-size:1.1rem; cursor:pointer; margin-top: 30px;">Start Now</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="header">
            <span>Question <span id="q-num">1</span>/12</span>
            <span style="color:var(--primary);">Score: <span id="score-val">0</span></span>
        </div>
        <div class="timer-track"><div id="timer-bar"></div></div>
        
        <div id="q-text" class="question-text"></div>
        <div id="table-area"></div>
        <div id="options-area" class="options-grid"></div>
        
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">Continue →</button>
        <div id="cross-mark" class="red-cross">✖</div>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <h2 style="font-size:1.5rem;">Assessment Complete</h2>
        <div style="font-size: 4rem; font-weight: 800; color: var(--primary); margin: 15px 0;"><span id="final-pts">0</span>/12</div>
        <p id="result-msg" style="color:#6c757d; margin-bottom:30px;"></p>
        <button onclick="location.reload()" style="width:100%; padding:16px; background:var(--primary); color:white; border:none; border-radius:14px; font-weight:700; cursor:pointer;">Try Again</button>
    </div>
</div>

<script>
    const questions = [
        { q: "Priya's hot tea cooled to room temperature after 20 minutes. Why?", opts: ["The cup absorbed all heat permanently", "Heat flowed to surroundings until thermal equilibrium", "Tea evaporated completely", "Cold air replaced the heat"], ans: 1, hint: "Heat flows from hot to cold objects.", expl: "Heat transfer continues until both objects reach the same temperature (thermal equilibrium)." },
        { q: "Which S.I. unit should be used for heat based on this table?", tbl: "<table><tr><th>Unit</th><th>System</th><th>Used For</th></tr><tr><td>Joule (J)</td><td>S.I.</td><td>Standard scientific</td></tr><tr><td>Calorie</td><td>c)G.S.</td><td>Smaller quantities</td></tr><tr><td>Watt (W)</td><td>S.I.</td><td>Power</td></tr></table>", opts: ["Calorie", "Joule", "Degree Celsius", "Watt"], ans: 1, hint: "Look at the 'S.I.' column in the first row.", expl: "The Joule (J) is the S.I. unit of heat. Celsius measures temperature." },
        { q: "Why did a clinical thermometer break in boiling water?", opts: ["Designed for body temp; high heat breaks it", "Only works with mercury", "Needed cleaning", "Reads below 0°C"], ans: 0, hint: "Boiling water is 100°C; clinical range is much lower.", expl: "Clinical thermometers have a narrow range (35°C to 42°C) and cannot handle boiling water." },
        { q: "Stirring hot soup makes a metal spoon handle warm. This is:", opts: ["Convection", "Radiation", "Conduction", "Evaporation"], ans: 2, hint: "Heat transfer through a solid metal.", expl: "Conduction is the transfer of heat through solids via vibrating particles." },
        { q: "Which material is the odd one out?", opts: ["Copper", "Brass", "Plastic", "Aluminium"], ans: 2, hint: "Three are metals, one is an insulator.", expl: "Plastic is an insulator; the others are thermal conductors." },
        { q: "Why install AC vents near the ceiling?", opts: ["Cold air sinks", "Warm air rises; cool air replaces it", "Floor is hotter", "Ceiling is hotter"], ans: 1, hint: "Think about convection currents.", expl: "Warm air rises; cool air from the top sinks and displaces it to cool the room." },
        { q: "How does heat from a bonfire reach you without wind?", opts: ["Conduction (ground)", "Convection", "Radiation waves", "Conduction (air)"], ans: 2, hint: "This mode doesn't need air to move.", expl: "Radiation travels as waves and warms objects directly across space." },
        { q: "Which conclusion is correct according to the box data?", tbl: "<table><tr><th>Box</th><th>Temp</th></tr><tr><td>White</td><td>34°C</td></tr><tr><td>Black</td><td>52°C</td></tr><tr><td>Silver</td><td>31°C</td></tr><tr><td>Red</td><td>45°C</td></tr></table>", opts: ["Silver is hottest", "Colors don't matter", "Dark colors absorb more heat", "White absorbs more than red"], ans: 2, hint: "Compare Black (52°C) vs Silver (31°C).", expl: "Darker surfaces absorb more heat; reflective surfaces like silver reflect it." },
        { q: "Why does sea breeze blow towards land in the afternoon?", opts: ["Sea is hotter", "Land heats faster; warm air rises", "Sun heats sea more", "Evaporation"], ans: 1, hint: "Land and sea heat up at different rates.", expl: "Land heats faster. Warm air rises and cooler sea air flows in to fill the gap." },
        { q: "Which is incorrectly classified as a chemical change?", opts: ["Ice melting", "Grilling vegetables", "Chocolate solidifying", "Burning paper"], ans: 2, hint: "Physical changes are reversible.", expl: "Solidifying chocolate is a physical change because it is reversible." },
        { q: "How does a vacuum in a thermos flask help?", opts: ["Absorbs heat", "No particles for conduction/convection", "Creates pressure", "Reflects heat"], ans: 1, hint: "Conduction/convection need matter to travel.", expl: "A vacuum has no particles, preventing heat loss through conduction or convection." },
        { q: "Why leave small gaps between railway tracks?", opts: ["Drain rainwater", "Reduce weight", "Allow expansion in summer", "Vibration signals"], ans: 2, hint: "Metals get bigger when they are hot.", expl: "Gaps allow metal tracks to expand in summer heat without buckling." }
    ];

    let current = 0, score = 0, attempts = 0, timer, timeLeft = 45;
    const sndC = new Audio('assets/correct.mp3');
    const sndW = new Audio('assets/wrong.mp3');
    const sndF = new Audio('assets/freesound_community-claps-44774.mp3');

    // Mandatory Splash Logic
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro-view').classList.remove('hidden');
        }, 5000);
    };

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        loadQuestion();
    };

    function loadQuestion() {
        attempts = 0; timeLeft = 45;
        const q = questions[current];
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('table-area').innerHTML = q.tbl ? `<div class="table-container">${q.tbl}</div>` : "";
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => check(i, b);
            area.appendChild(b);
        });
        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-bar').style.width = (timeLeft/45*100) + "%";
            if(timeLeft <= 0) { clearInterval(timer); endTurn(); }
        }, 1000);
    }

    function check(i, b) {
        if(i === questions[current].ans) {
            clearInterval(timer);
            b.classList.add('correct');
            score++;
            document.getElementById('score-val').innerText = score;
            sndC.play();
            createStars();
            endTurn();
        } else {
            attempts++;
            sndW.play();
            showCross();
            b.classList.add('wrong');
            b.disabled = true;
            if(attempts === 1) {
                const f = document.getElementById('feedback-box');
                f.className = 'feedback hint-box';
                f.innerText = "Hint: " + questions[current].hint;
                f.style.display = 'block';
            } else {
                clearInterval(timer);
                endTurn();
            }
        }
    }

    function endTurn() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        const f = document.getElementById('feedback-box');
        f.className = 'feedback expl-box';
        f.innerText = questions[current].expl;
        f.style.display = 'block';
        document.querySelectorAll('.opt-btn')[questions[current].ans].classList.add('correct');
        document.getElementById('action-btn').classList.remove('hidden');
    }

    function showCross() {
        const c = document.getElementById('cross-mark');
        c.style.display = 'block';
        setTimeout(() => c.style.display = 'none', 600);
    }

    function createStars() {
        for(let i=0; i<12; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.setProperty('--tx', (Math.random()*200 - 100) + 'px');
            s.style.setProperty('--ty', (Math.random()*200 - 100) + 'px');
            s.style.left = '50%'; s.style.top = '50%';
            document.getElementById('app-container').appendChild(s);
            setTimeout(() => s.remove(), 1000);
        }
    }

    document.getElementById('action-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else {
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('final-pts').innerText = score;
            sndF.play();
            document.getElementById('result-msg').innerText = score >= 10 ? "Great work, Science Expert!" : "Keep learning about Heat!";
        }
    };
</script>
</body>
</html>
