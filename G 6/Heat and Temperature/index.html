<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heat & Temperature Quiz</title>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --error: #e71d36;
            --bg: #f8f9fa;
            --text: #2b2d42;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            min-height: 480px;
        }

        /* Splash Screen - Logo Only */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .logo-only {
            width: 250px;
            height: auto;
            max-width: 85%;
            object-fit: contain;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* UI Components */
        .header { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 10px; font-size: 0.9rem; }
        .timer-track { width: 100%; height: 8px; background: #edf2f4; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--primary); transition: width 1s linear; }

        .question-text { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin-bottom: 15px; }
        
        .table-container { width: 100%; overflow-x: auto; margin: 15px 0; border: 1px solid #dee2e6; border-radius: 10px; background: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; }
        th { background: #f1f4ff; color: var(--primary); }

        .options-grid { display: grid; gap: 12px; }
        .opt-btn {
            background: #fff; border: 2px solid #edf2f4; padding: 16px;
            border-radius: 14px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        .opt-btn.correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .opt-btn.wrong { background: var(--error) !important; color: white; border-color: var(--error); }

        .feedback { margin-top: 20px; padding: 15px; border-radius: 12px; display: none; line-height: 1.5; font-size: 0.95rem; }
        .hint-box { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
        .expl-box { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }

        #action-btn { width: 100%; margin-top: 20px; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; }
        
        .red-cross { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; color: rgba(231, 29, 54, 0.3); pointer-events: none; display: none; z-index: 10; }
        .star { position: absolute; width: 12px; height: 12px; background: #FFD700; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); pointer-events: none; animation: pop 1s ease-out forwards; }

        @keyframes pop { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.5) translate(var(--tx), var(--ty)); opacity: 0; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" class="logo-only" alt="Innovine Logo">
        <div class="loader"></div>
    </div>

    <div id="intro-view" class="hidden">
        <h1 style="text-align:center; color:var(--primary); margin-bottom: 5px;">Heat & Temperature</h1>
        <p style="text-align:center; color:#6c757d; margin-top: 0;">Grade 6 Interactive Assessment</p>
        <button id="start-btn" style="width:100%; padding:18px; background:var(--primary); color:white; border:none; border-radius:14px; font-weight:bold; font-size:1.1rem; cursor:pointer; margin-top: 30px;">Start Quiz</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="header">
            <span>Question <span id="q-num">1</span>/12</span>
            <span style="color:var(--primary);">Score: <span id="score-val">0</span></span>
        </div>
        <div class="timer-track"><div id="timer-bar"></div></div>
        <div id="q-text" class="question-text"></div>
        <div id="table-area"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">Continue →</button>
        <div id="cross-mark" class="red-cross">✖</div>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <h2 style="font-size:1.5rem;">Challenge Complete</h2>
        <div style="font-size: 4rem; font-weight: 800; color: var(--primary); margin: 15px 0;"><span id="final-pts">0</span>/12</div>
        <p id="result-msg" style="color:#6c757d; margin-bottom:30px;"></p>
        <button onclick="location.reload()" style="width:100%; padding:16px; background:var(--primary); color:white; border:none; border-radius:14px; font-weight:700; cursor:pointer;">Restart Challenge</button>
    </div>
</div>

<script>
    const questions = [
        { q: "Priya pours hot tea into a cup. After 20 minutes, it is at room temperature. Why?", opts: ["The cup absorbed all heat permanently", "Heat flowed to cooler surroundings until thermal equilibrium", "The tea lost water due to evaporation", "Cold air replaced the heat"], ans: 1, hint: "Heat flows from hot to cold objects.", expl: "Heat flows until both reach the same temperature, a state called thermal equilibrium." },
        { q: "Which unit should a student use to express heat in the standard international (S.I.) system?", tbl: "<table><tr><th>Unit</th><th>System</th><th>Used For</th></tr><tr><td>Joule (J)</td><td>S.I.</td><td>Standard measurement</td></tr><tr><td>Calorie</td><td>c)G.S.</td><td>Smaller heat quantities</td></tr><tr><td>Watt (W)</td><td>S.I.</td><td>Power</td></tr></table>", opts: ["Calorie", "Joule", "Degree Celsius", "Watt"], ans: 1, hint: "Check the table for the S.I. system row.", expl: "The S.I. unit of heat is the Joule (J). Celsius measures temperature, not heat." },
        { q: "Why was it wrong for Arjun's mother to use a clinical thermometer for boiling water?", opts: ["It is designed for body temperature and has a limited range", "It only works with mercury, which can't measure water", "It needed cleaning first", "It only reads temperatures below 0°C"], ans: 0, hint: "Boiling water is 100°C; body temp is ~37°C.", expl: "A clinical thermometer's range is limited. Boiling water (100°C) is beyond its safe range." },
        { q: "Meena stirs hot soup with a metal spoon. The handle becomes warm. This is due to:", opts: ["Convection", "Radiation", "Conduction", "Evaporation"], ans: 2, hint: "Heat transfer through a solid object.", expl: "Conduction is heat transfer through a solid by particle-to-particle energy transfer." },
        { q: "Which material does NOT belong in this group based on heat conduction?", opts: ["Copper", "Brass", "Plastic", "Aluminium"], ans: 2, hint: "Identify the insulator among the metals.", expl: "Copper, brass, and aluminium are good conductors. Plastic is an insulator." },
        { q: "Why is it better to keep an AC vent near the ceiling?", opts: ["Cold air is heavy and sinks", "Warm air rises; cool air from the top replaces it", "The floor is hotter", "The ceiling needs to be cooled first"], ans: 1, hint: "Warm air is lighter than cool air.", expl: "Warm air rises. Cool air from the top sinks, setting up convection currents." },
        { q: "How is heat from a bonfire reaching Rahul's face across a distance?", opts: ["Conduction through ground", "Convection currents", "Radiation waves through air", "Conduction through air"], ans: 2, hint: "This mode does not require a medium.", expl: "Radiation travels as electromagnetic waves and warms objects directly." },
        { q: "Based on the data, which conclusion is best supported?", tbl: "<table><tr><th>Box</th><th>Temp</th></tr><tr><td>White box</td><td>34°C</td></tr><tr><td>Black box</td><td>52°C</td></tr><tr><td>Silver box</td><td>31°C</td></tr><tr><td>Red box</td><td>45°C</td></tr></table>", opts: ["Silver is the hottest", "All colors absorb same heat", "Darker colors absorb more heat", "White absorbs more than red"], ans: 2, hint: "Compare the Black box (52°C) to the Silver box (31°C).", expl: "Dark surfaces absorb more radiant heat, while light surfaces reflect it." },
        { q: "Why does a sea breeze blow from sea to land during a hot afternoon?", opts: ["The sea is hotter than land", "Land heats faster; warm air rises and cool air moves in", "Sun heats sea more", "Evaporation pushes air"], ans: 1, hint: "Land and water heat up at different rates.", expl: "Land heats faster. Warm air rises and cooler air from the sea replaces it." },
        { q: "Which observation has been INCORRECTLY classified?", opts: ["Ice melting - Physical", "Grilling vegetables - Chemical", "Chocolate solidifying - Chemical", "Burning paper - Chemical"], ans: 2, hint: "Is chocolate solidifying reversible?", expl: "Chocolate solidifying is a physical change because it is reversible." },
        { q: "How does a vacuum help in a thermos flask?", opts: ["Absorbs heat from soup", "Prevents heat loss by conduction and convection", "Creates pressure to trap heat", "Reflects heat using mirror particles"], ans: 1, hint: "Conduction/convection need particles to move heat.", expl: "A vacuum has no particles, preventing heat transfer via conduction and convection." },
        { q: "Why are small gaps left between railway track sections?", opts: ["To drain rainwater", "To use less metal", "To allow for metal expansion in summer", "To signal trains"], ans: 2, hint: "Metals expand when heated.", expl: "Gaps provide space for expansion in summer, preventing the tracks from buckling." }
    ];

    let current = 0, score = 0, attempts = 0, timer, timeLeft = 45;
    const sndC = new Audio('assets/correct.mp3');
    const sndW = new Audio('assets/wrong.mp3');
    const sndF = new Audio('assets/freesound_community-claps-44774.mp3');

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro-view').classList.remove('hidden');
        }, 5000);
    };

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        loadQuestion();
    };

    function loadQuestion() {
        attempts = 0; timeLeft = 45;
        const q = questions[current];
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('table-area').innerHTML = q.tbl ? `<div class="table-container">${q.tbl}</div>` : "";
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => check(i, b);
            area.appendChild(b);
        });
        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-bar').style.width = (timeLeft/45*100) + "%";
            if(timeLeft <= 0) { clearInterval(timer); endTurn(); }
        }, 1000);
    }

    function check(i, b) {
        if(i === questions[current].ans) {
            clearInterval(timer);
            b.classList.add('correct');
            score++;
            document.getElementById('score-val').innerText = score;
            sndC.play();
            createStars();
            endTurn();
        } else {
            attempts++;
            sndW.play();
            showCross();
            b.classList.add('wrong');
            b.disabled = true;
            if(attempts === 1) {
                const f = document.getElementById('feedback-box');
                f.className = 'feedback hint-box';
                f.innerText = "Hint: " + questions[current].hint;
                f.style.display = 'block';
            } else {
                clearInterval(timer);
                endTurn();
            }
        }
    }

    function endTurn() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        const f = document.getElementById('feedback-box');
        f.className = 'feedback expl-box';
        f.innerText = questions[current].expl;
        f.style.display = 'block';
        document.querySelectorAll('.opt-btn')[questions[current].ans].classList.add('correct');
        document.getElementById('action-btn').classList.remove('hidden');
    }

    function showCross() {
        const c = document.getElementById('cross-mark');
        c.style.display = 'block';
        setTimeout(() => c.style.display = 'none', 600);
    }

    function createStars() {
        for(let i=0; i<15; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.setProperty('--tx', (Math.random()*200 - 100) + 'px');
            s.style.setProperty('--ty', (Math.random()*200 - 100) + 'px');
            s.style.left = '50%'; s.style.top = '50%';
            document.getElementById('app-container').appendChild(s);
            setTimeout(() => s.remove(), 1000);
        }
    }

    document.getElementById('action-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else {
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('final-pts').innerText = score;
            sndF.play();
            document.getElementById('result-msg').innerText = score >= 10 ? "Great job! You've mastered Heat and Temperature!" : "Well done! Keep practicing to improve your score.";
        }
    };
</script>
</body>
</html>
