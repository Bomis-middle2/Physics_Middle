<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heat & Temperature Challenge</title>
    <style>
        :root {
            --bg-color: #f0f9ff;
            --card-bg: #ffffff;
            --primary: #3b82f6;
            --success: #22c55e;
            --error: #ef4444;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        #app-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .brand-logo {
            display: block;
            max-width: 140px;
            margin: 0 auto 20px auto;
        }

        /* Engagement Elements */
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 10px; color: var(--primary); }
        .score-pill { background: #dbeafe; color: var(--primary); padding: 5px 15px; border-radius: 20px; font-weight: 700; }

        /* Mobile-Friendly Table Container */
        .table-wrapper {
            width: 100%;
            overflow-x: auto; /* Swipe support for mobile */
            margin: 20px 0;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 400px; /* Ensures readability on small screens */
            background: white;
        }

        .data-table th, .data-table td {
            border: 1px solid #e2e8f0;
            padding: 12px;
            text-align: left;
            font-size: 0.9rem;
        }

        .data-table th { background-color: #f8fafc; color: var(--primary); }

        /* Quiz Layout */
        .timer-container { width: 100%; height: 8px; background: #e2e8f0; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        #timer-fill { height: 100%; width: 100%; background: var(--primary); transition: width 1s linear; }

        .question-box { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }

        .options-list { display: grid; gap: 12px; }
        .opt-btn {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 15px;
            border-radius: 15px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .opt-btn:active { transform: scale(0.98); }
        .opt-btn.correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .opt-btn.wrong { background: var(--error) !important; color: white; border-color: var(--error); }

        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .hint { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; }
        .explanation { background: #f0fdf4; border: 1px solid #dcfce7; color: #166534; }

        #next-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Tablet/Desktop Adjustments */
        @media (min-width: 768px) {
            #app-container { padding: 40px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <img src="assets/logo.png" class="brand-logo" alt="Innovine">

    <div id="start-screen">
        <h1>Science Quiz: Heat</h1>
        <p style="text-align:center; color: var(--text-muted);">Test your knowledge on thermal equilibrium, conduction, and more!</p>
        <button id="begin-quiz" style="width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 15px; font-weight: 700; margin-top: 20px;">Let's Start!</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:600;">Question <span id="q-num">1</span>/13</span>
            <span class="score-pill">Score: <span id="score">0</span></span>
        </div>
        
        <div class="timer-container"><div id="timer-fill"></div></div>
        
        <div id="q-text" class="question-box"></div>
        <div id="table-area" class="table-wrapper hidden"></div>
        
        <div id="options" class="options-list"></div>
        
        <div id="feedback" class="feedback-box"></div>
        <button id="next-btn" class="hidden">Next Question →</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center;">
        <h1>Well Done! 🎉</h1>
        <div style="font-size: 3rem; font-weight: 800; margin: 20px 0;"><span id="final-score">0</span>/13</div>
        <p id="result-msg" style="margin-bottom: 30px; color: var(--text-muted);"></p>
        <button onclick="location.reload()" style="width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 15px; font-weight: 700;">Try Again</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Priya pours hot tea into a cup. After 20 minutes, the tea is the same temperature as the room. Why?",
            options: ["Cup absorbed heat permanently", "Heat flowed to surroundings until equilibrium", "Tea lost water only", "Cold air replaced heat"],
            correct: 1,
            hint: "Heat always flows from hotter to cooler objects.",
            explanation: "Heat flows until thermal equilibrium is reached."
        },
        {
            q: "Which S.I. unit should be used for heat measurement?",
            table: `<table class="data-table"><tr><th>Unit</th><th>System</th><th>Used For</th></tr><tr><td>Joule (J)</td><td>S.I.</td><td>Standard scientific</td></tr><tr><td>Calorie</td><td>c)G.S.</td><td>Smaller quantities</td></tr><tr><td>Watt (W)</td><td>S.I.</td><td>Power</td></tr></table>`,
            options: ["Calorie", "Joule", "Degree Celsius", "Watt"],
            correct: 1,
            hint: "Look for 'S.I.' in the table.",
            explanation: "The S.I. unit of heat is the Joule (J)."
        },
        {
            q: "Why did the clinical thermometer break in boiling water?",
            options: ["Limited range", "Mercury hates water", "Needed cleaning", "Reads below 0°C"],
            correct: 0,
            hint: "Clinical thermometers only go up to about 42°C.",
            explanation: "Boiling water (100°C) is beyond its safe range."
        },
        {
            q: "Heat moving through a metal spoon is called:",
            options: ["Convection", "Radiation", "Conduction", "Evaporation"],
            correct: 2,
            hint: "Solid-to-solid transfer.",
            explanation: "Conduction transfers heat through solids."
        },
        {
            q: "Which material is the 'Odd One Out'?",
            options: ["Copper", "Brass", "Plastic", "Aluminium"],
            correct: 2,
            hint: "Three are metals, one is an insulator.",
            explanation: "Plastic is a bad conductor (insulator)."
        },
        {
            q: "Why install AC vents near the ceiling?",
            options: ["Cold air sinks", "Sets up convection currents", "Floor is too cold", "Ceiling is hotter"],
            correct: 1,
            hint: "Warm air rises, cool air sinks.",
            explanation: "This creates convection currents that cool the whole room."
        },
        {
            q: "How does heat reach your face from a bonfire?",
            options: ["Conduction (ground)", "Convection (air)", "Radiation (waves)", "Conduction (air)"],
            correct: 2,
            hint: "Travels as electromagnetic waves.",
            explanation: "Radiation does not need a medium to travel."
        },
        {
            q: "Which conclusion is best supported by the box data?",
            table: `<table class="data-table"><tr><th>Box</th><th>Temp</th></tr><tr><td>White</td><td>34°C</td></tr><tr><td>Black</td><td>52°C</td></tr><tr><td>Silver</td><td>31°C</td></tr><tr><td>Red</td><td>45°C</td></tr></table>`,
            options: ["Silver is hottest", "Colors don't matter", "Darker absorbs more", "White absorbs more than red"],
            correct: 2,
            hint: "Compare Black vs Silver.",
            explanation: "Darker colors absorb more radiant heat."
        },
        {
            q: "Why does sea breeze blow towards land during the day?",
            options: ["Sea is hotter", "Land heats up faster", "Sun heats sea more", "Evaporation pushes air"],
            correct: 1,
            hint: "Land gets hot faster than water.",
            explanation: "Warm air rises over land, and cool sea air moves in."
        },
        {
            q: "Which is INCORRECTLY classified?",
            options: ["Ice melting - Physical", "Grilling - Chemical", "Chocolate solidifying - Chemical", "Burning paper - Chemical"],
            correct: 2,
            hint: "Solidifying is reversible.",
            explanation: "Solidifying is a physical change."
        },
        {
            q: "How does a vacuum help in a thermos flask?",
            options: ["Absorbs heat", "No particles for conduction/convection", "Creates pressure", "Reflects heat"],
            correct: 1,
            hint: "Conduction needs particles to work.",
            explanation: "A vacuum stops conduction and convection."
        },
        {
            q: "Assertion: Metal rod end gets hot. Reason: Molecules move to cold end.",
            options: ["Both True, R explains A", "Both True, R doesn't explain", "A is true, R is false", "A is false, R is true"],
            correct: 2,
            hint: "Do molecules travel in solids?",
            explanation: "In solids, molecules only vibrate in place."
        },
        {
            q: "Why leave gaps in railway tracks?",
            options: ["Drain water", "Save metal", "Allow for expansion", "Create vibrations"],
            correct: 2,
            hint: "Metals get larger when hot.",
            explanation: "Gaps allow metal to expand without buckling."
        }
    ];

    let current = 0, score = 0, attempts = 0, timer, timeLeft = 45;
    const sndCorrect = new Audio('assets/correct.mp3');
    const sndWrong = new Audio('assets/wrong.mp3');
    const sndClaps = new Audio('assets/freesound_community-claps-44774.mp3');

    document.getElementById('begin-quiz').onclick = () => {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQ();
    };

    function loadQ() {
        attempts = 0; timeLeft = 45;
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        const q = questions[current];
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('q-text').innerText = q.q;
        
        const tbl = document.getElementById('table-area');
        if(q.table) { tbl.innerHTML = q.table; tbl.classList.remove('hidden'); }
        else { tbl.classList.add('hidden'); }

        const optBox = document.getElementById('options');
        optBox.innerHTML = "";
        q.options.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => check(i, b);
            optBox.appendChild(b);
        });
        startT();
    }

    function startT() {
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-fill').style.width = (timeLeft/45*100) + "%";
            if(timeLeft <= 0) { clearInterval(timer); endTurn(); }
        }, 1000);
    }

    function check(i, b) {
        if(i === questions[current].correct) {
            clearInterval(timer);
            b.classList.add('correct');
            score++;
            document.getElementById('score').innerText = score;
            sndCorrect.play();
            endTurn();
        } else {
            attempts++;
            sndWrong.play();
            b.classList.add('wrong');
            b.disabled = true;
            if(attempts === 1) {
                const f = document.getElementById('feedback');
                f.className = 'feedback-box hint';
                f.innerText = "Hint: " + questions[current].hint;
                f.style.display = 'block';
            } else {
                clearInterval(timer);
                endTurn();
            }
        }
    }

    function endTurn() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        const f = document.getElementById('feedback');
        f.className = 'feedback-box explanation';
        f.innerText = questions[current].explanation;
        f.style.display = 'block';
        document.querySelectorAll('.opt-btn')[questions[current].correct].classList.add('correct');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    document.getElementById('next-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQ();
        else {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            sndClaps.play();
            document.getElementById('result-msg').innerText = score > 10 ? "Excellent job! You're a Science Star! ⭐" : "Good effort! Keep learning!";
        }
    };
</script>
</body>
</html>
