<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 6 Science - Heat & Temperature Lab</title>
    <style>
        :root {
            --primary: #e67e22; /* Warm Orange for Heat */
            --accent: #d35400;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #fdf2e9;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-card {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            border: 5px solid var(--primary);
        }

        .hidden { display: none !important; }

        .hud { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; }
        
        .progress-bar {
            height: 12px;
            background: #eee;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }

        .question-box h2 { font-size: 1.2rem; color: #333; line-height: 1.5; }

        .options-grid { display: grid; gap: 12px; margin-top: 20px; }

        .option-btn {
            padding: 15px;
            border: 3px solid #eee;
            border-radius: 12px;
            background: #fafafa;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: 0.2s;
        }

        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #fff5eb; }
        .correct { background: var(--success) !important; color: white !important; border-color: #1e8449 !important; }
        .wrong { background: var(--danger) !important; color: white !important; border-color: #922b21 !important; animation: shake 0.3s; }

        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

        .feedback-area {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #fdf2e9;
            border-left: 5px solid var(--primary);
        }

        .btn-next {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            float: right;
        }
    </style>
</head>
<body>

<div class="game-card">
    <div id="start-screen" class="text-center" style="text-align: center;">
        <h1 style="color: var(--primary);">🔥 Heat & Temperature Quiz</h1>
        <p>Based on your CBQ Document. <br><strong>Rule:</strong> Only 2 chances per question!</p>
        <button class="btn-next" style="float: none;" onclick="startQuiz()">Start Experiment 🚀</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="hud">
            <span>Question: <span id="q-count">1</span>/5</span>
            <span>Stars: ⭐ <span id="score">0</span></span>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        
        <div class="question-box">
            <h2 id="q-text"></h2>
            <div id="options-box" class="options-grid"></div>
        </div>

        <div id="feedback-box" class="feedback-area hidden"></div>
        <div style="height: 60px;">
            <button id="next-btn" class="btn-next hidden" onclick="nextQuestion()">Next Question ➡️</button>
        </div>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center;">
        <h2 style="color: var(--success);">Lab Complete!</h2>
        <h1 id="final-score" style="font-size: 3rem;">0/5</h1>
        <p id="result-msg"></p>
        <button class="btn-next" style="float: none;" onclick="location.reload()">Restart 🔄</button>
    </div>
</div>

<script>
    const audio = {
        correct: new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3'),
        wrong: new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3'),
        claps: new Audio('https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3')
    };

    const questions = [
        {
            q: "Priya pours hot tea into a cup. After 20 minutes, it feels the same temperature as the room. Why?",
            options: ["The cup absorbed heat permanently", "Heat flowed to cooler surroundings until thermal equilibrium", "Evaporation made it cool", "Cold air replaced the heat"],
            ans: 1,
            explain: "Heat always flows from a hotter object to a cooler one until they reach thermal equilibrium."
        },
        {
            q: "A student wants to express the amount of heat absorbed by water using the S.I. system. Which unit should she use?",
            options: ["Calorie", "Joule", "Degree Celsius", "Watt"],
            ans: 1,
            explain: "The S.I. unit of heat is the Joule (J). Celsius measures temperature, not heat."
        },
        {
            q: "Why was it wrong for Arjun's mother to use a clinical thermometer for boiling water?",
            options: ["Body thermometers have a limited safe range", "Mercury cannot measure water", "It needed cleaning first", "It only reads below 0°C"],
            ans: 0,
            explain: "Boiling water (100°C) is beyond the safe range of clinical thermometers (~37°C)."
        },
        {
            q: "Meena stirs hot soup with a metal spoon. Soon, the handle becomes warm. Which mode of heat transfer is this?",
            options: ["Convection", "Radiation", "Conduction", "Evaporation"],
            ans: 2,
            explain: "This is conduction—heat transfer through a solid by particle-to-particle energy transfer."
        },
        {
            q: "Which of these materials does NOT belong with the others (Odd One Out)?",
            options: ["Copper", "Brass", "Plastic", "Aluminium"],
            ans: 2,
            explain: "Copper, brass, and aluminium are good conductors (metals). Plastic is an insulator."
        }
    ];

    let currentIdx = 0, score = 0, attempts = 0;

    function startQuiz() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const data = questions[currentIdx];
        attempts = 0;
        document.getElementById('q-count').innerText = currentIdx + 1;
        document.getElementById('q-text').innerText = data.q;
        document.getElementById('feedback-box').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('progress-fill').style.width = ((currentIdx / questions.length) * 100) + '%';

        const box = document.getElementById('options-box');
        box.innerHTML = '';
        data.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAns(i, btn);
            box.appendChild(btn);
        });
    }

    function checkAns(idx, btn) {
        const data = questions[currentIdx];
        const feedback = document.getElementById('feedback-box');
        const allBtns = document.querySelectorAll('.option-btn');

        allBtns.forEach(b => b.disabled = true);

        if (idx === data.ans) {
            btn.classList.add('correct');
            audio.correct.play();
            audio.correct.onended = () => {
                audio.claps.play();
                if (attempts === 0) score++;
                document.getElementById('score').innerText = score;
                feedback.innerHTML = `<b>🌟 Correct!</b><br>${data.explain}`;
                feedback.classList.remove('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            };
        } else {
            btn.classList.add('wrong');
            audio.wrong.play();
            audio.wrong.onended = () => {
                attempts++;
                if (attempts < 2) {
                    allBtns.forEach(b => { if(!b.classList.contains('wrong')) b.disabled = false; });
                    feedback.innerHTML = `<b>Incorrect!</b> You have 1 chance left.`;
                    feedback.classList.remove('hidden');
                } else {
                    allBtns[data.ans].classList.add('correct');
                    feedback.innerHTML = `<b>Out of chances!</b> The correct answer was: <i>${data.options[data.ans]}</i>.<br>${data.explain}`;
                    feedback.classList.remove('hidden');
                    document.getElementById('next-btn').classList.remove('hidden');
                }
            };
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) loadQuestion();
        else showFinal();
    }

    function showFinal() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score}/${questions.length}`;
        audio.claps.play();
        document.getElementById('result-msg').innerText = score >= 4 ? "Excellent Heat Expert!" : "Good effort! Review the heat transfer modes.";
    }
</script>
</body>
</html>
