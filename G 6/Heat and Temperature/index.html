<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovine - Heat & Temperature Lab</title>
    <style>
        :root {
            --primary: #e67e22;
            --accent: #d35400;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #fffbf5;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            margin: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Loading Screen with Innovine Logo */
        #brand-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.8s ease;
        }
        #brand-layer img { max-width: 220px; margin-bottom: 20px; }
        .loader { width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .game-card {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-top: 6px solid var(--primary);
            position: relative;
        }

        .header-logo { display: block; margin: 0 auto 20px; max-width: 140px; }
        .hidden { display: none !important; }

        .hud { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: #555; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; margin-bottom: 25px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }

        .question-text { font-size: 1.15rem; color: #333; line-height: 1.5; margin-bottom: 20px; }
        .options-grid { display: grid; gap: 10px; }
        .option-btn {
            padding: 14px 18px;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.2s;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #fffcf9; }
        .correct { background: var(--success) !important; color: white !important; border-color: #219150 !important; }
        .wrong { background: var(--danger) !important; color: white !important; border-color: #a02e23 !important; animation: shake 0.4s; }

        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

        .feedback { margin-top: 20px; padding: 15px; border-radius: 10px; background: #fef4ea; border-left: 4px solid var(--primary); }
        
        .btn-action {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            float: right;
        }
        .text-center { text-align: center; }
    </style>
</head>
<body>

<div id="brand-layer">
    <img src="Screenshot 2026-05-12 at 16.00.11.png" alt="Innovine Logo">
    <div class="loader"></div>
</div>

<div class="game-card">
    <img src="Screenshot 2026-05-12 at 16.00.11.png" class="header-logo" alt="Innovine">
    
    <div id="screen-start" class="text-center">
        <h2 style="color: var(--accent);">Heat & Temperature Lab</h2>
        <p>Complete the competency challenges.<br><b>Rules:</b> 2 chances per question.</p>
        <button class="btn-action" style="float:none;" onclick="startQuiz()">Start Lab</button>
    </div>

    <div id="screen-quiz" class="hidden">
        <div class="hud">
            <span>Question <span id="q-count">1</span>/5</span>
            <span>Stars: ⭐ <span id="score">0</span></span>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        
        <div class="question-text" id="q-text"></div>
        <div class="options-grid" id="options-box"></div>
        <div id="feedback-box" class="feedback hidden"></div>
        <div style="height: 50px; margin-top: 10px;">
            <button id="btn-next" class="btn-action hidden" onclick="nextQuestion()">Continue ➡️</button>
        </div>
    </div>

    <div id="screen-result" class="hidden text-center">
        <h2>Module Complete!</h2>
        <h1 id="final-score" style="font-size: 3.5rem; color: var(--primary);">0/5</h1>
        <p id="result-msg"></p>
        <button class="btn-action" style="float:none;" onclick="location.reload()">Restart</button>
    </div>
</div>

<script>
    const audio = {
        correct: new Audio('assets/correct.mp3'),
        wrong: new Audio('assets/wrong.mp3'),
        claps: new Audio('assets/freesound_community-claps-44774.mp3')
    };

    const questions = [
        {
            q: "Priya pours hot tea into a cup. After 20 minutes, it feels the same temperature as the room. What best explains this?",
            options: ["The cup absorbed all the heat permanently", "Heat flowed from hot tea to cooler surroundings", "Water lost due to evaporation", "Cold air replaced the heat"],
            ans: 1,
            explain: "Heat always flows from hotter to cooler objects until thermal equilibrium is reached."
        },
        {
            q: "A student wants to express the amount of heat absorbed by water during an experiment using the S.I. system. Which unit is correct?",
            options: ["Calorie", "Joule (J)", "Degree Celsius", "Watt (W)"],
            ans: 1,
            explain: "Joule (J) is the Standard International (S.I.) unit for heat energy."
        },
        {
            q: "Arjun's mother uses a clinical thermometer to check boiling water. It suddenly breaks. Why?",
            options: ["It was not sterilized", "Boiling water is beyond its limited safe range", "Mercury does not work with water", "Clinical thermometers only read 0°C"],
            ans: 1,
            explain: "Clinical thermometers are designed only for human body range (35°C to 42°C)."
        },
        {
            q: "Meena notices the handle of a metal spoon becomes hot when left in a soup bowl. This is due to:",
            options: ["Radiation", "Convection", "Conduction", "Evaporation"],
            ans: 2,
            explain: "Conduction is heat transfer through solids via particle contact."
        },
        {
            q: "Which of these is an insulator (poor conductor) of heat?",
            options: ["Iron Nail", "Copper Wire", "Plastic Scale", "Aluminium Foil"],
            ans: 2,
            explain: "Plastic does not allow heat to flow through it easily, making it an insulator."
        }
    ];

    let curIdx = 0, score = 0, attempts = 0;

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('brand-layer').style.opacity = '0';
            setTimeout(() => document.getElementById('brand-layer').classList.add('hidden'), 800);
        }, 1500);
    };

    function startQuiz() {
        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-quiz').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const data = questions[curIdx];
        attempts = 0;
        document.getElementById('q-count').innerText = curIdx + 1;
        document.getElementById('q-text').innerText = data.q;
        document.getElementById('feedback-box').classList.add('hidden');
        document.getElementById('btn-next').classList.add('hidden');
        document.getElementById('progress-fill').style.width = ((curIdx / questions.length) * 100) + '%';

        const box = document.getElementById('options-box');
        box.innerHTML = '';
        data.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAns(i, btn);
            box.appendChild(btn);
        });
    }

    function checkAns(idx, btn) {
        const data = questions[curIdx];
        const feedback = document.getElementById('feedback-box');
        const allBtns = document.querySelectorAll('.option-btn');

        allBtns.forEach(b => b.disabled = true);

        if(idx === data.ans) {
            btn.classList.add('correct');
            audio.correct.play();
            audio.correct.onended = () => {
                audio.claps.play();
                if(attempts === 0) score++;
                document.getElementById('score').innerText = score;
                feedback.innerHTML = `<b>Correct!</b><br>${data.explain}`;
                feedback.classList.remove('hidden');
                document.getElementById('btn-next').classList.remove('hidden');
            };
        } else {
            btn.classList.add('wrong');
            audio.wrong.play();
            audio.wrong.onended = () => {
                attempts++;
                if(attempts < 2) {
                    allBtns.forEach(b => { if(!b.classList.contains('wrong')) b.disabled = false; });
                    feedback.innerHTML = `<b>Incorrect.</b> Try your second chance!`;
                    feedback.classList.remove('hidden');
                } else {
                    allBtns[data.ans].classList.add('correct');
                    feedback.innerHTML = `<b>Out of chances.</b> The answer is: <i>${data.options[data.ans]}</i>.<br>${data.explain}`;
                    feedback.classList.remove('hidden');
                    document.getElementById('btn-next').classList.remove('hidden');
                }
            };
        }
    }

    function nextQuestion() {
        curIdx++;
        if(curIdx < questions.length) loadQuestion();
        else showResult();
    }

    function showResult() {
        document.getElementById('screen-quiz').classList.add('hidden');
        document.getElementById('screen-result').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score}/5`;
        audio.claps.play();
        document.getElementById('result-msg').innerText = score >= 4 ? "Excellent work!" : "Review the concepts and try again!";
    }
</script>
</body>
</html>
