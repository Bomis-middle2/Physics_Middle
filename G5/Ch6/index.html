<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovine Science Lab - Measurement & Motion</title>
    <style>
        :root {
            --primary: #2980b9;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f4f7f6;
            --card-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Initializing Screen */
        #brand-screen {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Main Container */
        .game-card {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: var(--card-shadow);
            border: 4px solid var(--primary);
            position: relative;
        }

        .hidden { display: none !important; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .branding-title { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin: 0; }

        .hud { font-weight: bold; color: #2c3e50; display: flex; gap: 20px; }

        .progress-container { height: 12px; background: #eee; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        #progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s; }

        .question-text { font-size: 1.2rem; color: #2c3e50; line-height: 1.6; margin-bottom: 20px; font-weight: 500; }

        .options-grid { display: grid; gap: 12px; }
        .option-btn {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.2s;
            color: #34495e;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0f7fc; }
        .correct { background: var(--success) !important; color: white; border-color: #1e8449 !important; font-weight: bold; }
        .wrong { background: var(--danger) !important; color: white; border-color: #922b21 !important; animation: shake 0.4s; }

        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

        .feedback-box { margin-top: 20px; padding: 15px; border-radius: 12px; background: #ebf5fb; border-left: 5px solid var(--primary); color: #2c3e50; line-height: 1.5; }

        .btn-next {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            float: right;
            box-shadow: 0 4px 0 #1b4f72;
            transition: background 0.2s;
        }
        .btn-next:hover { background: var(--accent); }
        .btn-next:active { transform: translateY(2px); box-shadow: 0 2px 0 #1b4f72; }
    </style>
</head>
<body>

<div id="brand-screen">
    <div class="spinner"></div>
    <h2 style="color: #2c3e50; font-family: sans-serif; margin: 0;">Innovine Science Lab</h2>
    <p style="color: #7f8c8d; margin-top: 5px;">Loading Measurement & Motion Experiments...</p>
</div>

<div class="game-card hidden" id="game-card">
    <div class="header">
        <div class="branding-title">Innovine Lab</div>
        <div class="hud">
            <span>Challenge: <span id="q-num">1</span>/12</span>
            <span>Stars: ⭐ <span id="score">0</span></span>
        </div>
    </div>

    <div class="progress-container"><div id="progress-bar"></div></div>

    <div id="quiz-content">
        <div class="question-text" id="q-text"></div>
        <div class="options-grid" id="options-box"></div>
        <div id="feedback-area" class="feedback-box hidden"></div>
        <div style="height: 60px;">
            <button id="next-btn" class="btn-next hidden" onclick="handleNext()">Next Challenge ➡️</button>
        </div>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center;">
        <h1 style="color: var(--primary);">Lab Assessment Complete!</h1>
        <h2 id="final-score" style="font-size: 3rem; margin: 10px 0; color: #2c3e50;">0/12</h2>
        <p id="result-msg" style="font-size: 1.2rem; color: #7f8c8d; margin-bottom: 25px;"></p>
        <button class="btn-next" style="float: none;" onclick="location.reload()">Restart Lab</button>
    </div>
</div>

<script>
    // 12 Full Grade 6 Physics Questions compiled directly from curriculum requirements
    const questions = [
        {
            q: "Riya measures a classroom using her footsteps. Her friend measures the same classroom and gets a different answer. Why are their measurements different?",
            options: [
                "The classroom changed its size during the measurements.",
                "Their footsteps are of different lengths.",
                "One student counted incorrectly.",
                "The floor of the classroom is uneven."
            ],
            ans: 1,
            explain: "Footsteps, hand spans, and paces are non-standard units of length. They vary from person to person because people have different body sizes."
        },
        {
            q: "A tailor always measures cloth using a standard metal measuring tape or meter rod instead of hand span. What is the main advantage of doing this?",
            options: [
                "It makes the measurement process much faster.",
                "It makes the cloth look longer to the customer.",
                "It provides a uniform, reliable, and accurate measurement.",
                "It makes the cloth much easier to fold after cutting."
            ],
            ans: 2,
            explain: "Standard units of measurement ensure consistency across the world so that everyone records and understands the exact same quantity."
        },
        {
            q: "A student wants to measure the thickness of a small coin. Which standard unit of length is most suitable for this task?",
            options: [
                "Kilometer",
                "Meter",
                "Centimeter",
                "Millimeter"
            ],
            ans: 3,
            explain: "The millimeter (mm) is the smallest common graduation on standard school rulers and is perfect for tiny dimensions like the thickness of a wire or coin."
        },
        {
            q: "Four students recorded the distance they travel to reach school: Aman travels 500 m, Neha travels 2 km, Kabir travels 800 m, and Sara travels 1 km. Who travels the longest distance?",
            options: [
                "Aman",
                "Neha",
                "Kabir",
                "Sara"
            ],
            ans: 1,
            explain: "Converting all measurements to meters: Aman = 500 m, Kabir = 800 m, Sara = 1000 m (1 km), and Neha = 2000 m (2 km). Therefore, Neha travels the furthest."
        },
        {
            q: "A student measures a pencil using a broken ruler. They align one end with the 1 cm mark instead of zero and read 15 cm at the tip. What should the true length be?",
            options: [
                "Accept 15 cm as the actual reading.",
                "Add 1 cm to the final reading (16 cm).",
                "Subtract the starting reading from the final reading (14 cm).",
                "Discard the value and guess the size."
            ],
            ans: 2,
            explain: "When a ruler has a broken or worn-out zero end, you can measure from any clear mark and subtract that initial value from your final reading (15 cm - 1 cm = 14 cm)."
        },
        {
            q: "Rohan wants to find the precise length of a curved pathway winding through a garden. Which method will give him the most accurate result?",
            options: [
                "Lay a rigid wooden ruler flat along the bends.",
                "Trace along the curve with a piece of flexible string, then measure the straight string with a ruler.",
                "Estimate the measurement by looking at it closely.",
                "Pace out the distance using standard footsteps."
            ],
            ans: 1,
            explain: "Rigid rulers cannot bend around twists. Tracing a curved boundary with flexible thread and then checking the stretched thread length on a scale is the correct approach."
        },
        {
            q: "Assertion: A passenger sitting completely still inside a moving school bus is said to be both at rest and in motion at the same time. Reason: Motion depends on the chosen reference point.",
            options: [
                "Both Assertion and Reason are true, and the reason perfectly explains the assertion.",
                "Both are true, but the reason does NOT explain the assertion.",
                "The Assertion is correct, but the Reason is completely false.",
                "The Assertion is false, but the Reason is correct."
            ],
            ans: 0,
            explain: "Motion is relative. Relative to the bus seats, the passenger is at rest; but relative to trees outside on the roadside, they are in rapid motion."
        },
        {
            q: "An electric ceiling fan operates continuously in a school room at a steady, fixed speed. What type of motion is the fan blade exhibiting?",
            options: [
                "Translatory motion",
                "Circular motion",
                "Oscillatory motion",
                "Rectilinear motion"
            ],
            ans: 1,
            explain: "When an object spins around a fixed point or central axis so that its parts remain a constant distance from that axis, it is undergoing circular motion."
        },
        {
            q: "A car drives slowly through crowded market traffic, stops at red signals, and accelerates quickly on an open highway. This pattern of motion is classified as:",
            options: [
                "Uniform motion",
                "Non-uniform motion",
                "Circular motion",
                "Vibratory motion"
            ],
            ans: 0,
            explain: "An object is in non-uniform motion if it travels unequal distances in equal intervals of time due to varying speed."
        },
        {
            q: "Identify the odd one out from the following moving systems based on their structural type of motion.",
            options: [
                "A child on a playground swing",
                "A grandfather clock's swinging pendulum",
                "A plucked, vibrating guitar string",
                "A train moving along a straight track"
            ],
            ans: 3,
            explain: "The swing, pendulum, and guitar string all demonstrate periodic/oscillatory patterns (to-and-fro movement). The train shows rectilinear/translatory motion."
        },
        {
            q: "Meera walks a distance of 600 meters to the store in 10 minutes. Her brother covers the identical 600 meters in 6 minutes. Who is moving at a faster speed?",
            options: [
                "Meera",
                "Her brother",
                "Both are moving at the exact same speed.",
                "It cannot be determined without a speedometer."
            ],
            ans: 1,
            explain: "Speed is distance divided by time. Because her brother covers the same physical distance in less time, his rate of travel is faster."
        },
        {
            q: "When an inspector tightens a metal screw down into a piece of wood using a screwdriver, which multiple types of motion occur simultaneously?",
            options: [
                "Only translatory motion.",
                "Only circular motion.",
                "Both circular and translatory motion together.",
                "Purely oscillatory motion."
            ],
            ans: 2,
            explain: "As the screw turns, it rotates about its center (circular motion) while simultaneously sinking forward deeper into the wooden plank (translatory/rectilinear motion)."
        }
    ];

    let currentIdx = 0, score = 0, attempts = 0;

    // Loading screen sequence
    setTimeout(() => {
        document.getElementById('brand-screen').style.display = 'none';
        document.getElementById('game-card').classList.remove('hidden');
        loadQuestion();
    }, 2000);

    function loadQuestion() {
        const data = questions[currentIdx];
        attempts = 0;
        document.getElementById('q-num').innerText = currentIdx + 1;
        document.getElementById('q-text').innerText = data.q;
        document.getElementById('feedback-area').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('progress-bar').style.width = ((currentIdx / questions.length) * 100) + '%';

        const box = document.getElementById('options-box');
        box.innerHTML = '';
        data.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i, btn);
            box.appendChild(btn);
        });
    }

    function checkAnswer(idx, btn) {
        const data = questions[currentIdx];
        const feedback = document.getElementById('feedback-area');
        const allBtns = document.querySelectorAll('.option-btn');

        allBtns.forEach(b => b.disabled = true);

        if (idx === data.ans) {
            btn.classList.add('correct');
            if (attempts === 0) score++;
            document.getElementById('score').innerText = score;
            feedback.innerHTML = `<b>🌟 Correct!</b><br>${data.explain}`;
            feedback.classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            btn.classList.add('wrong');
            attempts++;
            if (attempts < 2) {
                setTimeout(() => {
                    allBtns.forEach(b => { if(!b.classList.contains('wrong')) b.disabled = false; });
                    feedback.innerHTML = `<b>Try again!</b> That choice is incorrect. You have 1 attempt remaining.`;
                    feedback.classList.remove('hidden');
                }, 400);
            } else {
                allBtns[data.ans].classList.add('correct');
                feedback.innerHTML = `<b>Out of attempts!</b> The correct answer was choice ${String.fromCharCode(65 + data.ans)}.<br>${data.explain}`;
                feedback.classList.remove('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }
    }

    function handleNext() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-content').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('final-score').innerText = `${score}/${questions.length}`;
        
        let msg = "Keep reviewing your physics labs! Scientific inquiry is a continuous journey.";
        if (score === questions.length) msg = "Perfect Score! Excellent grasp of standard scales and kinematics! 🏆👨‍🔬";
        else if (score >= 9) msg = "Great job! You have a highly accurate understanding of measurement techniques.";
        
        document.getElementById('result-msg').innerText = msg;
    }
</script>

</body>
</html>
