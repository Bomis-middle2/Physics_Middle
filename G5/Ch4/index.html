<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Force and Energy</title>
    <style>
        :root {
            --primary-blue: #1a73e8;
            --light-blue-bg: #e8f0fe;
            --accent-gold: #f9ab00;
            --light-gold-bg: #fef7e0;
            --success: #1e8e3e;
            --danger: #d93025;
            --light-grey: #f8f9fa;
            --text-dark: #202124;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #eef1f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            padding: 25px;
            margin: 10px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            min-height: 600px;
            border-top: 8px solid var(--primary-blue);
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .logo-main { width: 280px; height: auto; max-width: 85%; margin-bottom: 30px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- TOP DASHBOARD ROW --- */
        .stats-dashboard {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            flex: 1;
            padding: 12px 5px;
            border-radius: 16px;
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: #2c3e50;
        }
        .stat-card.blue-pill {
            background-color: var(--light-blue-bg);
        }
        .stat-card.gold-pill {
            background-color: var(--light-gold-bg);
        }

        /* --- UI ELEMENTS --- */
        .timer-track { width: 100%; height: 8px; background: #e8eaed; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--primary-blue); transition: width 1s linear; }

        .q-title { font-size: 0.9rem; color: #5f6368; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
        .q-text { font-size: 1.1rem; font-weight: 600; line-height: 1.4; margin-bottom: 20px; color: var(--text-dark); }

        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 1rem; }
        .data-table th, .data-table td { border: 1px solid #dadce0; padding: 12px; text-align: left; }
        .data-table th { background: #f1f3f4; font-weight: 700; }

        .options-grid { display: grid; gap: 12px; }
        .opt-btn {
            background: #fff; border: 2px solid #dadce0; padding: 16px;
            border-radius: 14px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s;
            color: #3c4043; font-weight: 500;
        }
        .opt-btn.correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .opt-btn.wrong { background: var(--danger) !important; color: white; border-color: var(--danger); opacity: 0.7; }

        .feedback { margin-top: 15px; padding: 15px; border-radius: 14px; display: none; line-height: 1.5; font-size: 0.95rem; animation: pop 0.3s ease; }
        .hint { background: #fff7e0; border-left: 5px solid var(--accent-gold); color: #856404; }
        .expl { background: #e8f0fe; border-left: 5px solid var(--primary-blue); color: #1967d2; }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        #action-btn { width: 100%; margin-top: 20px; padding: 18px; background: var(--primary-blue); color: white; border: none; border-radius: 16px; font-weight: 700; font-size: 1rem; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" class="logo-main" onerror="this.src='https://via.placeholder.com/280x100?text=INNOVINE'" alt="Logo">
        <div class="loader"></div>
    </div>

    <div id="intro-view" class="hidden" style="text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 15px;">⚡</div>
        <h1 style="color: var(--primary-blue); margin: 0;">Force and Energy</h1>
        <p style="color: #5f6368; margin-top: 10px;">Grade 5 Challenge</p>
        <div style="background: #f8f9fa; padding: 20px; border-radius: 20px; margin: 25px 0; text-align: left; border: 1px dashed #dadce0; font-size: 0.95rem; line-height: 1.5;">
            Welcome! Apply your knowledge to solve real-world problems. You have <b>2 attempts</b> per question. 
        </div>
        <button id="start-btn" style="width:100%; padding:20px; background:var(--primary-blue); color:white; border:none; border-radius:50px; font-weight:bold; font-size:1.1rem; cursor:pointer;">START CHALLENGE</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="stats-dashboard">
            <div class="stat-card blue-pill">Question <span id="q-num">1</span>/10</div>
            <div class="stat-card blue-pill">Score: <span id="score-val">0</span></div>
            <div class="stat-card gold-pill">Time: <span id="timer-val">45</span>s</div>
        </div>
        
        <div class="timer-track"><div id="timer-bar"></div></div>
        <div id="q-category" class="q-title"></div>
        <div id="q-text" class="q-text"></div>
        <div id="table-area"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">NEXT QUESTION →</button>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <div style="font-size: 4.5rem; margin-bottom: 10px;">🏅</div>
        <h2 style="color: var(--primary-blue);">Challenge Complete</h2>
        <div style="font-size: 4.5rem; font-weight: 900; color: #202124; margin: 10px 0;"><span id="final-pts">0</span>/10</div>
        <p id="result-msg" style="color:#5f6368; margin-bottom:30px;"></p>
        <button onclick="location.reload()" style="width:100%; padding:18px; background:var(--primary-blue); color:white; border:none; border-radius:16px; font-weight:700; cursor:pointer;">RESTART CHALLENGE</button>
    </div>
</div>

<script>
    // --- AUDIO SYSTEM ---
    const sfx = {
        correct: new Audio('assets/correct.mp3'),
        wrong: new Audio('assets/wrong.mp3'),
        victory: new Audio('assets/freesound_community-claps-44774.mp3')
    };

    const questions = [
        { 
            cat: "Surface Investigation", 
            q: "Three students pushed identical boxes. Based on the table, why did Student A need the least effort?", 
            table: `<tr><th>Student</th><th>Surface</th><th>Result</th></tr>
                    <tr><td>A</td><td>Marble floor</td><td>Box moved easily</td></tr>
                    <tr><td>B</td><td>Grass</td><td>Box moved slowly</td></tr>
                    <tr><td>C</td><td>Sand</td><td>Box hardly moved</td></tr>`,
            opts: ["Marble increases gravity", "Marble has less friction", "Sand reduces force", "Grass increases mass"], 
            ans: 1, hint: "Smoother surfaces allow objects to slide more easily.", expl: "Marble is a smooth surface that offers very little resistance (friction) compared to grass or sand." 
        },
        { 
            cat: "Safety Observation", 
            q: "After rain, the corridor became slippery. Why did the principal ask students to walk carefully?", 
            opts: ["Water increases muscular force", "Friction between shoes and floor decreases", "Gravity becomes stronger", "Air resistance increases"], 
            ans: 1, hint: "Slippery surfaces mean your shoes can't 'grip' the floor.", expl: "Water acts as a lubricant, reducing friction and making it easier to slip." 
        },
        { 
            cat: "Design Challenge", 
            q: "Rohan is designing shoes for mountain climbing. Which sole should he select for safety?", 
            opts: ["Smooth plastic sole", "Metal sole", "Rough rubber sole", "Glass surface sole"], 
            ans: 2, hint: "Climbers need 'grippy' soles to stay on rocks.", expl: "Rough surfaces increase friction, providing the grip needed for climbing." 
        },
        { 
            cat: "Data Interpretation", 
            q: "Students placed objects in water. What scientific conclusion is correct?", 
            table: `<tr><th>Object</th><th>Observation</th></tr>
                    <tr><td>Stone</td><td>Sank</td></tr>
                    <tr><td>Plastic ball</td><td>Floated</td></tr>
                    <tr><td>Wooden block</td><td>Floated</td></tr>`,
            opts: ["Water pushes objects upward", "Floating depends only on size", "Gravity stops in water", "Floating objects have no weight"], 
            ans: 0, hint: "Why do some objects stay on top of the water?", expl: "Water exerts an upward force (buoyancy) that supports floating objects." 
        },
        { 
            cat: "Mass and Motion", 
            q: "Riya pushes an empty trolley (fast) vs a loaded trolley (slow). Why the difference?", 
            opts: ["Force decreased", "Mass increased needing more force", "Gravity stopped working", "Speed controls force"], 
            ans: 1, hint: "Heavier things are harder to speed up.", expl: "Increasing mass means you need more force to achieve the same movement." 
        },
        { 
            cat: "Assertion–Reason", 
            q: "Assertion: A stationary ball moves when kicked. Reason: Force can change state of motion.", 
            opts: ["Both are true and R explains A", "Both true but not explanation", "A true, R false", "A false, R true"], 
            ans: 0, hint: "Does a kick count as a force? Does it make the ball move?", expl: "Force is required to change an object's state from rest to motion." 
        },
        { 
            cat: "Error Detection", 
            q: "A student says: 'Force is ONLY needed to start motion, not to stop it.' Find the error.", 
            opts: ["Force is also needed to stop motion", "Motion stops automatically", "Gravity stops objects", "Air stops objects"], 
            ans: 0, hint: "How do you catch and stop a moving ball?", expl: "To stop or slow down a moving object, an opposite force must be applied." 
        },
        { 
            cat: "Inertia Comparison", 
            q: "Why do heavy buses take longer to stop than bicycles at the same speed?", 
            opts: ["Larger mass requires more stopping force", "Less friction", "More gravity", "Less speed"], 
            ans: 0, hint: "Which one is much heavier and harder to slow down?", expl: "Greater mass means greater inertia, requiring more force to stop." 
        },
        { 
            cat: "Friction Mechanics", 
            q: "Why is a rolling suitcase easier to move than a dragging bag?", 
            opts: ["Rolling friction < sliding friction", "Gravity reduced", "Mass decreased", "Air resistance increased"], 
            ans: 0, hint: "Think about why we use wheels.", expl: "Rolling friction is much weaker than sliding friction, allowing easier movement." 
        },
        { 
            cat: "Real-Life Application", 
            q: "Why is friction called a 'necessary evil'?", 
            opts: ["It stops all motion", "It allows us to control movement", "It reduces force completely", "It removes gravity"], 
            ans: 1, hint: "Try to imagine walking on perfectly smooth oil.", expl: "We need friction to walk, write, and safely control vehicles." 
        }
    ];

    let current = 0, score = 0, attempts = 0, timer, timeLeft = 45;

    // --- SHUFFLE ENGINE ---
    function shuffleQuestions(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro-view').classList.remove('hidden');
        }, 5000);
    };

    function startChallenge() {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        shuffleQuestions(questions);
        loadQuestion();
    }
    document.getElementById('start-btn').onclick = startChallenge;

    function loadQuestion() {
        attempts = 0; timeLeft = 45;
        const q = questions[current];
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('timer-val').innerText = timeLeft;
        document.getElementById('q-category').innerText = q.cat;
        document.getElementById('q-text').innerText = q.q;
        
        const tableArea = document.getElementById('table-area');
        tableArea.innerHTML = q.table ? `<table class="data-table">${q.table}</table>` : "";
        
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => handleChoice(i, b);
            area.appendChild(b);
        });
        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-val').innerText = timeLeft;
            document.getElementById('timer-bar').style.width = (timeLeft/45*100) + "%";
            if(timeLeft <= 0) { clearInterval(timer); endTurn(); }
        }, 1000);
    }

    function handleChoice(i, b) {
        if(i === questions[current].ans) {
            clearInterval(timer);
            sfx.correct.play().catch(e => {});
            b.classList.add('correct');
            score++;
            document.getElementById('score-val').innerText = score * 100;
            endTurn();
        } else {
            attempts++;
            sfx.wrong.play().catch(e => {});
            b.classList.add('wrong');
            b.disabled = true;
            if(attempts === 1) {
                const f = document.getElementById('feedback-box');
                f.className = 'feedback hint';
                f.innerHTML = "💡 <b>HINT:</b> " + questions[current].hint;
                f.style.display = 'block';
            } else {
                clearInterval(timer);
                endTurn();
            }
        }
    }

    function endTurn() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        document.querySelectorAll('.opt-btn')[questions[current].ans].classList.add('correct');
        const f = document.getElementById('feedback-box');
        f.className = 'feedback expl';
        f.innerHTML = "🔍 <b>EXPLANATION:</b> " + questions[current].expl;
        f.style.display = 'block';
        document.getElementById('action-btn').classList.remove('hidden');
    }

    document.getElementById('action-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else {
            sfx.victory.play().catch(e => {});
            showResults();
        }
    };

    function showResults() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        document.getElementById('final-pts').innerText = score;
        const msg = document.getElementById('result-msg');
        if(score >= 9) msg.innerText = "Exceptional! You've mastered forces and energy variants.";
        else if(score >= 7) msg.innerText = "Great job! You have a solid grasp of basic physics principles.";
        else msg.innerText = "Keep testing your knowledge! Practice with different scenarios.";
    }
</script>
</body>
</html>
