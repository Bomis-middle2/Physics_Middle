<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simple Machines</title>
    <style>
        :root {
            --primary-blue: #1a73e8;
            --light-blue-bg: #e8f0fe;
            --accent-gold: #f9ab00;
            --light-gold-bg: #fef7e0;
            --success: #1e8e3e;
            --danger: #d93025;
            --light-grey: #f8f9fa;
            --text-dark: #202124;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #eef1f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            padding: 25px;
            margin: 10px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            min-height: 600px;
            border-top: 8px solid var(--primary-blue);
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .logo-main { width: 280px; height: auto; max-width: 85%; margin-bottom: 30px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- NEW TOP DASHBOARD ROW --- */
        .stats-dashboard {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            flex: 1;
            padding: 12px 5px;
            border-radius: 16px;
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: #2c3e50;
        }
        .stat-card.blue-pill {
            background-color: var(--light-blue-bg);
        }
        .stat-card.gold-pill {
            background-color: var(--light-gold-bg);
        }

        /* --- UI ELEMENTS --- */
        .timer-track { width: 100%; height: 8px; background: #e8eaed; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--primary-blue); transition: width 1s linear; }

        .q-title { font-size: 0.9rem; color: #5f6368; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
        .q-text { font-size: 1.1rem; font-weight: 600; line-height: 1.4; margin-bottom: 20px; color: var(--text-dark); }

        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 1rem; }
        .data-table td { border: 1px solid #dadce0; padding: 12px; text-align: left; }

        .options-grid { display: grid; gap: 12px; }
        .opt-btn {
            background: #fff; border: 2px solid #dadce0; padding: 16px;
            border-radius: 14px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s;
            color: #3c4043; font-weight: 500;
        }
        .opt-btn.correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .opt-btn.wrong { background: var(--danger) !important; color: white; border-color: var(--danger); opacity: 0.7; }

        .feedback { margin-top: 15px; padding: 15px; border-radius: 14px; display: none; line-height: 1.5; font-size: 0.95rem; animation: pop 0.3s ease; }
        .hint { background: #fff7e0; border-left: 5px solid var(--accent-gold); color: #856404; }
        .expl { background: #e8f0fe; border-left: 5px solid var(--primary-blue); color: #1967d2; }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        #action-btn { width: 100%; margin-top: 20px; padding: 18px; background: var(--primary-blue); color: white; border: none; border-radius: 16px; font-weight: 700; font-size: 1rem; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" class="logo-main" onerror="this.src='https://via.placeholder.com/280x100?text=INNOVINE'" alt="Logo">
        <div class="loader"></div>
    </div>

    <div id="intro-view" class="hidden" style="text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 15px;">⚙️</div>
        <h1 style="color: var(--primary-blue); margin: 0;">Simple Machines</h1>
        <p style="color: #5f6368; margin-top: 10px;">Grade 5 Challenge</p>
        <div style="background: #f8f9fa; padding: 20px; border-radius: 20px; margin: 25px 0; text-align: left; border: 1px dashed #dadce0; font-size: 0.95rem; line-height: 1.5;">
            Welcome! Apply your knowledge to solve real-world problems. You have <b>2 attempts</b> per question. 
        </div>
        <button id="start-btn" style="width:100%; padding:20px; background:var(--primary-blue); color:white; border:none; border-radius:50px; font-weight:bold; font-size:1.1rem; cursor:pointer;">START CHALLENGE</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="stats-dashboard">
            <div class="stat-card blue-pill">Question <span id="q-num">1</span>/12</div>
            <div class="stat-card blue-pill">Score: <span id="score-val">0</span></div>
            <div class="stat-card gold-pill">Time: <span id="timer-val">45</span>s</div>
        </div>
        
        <div class="timer-track"><div id="timer-bar"></div></div>
        <div id="q-category" class="q-title"></div>
        <div id="q-text" class="q-text"></div>
        <div id="table-area"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">NEXT QUESTION →</button>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <div style="font-size: 4.5rem; margin-bottom: 10px;">⚙️</div>
        <h2 style="color: var(--primary-blue);">Challenge Complete</h2>
        <div style="font-size: 4.5rem; font-weight: 900; color: #202124; margin: 10px 0;"><span id="final-pts">0</span>/12</div>
        <p id="result-msg" style="color:#5f6368; margin-bottom:30px;"></p>
        <button onclick="location.reload()" style="width:100%; padding:18px; background:var(--primary-blue); color:white; border:none; border-radius:16px; font-weight:700; cursor:pointer;">RESTART CHALLENGE</button>
    </div>
</div>

<script>
    // --- AUDIO SYSTEM ---
    const sfx = {
        correct: new Audio('assets/correct.mp3'),
        wrong: new Audio('assets/wrong.mp3'),
        victory: new Audio('assets/freesound_community-claps-44774.mp3')
    };

    const questions = [
        { cat: "Construction Site Problem", q: "Workers use a long wooden ramp to move cement bags into a truck. Why is this method easier?", opts: ["The bags become lighter", "Effort is reduced by increasing distance", "Gravity disappears", "Friction increases"], ans: 1, hint: "An inclined plane spreads the work over a longer path.", expl: "A ramp reduces the force needed by increasing the distance over which the load is moved." },
        { cat: "Playground Observation", q: "A lighter child balances a heavier child on a seesaw by sitting farther from the center. What does this show?", opts: ["Air pressure balances the seesaw", "Distance from the fulcrum affects turning effect", "Gravity changes on both sides", "Friction balances weight"], ans: 1, hint: "The 'turning power' depends on weight and its distance from the pivot.", expl: "Moving further from the fulcrum increases the mechanical advantage of the lever." },
        { cat: "Engineering Thinking", q: "Why do cranes use multiple pulleys instead of a single pulley?", opts: ["To increase the load’s weight", "To reduce the effort needed to lift loads", "To stop movement completely", "To reduce the crane’s height"], ans: 1, hint: "More loops of rope mean less pulling force is required.", expl: "A system of pulleys (block and tackle) divides the load among several ropes." },
        { cat: "Everyday Technology", q: "Suitcases at airports are fitted with wheels mainly to:", opts: ["increase weight", "reduce friction during movement", "increase effort", "reduce gravity"], ans: 1, hint: "Rolling is much easier than dragging.", expl: "Wheels replace sliding friction with rolling friction, which is much weaker." },
        { cat: "Higher-Order Application", q: "A mechanic uses a long spanner to loosen a tight nut. Why does a longer spanner help?", opts: ["It increases turning effect", "It decreases gravity", "It increases the nut’s weight", "It removes friction completely"], ans: 0, hint: "A longer lever arm makes it easier to twist things.", expl: "Torque (turning effect) is calculated as force multiplied by the length of the lever." },
        { cat: "Image-Based HOTS", q: "Why does the sharp edge of the tool cut more effectively?", opts: ["It increases pressure on a smaller area", "It increases gravity", "It decreases force", "It removes friction completely"], ans: 0, hint: "A thinner edge concentrates all your force onto a tiny line.", expl: "Pressure = Force / Area. A smaller area (sharp edge) creates high pressure." },
        { cat: "Assertion–Reason", q: "Assertion (A): Pulleys are used in flagpoles to help in lifting heavy loads easily. \nReason (R): Pulleys reduce the effort needed by changing the direction or distribution of force.", opts: ["Both A and R are true, and R correctly explains A", "Both A and R are true, but R does not explain A", "A is true, but R is false", "A is false, but R is true"], ans: 0, hint: "Flagpoles use a single fixed pulley. Does it change the direction you pull?", expl: "Pulleys change the direction of force, making it easier to pull down to lift something up." },
        { cat: "Case-Based Question", q: "Observe the table carefully and determine the conclusion.", table: "<tr><td>Ramp</td><td>Inclined Plane</td></tr><tr><td>Seesaw</td><td>Lever</td></tr><tr><td>Flag Pole</td><td>Pulley</td></tr>", opts: ["All are simple machines", "Only ramps reduce effort", "Only levers are useful", "Machines remove gravity"], ans: 0, hint: "Look at the items listed. What category do they all belong to?", expl: "Levers, pulleys, and inclined planes are all different types of simple machines." },
        { cat: "Real-Life Decision Making", q: "A school wants to lift heavy stage equipment safely with minimum effort. Which option would be the BEST choice?", opts: ["Inclined plane only", "Multiple pulley system", "Knife", "Screwdriver"], ans: 1, hint: "Which machine is specifically designed to lift heavy loads vertically with ease?", expl: "Multiple pulley systems are the most efficient for vertical lifting of heavy equipment." },
        { cat: "Image-Based Reasoning", q: "Why is a round door knob easier to turn?", opts: ["It uses wheel and axle principle to increase turning effect", "It removes gravity", "It decreases friction completely", "It reduces the door’s weight"], ans: 0, hint: "The knob is the wheel, and the internal rod is the axle.", expl: "A wheel and axle setup magnifies the force applied to the knob to move the latch." },
        { cat: "Error Detection", q: "A student says: “Simple machines reduce the amount of work done.” Identify the correct explanation.", opts: ["Machines reduce effort, not total work", "Machines make work disappear", "Machines remove force completely", "There is no error"], ans: 0, hint: "Machines make work easier, but you still move the same amount of energy.", expl: "Work is Force x Distance. Machines reduce force but increase distance, keeping total work the same." },
        { cat: "Design Thinking Question", q: "Why is the invention of the wheel considered one of the most important discoveries in human history?", opts: ["It helped reduce friction during movement", "It increased effort during transport", "It removed gravity", "It stopped motion"], ans: 0, hint: "Before wheels, humans had to drag heavy things across the ground.", expl: "The wheel dramatically reduced friction, enabling the transport of heavy loads." }
    ];

    let current = 0, score = 0, attempts = 0, timer, timeLeft = 45;

    // --- SHUFFLE ENGINE ---
    function shuffleQuestions(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro-view').classList.remove('hidden');
        }, 5000);
    };

    function startChallenge() {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        shuffleQuestions(questions);
        loadQuestion();
    }
    document.getElementById('start-btn').onclick = startChallenge;

    function loadQuestion() {
        attempts = 0; timeLeft = 45;
        const q = questions[current];
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('timer-val').innerText = timeLeft;
        document.getElementById('q-category').innerText = q.cat;
        document.getElementById('q-text').innerText = q.q;
        
        const tableArea = document.getElementById('table-area');
        tableArea.innerHTML = q.table ? `<table class="data-table">${q.table}</table>` : "";
        
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => handleChoice(i, b);
            area.appendChild(b);
        });
        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-val').innerText = timeLeft;
            document.getElementById('timer-bar').style.width = (timeLeft/45*100) + "%";
            if(timeLeft <= 0) { clearInterval(timer); endTurn(); }
        }, 1000);
    }

    function handleChoice(i, b) {
        if(i === questions[current].ans) {
            clearInterval(timer);
            sfx.correct.play().catch(e => {});
            b.classList.add('correct');
            score++;
            document.getElementById('score-val').innerText = score * 100;
            endTurn();
        } else {
            attempts++;
            sfx.wrong.play().catch(e => {});
            b.classList.add('wrong');
            b.disabled = true;
            if(attempts === 1) {
                const f = document.getElementById('feedback-box');
                f.className = 'feedback hint';
                f.innerHTML = "💡 <b>HINT:</b> " + questions[current].hint;
                f.style.display = 'block';
            } else {
                clearInterval(timer);
                endTurn();
            }
        }
    }

    function endTurn() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        document.querySelectorAll('.opt-btn')[questions[current].ans].classList.add('correct');
        const f = document.getElementById('feedback-box');
        f.className = 'feedback expl';
        f.innerHTML = "🔍 <b>EXPLANATION:</b> " + questions[current].expl;
        f.style.display = 'block';
        document.getElementById('action-btn').classList.remove('hidden');
    }

    document.getElementById('action-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else {
            sfx.victory.play().catch(e => {});
            showResults();
        }
    };

    function showResults() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        document.getElementById('final-pts').innerText = score;
        const msg = document.getElementById('result-msg');
        if(score >= 10) msg.innerText = "Exceptional! You've mastered simple machines.";
        else if(score >= 7) msg.innerText = "Great job! You have a solid grasp of how machines work.";
        else msg.innerText = "Keep testing your knowledge! Practice with different scenarios.";
    }
</script>
</body>
</html>
