<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Innovine: Reflection & Refraction Control</title>
    <style>
        :root {
            --primary-blue: #4361ee;
            --electric-yellow: #ffd60a;
            --success-green: #2ec4b6;
            --error-red: #e71d36;
            --light-bg: #f0f2f5;
            --text-dark: #2b2d42;
            --panel-white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-white);
            border-radius: 28px;
            padding: 25px;
            margin: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            min-height: 550px;
            border-top: 10px solid var(--primary-blue);
        }

        /* --- SPLASH SCREEN (Blinks Once) --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: blinkOnce 2s ease-in-out forwards;
        }

        .splash-logo {
            max-width: 200px;
            max-height: 200px;
            object-fit: contain;
        }

        @keyframes blinkOnce {
            0% { opacity: 0; }
            25% { opacity: 1; }
            75% { opacity: 1; }
            100% { opacity: 0; pointer-events: none; }
        }

        /* --- GAME UI --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .case-badge { background: var(--primary-blue); color: white; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 0.8rem; letter-spacing: 1px; }
        .score-box { font-weight: 800; color: var(--primary-blue); }

        .question-text { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
        
        /* OPTIMIZED ENLARGED IMAGE BOX CONTAINER */
        .image-container { 
            width: 100%; 
            margin-bottom: 20px; 
            border-radius: 15px; 
            overflow: hidden; 
            border: 2px solid #f1f3f5;
            display: flex; 
            justify-content: center; 
            background: #fff; 
            padding: 5px;
        }
        .q-img { 
            width: 100%;
            max-height: 240px; 
            object-fit: contain; 
            display: block; 
        }

        .options-grid { display: grid; gap: 12px; }
        .opt-btn {
            background: #fff; border: 2px solid #edf2f4; padding: 16px;
            border-radius: 15px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s;
            color: var(--text-dark); font-weight: 500; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .opt-btn:hover { border-color: var(--primary-blue); }
        
        .opt-btn.correct { background: var(--success-green) !important; color: white; border-color: var(--success-green); transform: scale(1.02); }
        .opt-btn.wrong { background: var(--error-red) !important; color: white; border-color: var(--error-red); opacity: 0.7; }

        .feedback { margin-top: 20px; padding: 15px; border-radius: 15px; display: none; line-height: 1.5; margin-bottom: 10px; animation: slideUp 0.4s ease; }
        .hint-mode { background: #fff3cd; border-left: 5px solid var(--electric-yellow); color: #856404; }
        .expl-mode { background: #d1ecf1; border-left: 5px solid var(--primary-blue); color: #0c5460; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #action-btn { 
            width: 100%; margin-top: 20px; padding: 18px; 
            background: var(--primary-blue); color: white; 
            border: none; border-radius: 16px; font-weight: 800; 
            font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo" class="splash-logo">
    </div>

    <div id="intro-view" class="hidden" style="text-align: center;">
        <div style="margin-bottom: 15px;">
            <img src="assets/logo.png" alt="Innovine Logo" style="max-height: 60px; object-fit: contain;">
        </div>
        <h1 style="color: var(--primary-blue); margin: 0; font-weight: 800;">Light Analytics</h1>
        <p style="color: #6c757d; margin-top: 5px; margin-bottom: 20px;">Reflection and Refraction (Grade 8)</p>
        <div style="background: #f8f9fa; padding: 20px; border-radius: 20px; margin: 25px 0; text-align: left; border: 1px dashed #dee2e6;">
            Welcome to the Optical Physics Terminal. Ready to measure refraction deviations and focal properties? You have <b>2 attempts</b> per critical processing node.
        </div>
        <button id="start-btn" style="width:100%; padding:20px; background:var(--primary-blue); color:white; border:none; border-radius:50px; font-weight:bold; font-size:1.1rem; cursor:pointer;">ENGAGE SYSTEM</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="header">
            <div class="case-badge">NODE #<span id="q-num">1</span></div>
            <div class="score-box">LUMENS: <span id="score-val">0</span> lm</div>
        </div>
        <div id="q-text" class="question-text"></div>
        <div id="image-area"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">CONTINUE →</button>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <div id="result-icon" style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
        <h2 style="color: var(--primary-blue);">Mission Report</h2>
        <div style="font-size: 4.5rem; font-weight: 900; color: var(--text-dark); margin: 10px 0;"><span id="final-pts">0</span>/1000</div>
        <p id="result-msg" style="color:#6c757d; margin-bottom:30px; line-height: 1.4;"></p>
        <button onclick="location.reload()" style="width:100%; padding:18px; background:var(--primary-blue); color:white; border:none; border-radius:16px; font-weight:700; cursor:pointer;">REBOOT SYSTEM</button>
    </div>
</div>

<script>
    // Shuffled answers mixed safely across varied keys (0 to 3) to prevent repeating letters
    const questions = [
        { q: "You are standing 2 meters in front of a plane mirror. If you move 1 meter closer to the mirror, what is the distance between you and your image?", opts: ["1 meter", "2 meters", "3 meters", "4 meters"], ans: 1, hint: "Calculate your new distance to the mirror first, then double it to include the reflection path inside.", expl: "Moving 1m closer means you are now 1m from the mirror surface. Since the reflection inside forms at an identical distance, the complete barrier span is 1m + 1m = 2 meters." },
        { q: "A pencil placed in a glass of water looks bent at the surface. This phenomenon happens because:", img: "assets/q2.jpg", opts: ["The pencil actually breaks.", "The glass acts as a mirror.", "Light changes speed and direction as it moves from water to air (Refraction).", "The water is dirty."], ans: 2, hint: "Think about what happens to moving light waves when navigating between materials of different densities.", expl: "This is refraction. When light rays travel through boundary densities (like water to air), their relative velocity changes, creating a visible directional bend." },
        { q: "In a plane mirror, if the angle of incidence is 40°, what is the total angle between the incident ray and the reflected ray?", opts: ["40°", "50°", "90°", "80°"], ans: 3, hint: "Remember that Angle of Incidence = Angle of Reflection. Add both to discover the total expanse.", expl: "According to mirror physics laws, the reflection angle matches the incidence index (40°). The full corner expanse equals both combined: 40° + 40° = 80°." },
        { q: "A white light ray passes through a glass prism and splits into seven colors. Which color bends the most?", opts: ["Violet", "Red", "Green", "Yellow"], ans: 0, hint: "The color with the shortest wavelength slows down the most in glass and experiences the steepest deviation turn.", expl: "Violet light features a shorter wavelength frequency within the visible spectrum, causing it to refract at a much sharper deviation angle than red." },
        { q: "A student states: 'A virtual image can be captured on a screen.' Why is this statement wrong?", opts: ["Screens can only show real objects.", "Only real images can be captured on a screen; virtual images only appear inside mirrors.", "Virtual images are invisible.", "Screens reflect virtual images."], ans: 1, hint: "Do the light rays forming a virtual image physically intersect at a focus point outside the glass?", expl: "Real images are formed by real converging light beams hitting a focal surface. Virtual image paths do not actually intersect on a screen; they are optical projections seen inside the mirror matrix." },
        { q: "Which type of mirror is used by dentists to see a magnified, upright image of teeth?", opts: ["Convex Mirror", "Concave Mirror", "Plane Mirror", "Double Mirror"], ans: 1, hint: "Which profile acts as a magnifying screen when positioned extremely close to a target object?", expl: "A concave mirror creates an enlarged, upright virtual projection when the object is held close within its focal radius." },
        { q: "Why is the identifier word 'AMBULANCE' printed as its mirror image on the front of the vehicle?", opts: ["It’s a coding mistake.", "To allow drivers in front to read it correctly due to lateral inversion in their mirrors.", "To look unique.", "It is an ancient tradition."], ans: 1, hint: "How do rearview side glass panels process incoming horizontal image orientations?", expl: "Rearview mirrors introduce lateral inversion. Reversing the primary print layout ensures drivers tracking ahead see the word oriented normally in their reflection glass." },
        { q: "Which specific anatomical part of the eye acts as a 'screen' where incoming optical images form?", img: "assets/q8.jpg", opts: ["Iris", "Pupil", "Retina", "Lens"], ans: 2, hint: "Focus on the sensory neural layer sitting along the back wall of the eye structure.", expl: "The retina sits at the rear baseline of the eye structure. It is packed with light-sensitive photo-receptors that catch inverted focal points before sending data to the brain." },
        { q: "Identify the processing device from this list that does NOT utilize a refraction lens:", opts: ["Telescope", "Microscope", "Periscope", "Spectacles"], ans: 2, hint: "One of these instruments works completely via reflections using flat, angled plane surfaces.", expl: "Telescopes, microscopes, and spectacles rely on glass curve lenses to bend light. Periscopes redirect light rays using flat plane mirrors angled at 45°." },
        { q: "A person struggles to process nearby objects clearly but sees distant landscapes cleanly. Which structural lens corrects this?", opts: ["Convex Lens", "Concave Lens", "Plane Glass", "Sunglasses"], ans: 0, hint: "They need a converging lens to bring the close-up focal plane forward onto the retina surface.", expl: "This condition is hypermetropia (farsightedness). A convex (converging) lens brings the light focal convergence forward to align squarely on the retina surface." }
    ];

    let current = 0, score = 0, attempts = 0;
    
    // --- AUDIO INSTANCES ---
    const sndC = new Audio('assets/correct.mp3');
    const sndW = new Audio('assets/wrong.mp3');
    const sndF = new Audio('assets/freesound_community-claps-44774.mp3');

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro-view').classList.remove('hidden');
        }, 2000);
    };

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        loadQuestion();
    };

    function loadQuestion() {
        attempts = 0;
        const q = questions[current];
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('q-text').innerText = q.q;
        
        const imgArea = document.getElementById('image-area');
        imgArea.innerHTML = q.img ? `<div class="image-container"><img src="${q.img}" class="q-img"></div>` : "";
        
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => handleChoice(i, b);
            area.appendChild(b);
        });
    }

    function handleChoice(i, b) {
        if(i === questions[current].ans) {
            b.classList.add('correct');
            score += 100;
            document.getElementById('score-val').innerText = score;
            sndC.play().catch(e => console.log("Audio waiting..."));
            endTurn();
        } else {
            attempts++;
            b.classList.add('wrong');
            b.disabled = true;
            sndW.play().catch(e => console.log("Audio waiting..."));
            if(attempts === 1) {
                const f = document.getElementById('feedback-box');
                f.className = 'feedback hint-mode';
                f.innerHTML = "🔍 <b>DIAGNOSTIC HINT:</b> " + questions[current].hint;
                f.style.display = 'block';
            } else {
                endTurn();
            }
        }
    }

    function endTurn() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        document.querySelectorAll('.opt-btn')[questions[current].ans].classList.add('correct');
        const f = document.getElementById('feedback-box');
        f.className = 'feedback expl-mode';
        f.innerHTML = "📋 <b>LEARNING HUB:</b> " + questions[current].expl;
        f.style.display = 'block';
        document.getElementById('action-btn').classList.remove('hidden');
    }

    document.getElementById('action-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else showResults();
    };

    function showResults() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        document.getElementById('final-pts').innerText = score;
        
        sndF.play().catch(e => console.log("Audio playback waiting"));
        
        const msg = document.getElementById('result-msg');
        if(score >= 900) msg.innerText = "Highly luminous execution! Your focal matrices and refractive indexes are calibrated flawlessly.";
        else if(score >= 700) msg.innerText = "Optics stable. Convergence maps successfully passed operational verification thresholds.";
        else msg.innerText = "Diffused light readings. Review lens focus values and baseline reflection properties.";
    }
</script>
</body>
</html>
