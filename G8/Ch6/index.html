<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Innovine: Electricity & Magnetism Terminal</title>
    <style>
        :root {
            --primary-blue: #4361ee;
            --electric-yellow: #ffd60a;
            --success-green: #2ec4b6;
            --error-red: #e71d36;
            --light-bg: #f0f2f5;
            --text-dark: #2b2d42;
            --panel-white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-white);
            border-radius: 28px;
            padding: 25px;
            margin: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            min-height: 550px;
            border-top: 10px solid var(--primary-blue);
        }

        /* --- SPLASH SCREEN (Blinks Once) --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: blinkOnce 2s ease-in-out forwards;
        }

        .splash-logo {
            max-width: 200px;
            max-height: 200px;
            object-fit: contain;
        }

        @keyframes blinkOnce {
            0% { opacity: 0; }
            25% { opacity: 1; }
            75% { opacity: 1; }
            100% { opacity: 0; pointer-events: none; }
        }

        /* --- GAME UI --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .case-badge { background: var(--primary-blue); color: white; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 0.8rem; letter-spacing: 1px; }
        .score-box { font-weight: 800; color: var(--primary-blue); }

        .question-text { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
        
        /* OPTIMIZED ENLARGED IMAGE BOX CONTAINER */
        .image-container { 
            width: 100%; 
            margin-bottom: 20px; 
            border-radius: 15px; 
            overflow: hidden; 
            border: 2px solid #f1f3f5;
            display: flex; 
            justify-content: center; 
            background: #fff; 
            padding: 5px;
        }
        .q-img { 
            width: 100%;
            max-height: 240px; 
            object-fit: contain; 
            display: block; 
        }

        .options-grid { display: grid; gap: 12px; }
        .opt-btn {
            background: #fff; border: 2px solid #edf2f4; padding: 16px;
            border-radius: 15px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s;
            color: var(--text-dark); font-weight: 500; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .opt-btn:hover { border-color: var(--primary-blue); }
        
        .opt-btn.correct { background: var(--success-green) !important; color: white; border-color: var(--success-green); transform: scale(1.02); }
        .opt-btn.wrong { background: var(--error-red) !important; color: white; border-color: var(--error-red); opacity: 0.7; }

        .feedback { margin-top: 20px; padding: 15px; border-radius: 15px; display: none; line-height: 1.5; margin-bottom: 10px; animation: slideUp 0.4s ease; }
        .hint-mode { background: #fff3cd; border-left: 5px solid var(--electric-yellow); color: #856404; }
        .expl-mode { background: #d1ecf1; border-left: 5px solid var(--primary-blue); color: #0c5460; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #action-btn { 
            width: 100%; margin-top: 20px; padding: 18px; 
            background: var(--primary-blue); color: white; 
            border: none; border-radius: 16px; font-weight: 800; 
            font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo" class="splash-logo">
    </div>

    <div id="intro-view" class="hidden" style="text-align: center;">
        <div style="margin-bottom: 15px;">
            <img src="assets/logo.png" alt="Innovine Logo" style="max-height: 60px; object-fit: contain;">
        </div>
        <h1 style="color: var(--primary-blue); margin: 0; font-weight: 800;">Electromagnetic Lab</h1>
        <p style="color: #6c757d; margin-top: 5px; margin-bottom: 20px;">Electricity and Magnetism (Grade 7)</p>
        <div style="background: #f8f9fa; padding: 20px; border-radius: 20px; margin: 25px 0; text-align: left; border: 1px dashed #dee2e6;">
            Welcome to the Electrodynamics Core Terminal. Ready to inspect continuous circuit paths and track flux loops? You have <b>2 attempts</b> per structural network node.
        </div>
        <button id="start-btn" style="width:100%; padding:20px; background:var(--primary-blue); color:white; border:none; border-radius:50px; font-weight:bold; font-size:1.1rem; cursor:pointer;">ENGAGE SYSTEM</button>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="header">
            <div class="case-badge">NODE #<span id="q-num">1</span></div>
            <div class="score-box">ENERGY: <span id="score-val">0</span> V</div>
        </div>
        <div id="q-text" class="question-text"></div>
        <div id="image-area"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">CONTINUE →</button>
    </div>

    <div id="result-view" class="hidden" style="text-align:center;">
        <div id="result-icon" style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
        <h2 style="color: var(--primary-blue);">Mission Report</h2>
        <div style="font-size: 4.5rem; font-weight: 900; color: var(--text-dark); margin: 10px 0;"><span id="final-pts">0</span>/1000</div>
        <p id="result-msg" style="color:#6c757d; margin-bottom:30px; line-height: 1.4;"></p>
        <button onclick="location.reload()" style="width:100%; padding:18px; background:var(--primary-blue); color:white; border:none; border-radius:16px; font-weight:700; cursor:pointer;">REBOOT SYSTEM</button>
    </div>
</div>

<script>
    const questions = [
        { q: "If you have a circuit with a bulb and a battery, and you replace the copper wire with a silk thread, the bulb will not glow. Why?", opts: ["Silk is too thin.", "Silk is an insulator and does not allow current to flow.", "Silk is not magnetic.", "The battery will explode."], ans: 1, hint: "Think about the structural difference between materials that pass charge carriers easily and those that block them.", expl: "Copper is a conductor packed with free electrons. Silk is an insulator; its atomic layout holds electrons tightly, blocking the electric current required to fire up the bulb filament." },
        { q: "Take a close look at this configuration. What is this structural induction assembly called?", img: "assets/q2.jpg", opts: ["A permanent magnet.", "An insulator.", "A secondary cell.", "An electromagnet."], ans: 3, hint: "Look at the coil wrapped around an iron core linked directly to an active source of charge.", expl: "This is an electromagnet. Wrapping insulated wire loops around a soft iron core creates temporary, controllable magnetic fields as long as current flows." },
        { q: "If three cells of 1.5V each are connected in series (positive terminal directly to negative terminal), what is the total combined voltage of the battery?", opts: ["1.5V", "3.0V", "4.5V", "0V"], ans: 2, hint: "When cell modules are arranged head-to-tail in series, their electrical potentials add together.", expl: "Arrangling power sources in series scales up total output line voltage linearly. 1.5V + 1.5V + 1.5V = 4.5V total potential difference." },
        { q: "A technician mounts an 'Electric Fuse' inside a main distribution board. What happens when the current becomes dangerously high?", opts: ["The fuse glows brighter.", "The fuse stores extra electricity.", "The fuse wire melts and breaks the circuit to prevent fire.", "The fuse reverses the current."], ans: 2, hint: "Consider what happens when extreme thermal energy meets a wire with a very low melting point.", expl: "Electric fuses work via the heating effect of current. High overcurrent spikes produce extreme heat, melting the low-point fuse wire to break the pathway instantly." },
        { q: "An individual claims: 'A magnet can exist with just a single isolated pole, either North or South.' Correct this structural misconception.", opts: ["Magnets have no poles.", "Magnetic poles always exist in pairs (North and South).", "Magnets have three poles.", "Only artificial magnets have two poles."], ans: 1, hint: "What happens if you slice a bar magnet exactly down the middle?", expl: "Magnetic monopoles do not exist in nature. Cutting a magnet in half simply creates two smaller, fully realized dipoles, each with its own North and South pole." },
        { q: "Which of the following household appliances relies fundamentally on the magnetic effect of electric current?", opts: ["Electric Bell", "Electric Toaster", "Electric Iron", "Electric Geyser"], ans: 0, hint: "Three of these turn electric current into thermal heat. One uses current to pull a mechanical striker.", expl: "Toasters, irons, and geysers rely on resistive heating elements. Electric bells use an internal electromagnet coil to rapidly pull and release an iron clapper." },
        { q: "Why are the handles of screwdrivers used by professional electricians encased in thick plastic or rubber?", opts: ["To provide a soft grip.", "Plastic is an insulator and prevents electric shocks.", "Metal handles are too heavy.", "Plastic handles look colorful."], ans: 1, hint: "Identify the material properties needed to isolate high-potential electron paths from passing into human tissue.", expl: "Plastic and rubber exhibit extremely high electrical resistance. Acting as insulators, they block path flows from live wires through the tool to the user's hand." },
        { q: "If a compass is placed near a wire carrying current, the needle deflects. This proves:", img: "assets/q8.jpg", opts: ["The wire is made of iron.", "Electric current produces a magnetic field.", "The compass is broken.", "The wire is pulling the compass."], ans: 1, hint: "What invisible field is needed to exert a physical torque on a magnetized compass needle?", expl: "Discovered by Hans Christian Ørsted, passing an electric current through a conductor creates an active surrounding magnetic field that shifts nearby compass needles." },
        { q: "Identify the element from this list that does NOT belong to the group of ferromagnetic materials:", opts: ["Iron", "Nickel", "Cobalt", "Aluminium"], ans: 3, hint: "Three of these elements are strongly attracted to permanent magnets; one does not interact with magnets under normal conditions.", expl: "Iron, nickel, and cobalt possess unique atomic alignments making them ferromagnetic. Aluminium is non-magnetic and does not experience strong magnetic attraction." },
        { q: "How can you significantly increase the overall field strength of a standard electromagnet setup?", opts: ["Use a plastic core.", "Decrease the current.", "Increase the number of turns of wire in the coil.", "Remove the battery."], ans: 2, hint: "Think about how concentration and density of loop passes stack magnetic field vectors together.", expl: "Each individual wire loop contributes its own magnetic field lines. Increasing the total number of turns concentrates and amplifies the net magnetic flux." }
    ];

    let current = 0, score = 0, attempts = 0;
    
    // --- AUDIO INSTANCES ---
    const sndC = new Audio('assets/correct.mp3');
    const sndW = new Audio('assets/wrong.mp3');
    const sndF = new Audio('assets/freesound_community-claps-44774.mp3');

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro-view').classList.remove('hidden');
        }, 2000);
    };

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        loadQuestion();
    };

    function loadQuestion() {
        attempts = 0;
        const q = questions[current];
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('q-text').innerText = q.q;
        
        const imgArea = document.getElementById('image-area');
        imgArea.innerHTML = q.img ? `<div class="image-container"><img src="${q.img}" class="q-img"></div>` : "";
        
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => handleChoice(i, b);
            area.appendChild(b);
        });
    }

    function handleChoice(i, b) {
        if(i === questions[current].ans) {
            b.classList.add('correct');
            score += 100;
            document.getElementById('score-val').innerText = score;
            sndC.play().catch(e => console.log("Audio waiting..."));
            endTurn();
        } else {
            attempts++;
            b.classList.add('wrong');
            b.disabled = true;
            sndW.play().catch(e => console.log("Audio waiting..."));
            if(attempts === 1) {
                const f = document.getElementById('feedback-box');
                f.className = 'feedback hint-mode';
                f.innerHTML = "🔍 <b>DIAGNOSTIC HINT:</b> " + questions[current].hint;
                f.style.display = 'block';
            } else {
                endTurn();
            }
        }
    }

    function endTurn() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        document.querySelectorAll('.opt-btn')[questions[current].ans].classList.add('correct');
        const f = document.getElementById('feedback-box');
        f.className = 'feedback expl-mode';
        f.innerHTML = "📋 <b>LEARNING HUB:</b> " + questions[current].expl;
        f.style.display = 'block';
        document.getElementById('action-btn').classList.remove('hidden');
    }

    document.getElementById('action-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else showResults();
    };

    function showResults() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        document.getElementById('final-pts').innerText = score;
        
        sndF.play().catch(e => console.log("Audio playback waiting"));
        
        const msg = document.getElementById('result-msg');
        if(score >= 900) msg.innerText = "Maximum voltage! Your electrical loops and flux vector calculations are pristine.";
        else if(score >= 700) msg.innerText = "Circuit complete. Magnetic fields and paths have verified successfully.";
        else msg.innerText = "High resistance detected. Re-verify insulation layouts and core induction formulas.";
    }
</script>
</body>
</html>
