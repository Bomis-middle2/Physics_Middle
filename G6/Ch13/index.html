<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Science Lab: Motion</title>
    <style>
        :root {
            --primary-purple: #6c5ce7;
            --mint-teal: #00cec9;
            --hud-blue: #e8f0fe;
            --hud-orange: #fff3e0;
            --success: #2ed573;
            --error: #ff4757;
            --bg-grid: #f1f2f6;
            --text-main: #2f3542;
            --border-light: #ced6e0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-grid);
            background-image: radial-gradient(#ced6e0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 28px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            min-height: 540px;
            border: 3px solid var(--primary-purple);
        }

        /* --- SPLASH SCREEN CONTAINER --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .logo-main {
            width: 240px;
            height: auto;
            max-width: 80%;
            margin-bottom: 25px;
            object-fit: contain;
        }

        .loader-track {
            width: 160px; height: 6px; background: #e4e7eb;
            border-radius: 10px; position: relative; overflow: hidden;
        }
        .loader-fill {
            width: 0%; height: 100%; background: var(--primary-purple);
            animation: bootApp 5s linear forwards;
        }
        @keyframes bootApp { to { width: 100%; } }

        /* --- INTRO & INSTRUCTIONS VIEW --- */
        .lab-title {
            color: var(--primary-purple);
            font-size: 2.2rem;
            margin: 10px 0;
            font-weight: 800;
        }

        .rule-badge {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 25px 0;
            color: #000000;
        }

        #start-btn {
            background: var(--mint-teal);
            color: #ffffff;
            font-family: inherit;
            border: none;
            padding: 16px 45px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 206, 201, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #start-btn:active {
            transform: scale(0.96);
            box-shadow: 0 3px 8px rgba(0, 206, 201, 0.2);
        }

        /* --- HORIZONTAL HUD SYSTEM --- */
        .hud-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }
        .hud-pill {
            text-align: center;
            padding: 12px 6px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 -3px 0px rgba(0,0,0,0.06);
        }
        .hud-pill.blue { background-color: var(--hud-blue); color: #1e3a8a; }
        .hud-pill.orange { background-color: var(--hud-orange); color: #c2410c; }

        .timer-track { width: 100%; height: 8px; background: #f1f2f6; border-radius: 20px; margin-bottom: 25px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--primary-purple); transition: width 1s linear; }

        /* --- INTERACTIVE PLAYGROUND --- */
        .question-text { font-size: 1.15rem; font-weight: 700; line-height: 1.5; margin-bottom: 20px; }
        
        .img-container { width: 100%; margin-bottom: 20px; border-radius: 16px; overflow: hidden; border: 2px solid var(--border-light); }
        .q-img { width: 100%; display: block; }

        .options-grid { display: grid; gap: 12px; }
        .opt-btn {
            background: #ffffff; border: 2px solid var(--border-light); padding: 16px;
            border-radius: 16px; text-align: left; font-size: 1rem; font-weight: 600;
            color: var(--text-main); cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 0px var(--border-light);
        }
        .opt-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0px var(--border-light); }
        
        .opt-btn.correct { background: var(--success) !important; color: white; border-color: var(--success); box-shadow: 0 4px 0px #26af5f; }
        .opt-btn.wrong { background: var(--error) !important; color: white; border-color: var(--error); box-shadow: 0 4px 0px #b8323d; opacity: 0.85; }

        .feedback { margin-top: 20px; padding: 16px; border-radius: 16px; display: none; line-height: 1.5; font-size: 0.95rem; font-weight: 600; }
        .hint-box { background: #ffeaa7; border: 2px solid #f1c40f; color: #b78a00; }
        .expl-box { background: #dff9fb; border: 2px solid #81ecec; color: #0097e6; }

        #action-btn { 
            width: 100%; margin-top: 25px; padding: 18px; 
            background: var(--primary-purple); color: white; 
            border: none; border-radius: 16px; font-weight: 700; 
            font-size: 1.05rem; cursor: pointer; box-shadow: 0 4px 0px #4834d4;
        }
        #action-btn:active { transform: translateY(2px); box-shadow: 0 2px 0px #4834d4; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="splash-screen">
        <img src="assets/logo.png" class="logo-main" alt="Innovine Solutions Logo">
        <div class="loader-track"><div class="loader-fill"></div></div>
    </div>

    <div id="intro-view" class="hidden" style="text-align: center; padding-top: 40px;">
        <h1 class="lab-title">Science Lab: Motion</h1>
        <div class="rule-badge">Strict Rule: Only 2 chances per question! 🧪</div>
        <div style="margin-top: 40px;">
            <button id="start-btn">Start 🚀</button>
        </div>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="hud-row">
            <div class="hud-pill blue">Question <span id="q-num">1</span>/10</div>
            <div class="hud-pill blue">Score: <span id="score-val">0</span></div>
            <div class="hud-pill orange">Time: <span id="timer-text">60s</span></div>
        </div>
        <div class="timer-track"><div id="timer-bar"></div></div>
        
        <div id="q-text" class="question-text"></div>
        <div id="image-area"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="hidden">CONTINUE MISSION →</button>
    </div>

    <div id="result-view" class="hidden" style="text-align:center; padding-top: 30px;">
        <div style="font-size: 4.5rem; margin-bottom: 15px;">🏆</div>
        <h2 style="color: var(--primary-purple); font-size: 1.8rem; margin: 0;">Lab Evaluation Complete</h2>
        <div style="font-size: 4.5rem; font-weight: 900; color: var(--text-main); margin: 20px 0;"><span id="final-pts">0</span>/10</div>
        <p id="result-msg" style="color:#57606f; font-size: 1.1rem; margin-bottom: 35px; padding: 0 10px; line-height: 1.5;"></p>
        <button onclick="location.reload()" style="width:100%; padding:18px; background:var(--primary-purple); color:white; border:none; border-radius:16px; font-weight:700; font-size: 1rem; cursor:pointer; box-shadow: 0 4px 0px #4834d4;">RUN EXPERIMENT AGAIN</button>
    </div>
</div>

<script>
    const questions = [
        { q: "A car travels 100 meters in 5 seconds. What is its average speed down the straightaway track?", opts: ["10 m/s", "20 m/s", "50 m/s", "500 m/s"], ans: 1, hint: "Speed parameters are calculated using the core formula: Distance divided by Time.", expl: "Dividing 100 meters by 5 seconds yields exactly 20 m/s." },
        { q: "Review the motion mapping. What core dimension does the slope of a position vs. time graph demonstrate?", img: "q2.png", opts: ["Total acceleration structural load", "Instantaneous velocity metric", "Cumulative distance covered", "Static mass retention"], ans: 1, hint: "Consider the change of position value relative to each unit sequence of time elapsed.", expl: "The changing rate of position over time represents velocity; therefore, the local slope directly equals velocity." },
        { q: "If an object maintains a perfectly constant velocity state, what must its total net acceleration evaluate to?", opts: ["A value steadily multiplying", "Exactly zero", "It shifts dependent on starting mass", "A value equal to gravity"], ans: 1, hint: "Acceleration maps velocity variation. If velocity does not vary, what is the change calculation value?", expl: "Acceleration explicitly measures change over time in velocity. Zero change yields exactly zero acceleration value parameters." },
        { q: "A rolling ball changes its speed from 2 m/s to 14 m/s over a span of 3 seconds. Calculate its average acceleration.", opts: ["2 m/s²", "4 m/s²", "6 m/s²", "12 m/s²"], ans: 1, hint: "Acceleration equals the change in speed divided by time taken.", expl: "The speed change is 12 m/s (14 minus 2). Dividing 12 m/s by 3 seconds yields 4 m/s²." },
        { q: "Which of the following scenarios is a definitive example of an object undergoing acceleration?", opts: ["A capsule sitting completely still on a launchpad", "A train traveling due north along a straight track at a locked 60 mph", "A bicycle tracking along a circular path at a steady 10 mph", "A book resting horizontally on a flat tabletop"], ans: 2, hint: "Velocity is a vector quantity combining speed and target vector direction. Altering either variable requires acceleration.", expl: "Even at consistent speed tracking, changing curves continually alters directional vectors, constituting active acceleration." },
        { q: "An apple breaks loose from a tree branch and drops straight to Earth. What force accelerates it downward?", opts: ["Atmospheric pressure variance", "Earth's gravitational pulling force", "Centrifugal rotational inertia", "Magnetic alignment displacement"], ans: 1, hint: "It is the universal attraction force active between any massive objects.", expl: "Gravity pulls all unanchored masses towards the center of the Earth at a standardized localized rate." },
        { q: "What does a flat, completely horizontal line mean on a Speed vs. Time graph?", opts: ["The object has come to a dead stop", "The object is traveling with a constant speed profile", "The object is accelerating at a uniform pace", "The object is returning to its initial origin point"], ans: 1, hint: "Look closely at the vertical axis label: speed. If the line is flat, that specific value is not moving up or down.", expl: "A horizontal line tells us that as time moves forward, the speed value stays exactly the same." },
        { q: "A student runs 3 kilometers east, then turns around and runs 2 kilometers west. What is their final total displacement?", opts: ["1 kilometer east", "1 kilometer west", "5 kilometers east", "5 kilometers total"], ans: 0, hint: "Displacement tracks the straight-line shortcut distance from the starting line to the finish line.", expl: "The total path length is 5 kilometers, but the final net change in position is just 1 kilometer east of the origin point." },
        { q: "Analyze the specialized experimental system data chart provided in the lab monitor view.", img: "q9.png", opts: ["Object properties show non-uniform acceleration patterns", "System demonstrates uniform velocity profile tracking", "Object maintains a static, non-moving equilibrium position", "Velocity scales exponentially relative to mass"], ans: 1, hint: "Observe whether position values shift by equivalent increments across each sequence block of time.", expl: "Linear position tracking directly establishes constant velocity output parameters across all timeline targets." },
        { q: "If you drop a heavy bowling ball and a light tennis ball at the exact same moment inside a vacuum chamber with zero air resistance, which hits the floor first?", opts: ["The heavy bowling ball", "The light tennis ball", "Both hit the floor at the exact same moment", "The ball with the larger surface area"], ans: 2, hint: "Without air blocking the way, gravity accelerates all falling masses at the exact same rate.", expl: "In a total vacuum, gravity acts equally on all matter. Both items fall and accelerate down in perfect synchronization." }
    ];

    let current = 0, score = 0, attempts = 0, timer, timeLeft = 60;

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('intro-view').classList.remove('hidden');
        }, 5000);
    };

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('intro-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        loadQuestion();
    };

    function loadQuestion() {
        attempts = 0; timeLeft = 60;
        const q = questions[current];
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = current + 1;
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('timer-text').innerText = timeLeft + "s";
        
        const imgArea = document.getElementById('image-area');
        imgArea.innerHTML = q.img ? `<div class="img-container"><img src="assets/${q.img}" class="q-img" alt="Data Monitor View"></div>` : "";
        
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = o;
            b.onclick = () => verifySelection(i, b);
            area.appendChild(b);
        });
        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-text').innerText = timeLeft + "s";
            document.getElementById('timer-bar').style.width = (timeLeft/60*100) + "%";
            if(timeLeft <= 0) { clearInterval(timer); endTurn(); }
        }, 1000);
    }

    function verifySelection(i, b) {
        if(i === questions[current].ans) {
            clearInterval(timer);
            b.classList.add('correct');
            score++;
            document.getElementById('score-val').innerText = score;
            endTurn();
        } else {
            attempts++;
            b.classList.add('wrong');
            b.disabled = true;
            if(attempts === 1) {
                const f = document.getElementById('feedback-box');
                f.className = 'feedback hint-box';
                f.innerHTML = "💡 <b>HINT:</b> " + questions[current].hint;
                f.style.display = 'block';
            } else {
                clearInterval(timer);
                endTurn();
            }
        }
    }

    function endTurn() {
        document.querySelectorAll('.opt-btn').forEach(btn => btn.disabled = true);
        document.querySelectorAll('.opt-btn')[questions[current].ans].classList.add('correct');
        const f = document.getElementById('feedback-box');
        f.className = 'feedback expl-box';
        f.innerHTML = "🧪 <b>LAB ANALYSIS:</b> " + questions[current].expl;
        f.style.display = 'block';
        document.getElementById('action-btn').classList.remove('hidden');
    }

    document.getElementById('action-btn').onclick = () => {
        current++;
        if(current < questions.length) loadQuestion();
        else evaluatePerformance();
    };

    function evaluatePerformance() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        document.getElementById('final-pts').innerText = score;
        const msg = document.getElementById('result-msg');
        if(score >= 9) msg.innerText = "Superb! You are a master physicist. Your predictive calculations match true spatial mechanics perfectly.";
        else if(score >= 6) msg.innerText = "Good performance, lab technician! You have a firm grasp of relative motion dynamics.";
        else msg.innerText = "Experiment parameters require attention. Re-evaluate core physics calculations and run the simulations again!";
    }
</script>
</body>
</html>
