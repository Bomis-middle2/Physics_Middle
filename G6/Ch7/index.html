<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grade 6 Science - Motion & Measurement</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --accent: #00cec9;
            --success: #00b894;
            --danger: #d63031;
            --warning: #fdcb6e;
            --bg: #f0f3f7;
            --hud-blue: #e3f2fd;
            --hud-orange: #fff3e0;
        }

        * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background: var(--bg);
            background-image: radial-gradient(#dfe6e9 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 10px;
        }

        #brand-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.8s ease;
        }
        #brand-layer img { max-width: 180px; margin-bottom: 20px; }
        .loader { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .game-card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 20px 0px rgba(0,0,0,0.05), 0 30px 60px rgba(108, 92, 231, 0.15);
            border: 4px solid var(--primary);
            position: relative;
            z-index: 10;
        }

        .hidden { display: none !important; }

        .hud-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .hud-pill {
            text-align: center;
            padding: 12px 8px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: bold;
            color: #2d3436;
            box-shadow: inset 0 -2px 0px rgba(0,0,0,0.05);
        }
        .hud-pill.blue { background-color: var(--hud-blue); }
        .hud-pill.orange { background-color: var(--hud-orange); }

        .progress-container { width: 100%; height: 12px; background: #eee; border-radius: 10px; margin-bottom: 10px; border: 2px solid #ddd; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); transition: width 0.5s ease; }

        .timer-track { width: 100%; height: 8px; background: #edf2f4; border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--accent); transition: width 1s linear; }

        h2 { font-size: 1.15rem; color: #2d3436; line-height: 1.5; margin-bottom: 25px; font-weight: 600; white-space: pre-line; }

        .options-list { display: grid; gap: 15px; }
        .option-item {
            background: #f9f9f9;
            border: 3px solid #dfe6e9;
            padding: 16px 22px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            color: #636e72;
            transition: 0.2s;
            text-align: left;
            width: 100%;
            line-height: 1.3;
        }
        .option-item:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--primary); background: #f1f0ff; }
        .option-item:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .correct { background: var(--success) !important; color: white !important; border-color: #009473 !important; opacity: 1 !important; }
        .wrong { background: var(--danger) !important; color: white !important; border-color: #b33939 !important; animation: shake 0.4s; opacity: 0.7 !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .feedback { margin-top: 25px; padding: 20px; border-radius: 15px; background: #f0f0ff; border: 2px dashed var(--primary); font-size: 1rem; line-height: 1.4; }
        
        .btn-fancy {
            background: var(--accent); color: white; border: none; padding: 15px 35px; border-radius: 50px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0px #00aaa7;
            display: inline-block;
        }
        .btn-fancy:active { transform: translateY(4px); box-shadow: 0 2px 0px #00aaa7; }
        .text-center { text-align: center; }
    </style>
</head>
<body>

    <div id="brand-layer">
        <img src="assets/logo.png" onerror="this.src='https://via.placeholder.com/180x60?text=INNOVINE'" alt="Logo">
        <div class="loader"></div>
    </div>

    <div class="game-card">
        <div id="screen-start" class="text-center">
            <h1 style="color:var(--primary); margin-bottom: 10px;">Motion & Measurement</h1>
            <p style="margin-top: 0; margin-bottom: 25px;"><strong>Strict Rule:</strong> Only 2 chances per question! 🚀</p>
            <p style="font-size: 0.95rem; color:#636e72; margin-bottom: 30px;">Speed matters! First-time correct answers score points based on remaining time!</p>
            <button class="btn-fancy" onclick="startQuiz()">Start 🚀</button>
        </div>

        <div id="screen-quiz" class="hidden">
            <div class="hud-row">
                <div class="hud-pill blue">Question <span id="q-count">1</span>/12</div>
                <div class="hud-pill blue">Score: <span id="score">0</span></div>
                <div class="hud-pill orange">Time: <span id="timer-text">45s</span></div>
            </div>
            
            <div class="progress-container"><div id="progress-bar"></div></div>
            <div class="timer-track"><div id="timer-bar"></div></div>
            <h2 id="q-text"></h2>
            <div class="options-list" id="options-box"></div>
            <div id="feedback-box" class="feedback hidden"></div>
            <div style="margin-top: 20px; height: 50px;">
                <button id="btn-continue" class="btn-fancy hidden" style="float: right;" onclick="nextQuestion()">Next Question ➡️</button>
            </div>
        </div>

        <div id="screen-result" class="hidden text-center">
            <h2>Challenge Complete!</h2>
            <h1 id="final-score" style="font-size: 3.2rem; color: var(--primary); margin: 15px 0;">0 Points</h1>
            <p id="result-msg" style="margin-bottom: 25px; font-weight: 600; color: #2d3436;"></p>
            <button class="btn-fancy" onclick="location.reload()">Play Again 🔄</button>
        </div>
    </div>

    <script>
        const audio = {
            correct: new Audio('assets/correct.mp3'),
            wrong: new Audio('assets/wrong.mp3'),
            claps: new Audio('assets/freesound_community-claps-44774.mp3')
        };

        const questions = [
            { q: "Riya and her friend are measuring the width of their science classroom using their paces (footsteps). When they compare notes, Riya recorded 22 paces while her friend recorded 25 paces. What is the most likely reason for this difference?", options: ["The actual size of the classroom changed between measurements", "Their footsteps differ in length because people have different body sizes", "One of them forgot how to count numbers correctly", "The classroom floor is uneven, making one side longer"], ans: 1, explain: "Footsteps aren't standard units of measurement because everyone's feet and stride lengths are slightly different!" },
            { q: "Ananya goes to a tailor shop to get a dress made. She notices that the tailor avoids using hand spans and instead pulls out a flexible measuring tape to find her dimensions. What is the primary advantage of doing this?", options: ["Using a tape is much faster than using hand spans", "It makes the cloth piece look longer than it actually is", "It provides a uniform, standard measurement that remains accurate for everyone", "It is easier to fold up a measuring tape than a person's hand"], ans: 2, explain: "Standard tools like measuring tapes give a fixed, reliable unit that ensures consistent results no matter who measures." },
            { q: "Imagine you are a scientist working in a high-tech lab, and your assignment is to record the precise dimensions of a very thin object, like the thickness of a small five-rupee coin. Which of these metric units would be the best choice for your report?", options: ["Kilometre", "Metre", "Centimetre", "Millimetre"], ans: 3, explain: "Millimetres are extremely small metric sub-divisions, making them ideal for measuring tiny gaps or very thin objects accurately." },
            { q: "Four friends took different routes to walk home from school today. Aman traveled 500m, Neha walked 2km, Kabir marched 800m, and Sara covered exactly 1km. Who traveled the longest distance among them?", options: ["Aman", "Neha", "Kabir", "Sara"], ans: 1, explain: "Since 1 kilometre equals 1000 metres, Neha's distance of 2km converts to 2000 metres, which is clearly the longest path!" },
            { q: "While trying to find the length of a wooden block with a broken plastic ruler, a student lines up the left edge of the block at the 1cm mark instead of 0. If the right edge points directly to the 15cm mark, what is the actual true length of the block?", options: ["15 cm", "16 cm", "14 cm", "1 cm"], ans: 2, explain: "When a ruler doesn't start at zero, your True Length = Final Reading minus the Starting Reading (15cm - 1cm = 14cm)." },
            { q: "Rohan is trying to find the exact perimeter of a wavy, curved garden path in a local park. He tries using a stiff plastic school ruler but finds it cannot bend along the curves. What method should Rohan use instead?", options: ["Use a straight ruler anyway and guess the curved parts", "Lay a flexible piece of string along the curved path first, then measure that string against a ruler", "Estimate the total length by roughly guessing based on looks", "Count his paces as he walks along the edge of the path"], ans: 1, explain: "A flexible string easily traces a curved profile. Once marked, stretching it straight next to a standard ruler reveals the exact length." },
            { q: "Analyze the two statements below carefully:\n\nAssertion: A passenger sitting completely still inside a fast-moving highway bus is considered to be in motion.\nReason: Whether an object is moving or staying still always depends directly on the chosen reference point.\n\nSelect the most accurate conclusion:", options: ["Both statements are correct, and the Reason perfectly explains the Assertion", "Both statements are correct, but the Reason does not explain the Assertion", "Only the Assertion statement is factually correct", "Only the Reason statement is factually correct"], ans: 0, explain: "Motion is relative. To a person standing on the road, the passenger is moving fast along with the bus. To someone sitting inside the bus, the passenger appears stationary. Therefore, reference points change everything!" },
            { q: "You look up at the ceiling of your room and notice an electric fan spinning around smoothly at a completely locked, constant speed. What specific type of motion is the fan blade displaying?", options: ["Rectilinear motion", "Circular motion", "Oscillatory motion", "Vibratory motion"], ans: 1, explain: "When an object rotates around a central, locked pivot point without changing its overall location, it exhibits circular motion." },
            { q: "A car driving through a congested market keeps tapping its brakes to slow down for shoppers, then accelerates rapidly into open pockets of road space. This changing movement pattern represents:", options: ["Uniform motion", "Non-uniform motion", "Circular motion", "Periodic motion"], ans: 1, explain: "Because the car's speed changes dynamically over time rather than covering equal distances in equal intervals, its motion is non-uniform." },
            { q: "Your science teacher shows you four examples of moving objects: a playground swing shifting back and forth, a grandfather clock pendulum rocking, a guitar string vibrating when plucked, and an express train rushing along a flat, straight line. Which object does NOT belong in this group?", options: ["The playground swing", "The clock pendulum", "The vibrating guitar string", "The moving express train"], ans: 3, explain: "The train exhibits straight-line translatory (rectilinear) motion, whereas all the other options are examples of back-and-forth periodic motions." },
            { q: "Meera and her brother both set off from their front porch to walk to a neighborhood shop that is exactly 600 metres away. Meera takes 10 minutes to arrive, while her brother gets there in just 6 minutes. Who moved with a faster speed?", options: ["Meera was moving faster", "Her brother was moving faster", "They both traveled at the exact same speed", "The speed cannot be calculated from this data"], ans: 1, explain: "Speed is the amount of distance covered per unit of time. Because the brother covered the exact same 600m distance in less time, his speed was higher." },
            { q: "Think carefully about what happens when a carpenter uses a handheld screwdriver to tighten a metal screw into a piece of wooden furniture. What combination of motions does the screw undergo simultaneously?", options: ["It experiences turning rotation only", "It moves forward in a straight line only", "It experiences both Circular and Translatory motion at the same time", "It displays simple oscillatory motion back and forth"], ans: 2, explain: "As the screw turns around its core center axis (circular motion), it also drives deeper downward forward into the wood grain surface (translatory motion)." }
        ];

        let curIdx = 0, score = 0, attempts = 0, timer, timeLeft = 45;

        function shuffleQuestions(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('brand-layer').style.opacity = '0';
                setTimeout(() => document.getElementById('brand-layer').classList.add('hidden'), 800);
            }, 2000);
        };

        function startQuiz() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            shuffleQuestions(questions);
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timer);
            attempts = 0;
            timeLeft = 45;

            const data = questions[curIdx];
            document.getElementById('q-count').innerText = curIdx + 1;
            document.getElementById('q-text').innerText = data.q;
            document.getElementById('timer-text').innerText = timeLeft + "s";
            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('btn-continue').classList.add('hidden');
            document.getElementById('progress-bar').style.width = (curIdx / questions.length * 100) + '%';
            
            document.getElementById('timer-bar').style.transition = 'none';
            document.getElementById('timer-bar').style.width = '100%';
            document.getElementById('timer-bar').offsetHeight; 
            document.getElementById('timer-bar').style.transition = 'width 1s linear';

            const box = document.getElementById('options-box');
            box.innerHTML = '';
            data.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-item';
                btn.innerText = opt;
                btn.onclick = () => checkAns(i, btn);
                box.appendChild(btn);
            });
            startTimer();
        }

        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-text').innerText = timeLeft + "s";
                document.getElementById('timer-bar').style.width = (timeLeft / 45 * 100) + '%';
                if(timeLeft <= 0) { 
                    clearInterval(timer); 
                    endTurnTimeOut(); 
                }
            }, 1000);
        }

        function checkAns(idx, btn) {
            clearInterval(timer);
            const data = questions[curIdx];
            const feedback = document.getElementById('feedback-box');
            
            document.querySelectorAll('.option-item').forEach(b => b.disabled = true);

            if(idx === data.ans) {
                btn.classList.add('correct');
                audio.correct.play().catch(e => console.log("Audio block"));
                
                audio.correct.onended = () => {
                    audio.claps.play().catch(e => console.log("Audio block"));
                    
                    if(attempts === 0) {
                        score += (timeLeft * 100); 
                    } else {
                        score += 50; 
                    }
                    
                    document.getElementById('score').innerText = score;
                    feedback.innerHTML = `<b>🌟 Spot On!</b><br>${data.explain}`;
                    feedback.classList.remove('hidden');
                    document.getElementById('btn-continue').classList.remove('hidden');
                };
            } else {
                btn.classList.add('wrong');
                audio.wrong.play().catch(e => console.log("Audio block"));
                
                audio.wrong.onended = () => {
                    attempts++;
                    if (attempts < 2) {
                        document.querySelectorAll('.option-item').forEach(b => {
                            if(!b.classList.contains('wrong')) b.disabled = false;
                        });
                        feedback.innerHTML = `<b>Not quite right!</b> Review the story data carefully. You have 1 final chance left.`;
                        feedback.classList.remove('hidden');
                        startTimer();
                    } else {
                        const btns = document.querySelectorAll('.option-item');
                        btns[data.ans].classList.add('correct'); 
                        feedback.innerHTML = `<b>No more chances!</b> The correct answer was: <i>${data.options[data.ans]}</i>.<br>${data.explain}`;
                        feedback.classList.remove('hidden');
                        document.getElementById('btn-continue').classList.remove('hidden');
                    }
                };
            }
        }

        function endTurnTimeOut() {
            document.querySelectorAll('.option-item').forEach(b => b.disabled = true);
            const data = questions[curIdx];
            const feedback = document.getElementById('feedback-box');
            const btns = document.querySelectorAll('.option-item');
            
            btns[data.ans].classList.add('correct'); 
            feedback.innerHTML = `<b>⏰ Time out!</b> The correct answer was: <i>${data.options[data.ans]}</i>.<br>${data.explain}`;
            feedback.classList.remove('hidden');
            document.getElementById('btn-continue').classList.remove('hidden');
        }

        function nextQuestion() {
            curIdx++;
            if(curIdx < questions.length) loadQuestion();
            else showResult();
        }

        function showResult() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} Points`;
            audio.claps.play().catch(e => console.log("Audio block"));
            
            if(score >= 25000) {
                document.getElementById('result-msg').innerText = "Incredible velocity and accuracy! You are a master of physical motion! 🏆";
            } else if(score >= 12000) {
                document.getElementById('result-msg').innerText = "Great job! Excellent overall metric performance values.";
            } else {
                document.getElementById('result-msg').innerText = "Good effort! Let's study and review motion profiles once more.";
            }
        }
    </script>
</body>
</html>
