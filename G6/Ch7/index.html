<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grade 6 Science - Motion & Measurement</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --accent: #00cec9;
            --success: #00b894;
            --danger: #d63031;
            --warning: #fdcb6e;
            --bg: #f0f3f7;
        }

        * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background: var(--bg);
            background-image: radial-gradient(#dfe6e9 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 10px;
        }

        #brand-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.8s ease;
        }
        #brand-layer img { max-width: 180px; margin-bottom: 20px; }
        .loader { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .game-card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 20px 0px rgba(0,0,0,0.05), 0 30px 60px rgba(108, 92, 231, 0.15);
            border: 4px solid var(--primary);
            position: relative;
            z-index: 10;
        }

        .hidden { display: none !important; }

        .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .badge { background: var(--primary); color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; }
        .score-badge { background: var(--warning); color: #2d3436; }

        .progress-container { width: 100%; height: 12px; background: #eee; border-radius: 10px; margin-bottom: 10px; border: 2px solid #ddd; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); transition: width 0.5s ease; }

        .timer-track { width: 100%; height: 8px; background: #edf2f4; border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        #timer-bar { height: 100%; width: 100%; background: var(--accent); transition: width 1s linear; }

        h2 { font-size: 1.2rem; color: #2d3436; line-height: 1.4; margin-bottom: 25px; }

        .options-list { display: grid; gap: 15px; }
        .option-item {
            background: #f9f9f9;
            border: 3px solid #dfe6e9;
            padding: 16px 22px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            color: #636e72;
            transition: 0.2s;
            text-align: left;
            width: 100%;
        }
        .option-item:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--primary); background: #f1f0ff; }
        .option-item:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .correct { background: var(--success) !important; color: white !important; border-color: #009473 !important; opacity: 1 !important; }
        .wrong { background: var(--danger) !important; color: white !important; border-color: #b33939 !important; animation: shake 0.4s; opacity: 0.7 !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .feedback { margin-top: 25px; padding: 20px; border-radius: 15px; background: #f0f0ff; border: 2px dashed var(--primary); font-size: 1rem; line-height: 1.4; }
        
        .btn-fancy {
            background: var(--accent); color: white; border: none; padding: 15px 35px; border-radius: 50px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0px #00aaa7;
            display: inline-block;
        }
        .btn-fancy:active { transform: translateY(4px); box-shadow: 0 2px 0px #00aaa7; }
        .text-center { text-align: center; }
    </style>
</head>
<body>

    <div id="brand-layer">
        <img src="assets/logo.png" onerror="this.src='https://via.placeholder.com/180x60?text=INNOVINE'" alt="Logo">
        <div class="loader"></div>
    </div>

    <div class="game-card">
        <div id="screen-start" class="text-center">
            <h1 style="color:var(--primary)">Motion & Measurement</h1>
            <p><strong>Strict Rule:</strong> Only 2 chances per question! 🧪</p>
            <p style="font-size: 0.95rem; color:#636e72;">Speed matters! First-time correct answers score points based on remaining time!</p>
            <button class="btn-fancy" onclick="startQuiz()">Start 🚀</button>
        </div>

        <div id="screen-quiz" class="hidden">
            <div class="hud">
                <span class="badge">Question <span id="q-count">1</span>/12</span>
                <span class="badge score-badge">⭐ Points: <span id="score">0</span></span>
            </div>
            <div class="progress-container"><div id="progress-bar"></div></div>
            <div class="timer-track"><div id="timer-bar"></div></div>
            <h2 id="q-text"></h2>
            <div class="options-list" id="options-box"></div>
            <div id="feedback-box" class="feedback hidden"></div>
            <div style="margin-top: 20px; height: 50px;">
                <button id="btn-continue" class="btn-fancy hidden" style="float: right;" onclick="nextQuestion()">Next Question ➡️</button>
            </div>
        </div>

        <div id="screen-result" class="hidden text-center">
            <h2>Challenge Complete!</h2>
            <h1 id="final-score" style="font-size: 3.2rem; color: var(--primary); margin: 15px 0;">0 Points</h1>
            <p id="result-msg" style="margin-bottom: 25px; font-weight: 600; color: #2d3436;"></p>
            <button class="btn-fancy" onclick="location.reload()">Play Again 🔄</button>
        </div>
    </div>

    <script>
        const audio = {
            correct: new Audio('assets/correct.mp3'),
            wrong: new Audio('assets/wrong.mp3'),
            claps: new Audio('assets/freesound_community-claps-44774.mp3')
        };

        const questions = [
            { q: "Riya measures a classroom using her footsteps. Her friend gets a different answer. Why?", options: ["Size changed", "Footsteps differ in length", "Wrong counting", "Uneven floor"], ans: 1, explain: "Footsteps aren't standard because everyone's feet are different sizes!" },
            { q: "A tailor uses a measuring tape instead of hand span. What is the advantage?", options: ["Faster", "Looks longer", "Uniform and accurate", "Easier folding"], ans: 2, explain: "Standard tools like tapes ensure everyone gets the same measurement." },
            { q: "Which unit is best for the thickness of a coin?", options: ["Kilometre", "Metre", "Centimetre", "Millimetre"], ans: 3, explain: "Millimetres are best for measuring very thin objects." },
            { q: "Who travels the longest: Aman(500m), Neha(2km), Kabir(800m), Sara(1km)?", options: ["Aman", "Neha", "Kabir", "Sara"], ans: 1, explain: "2km equals 2000 metres, which is the longest distance!" },
            { q: "A student starts at 1cm and ends at 15cm. What is the actual length?", options: ["15 cm", "16 cm", "14 cm", "1 cm"], ans: 2, explain: "Length = End Reading - Start Reading (15 - 1 = 14cm)." },
            { q: "How should Rohan measure a curved garden path?", options: ["Straight ruler", "String then measure the string", "Guessing", "Footsteps"], ans: 1, explain: "Use a string to follow the curve, then straighten it against a ruler." },
            { q: "Assertion: A passenger in a moving bus is in motion. Reason: Motion depends on reference point.", options: ["Both correct & Reason explains Assertion", "Both correct but different", "Assertion correct only", "Reason correct only"], ans: 0, explain: "Motion is relative to the observer's position!" },
            { q: "A ceiling fan spinning at a constant speed is:", options: ["Rectilinear", "Circular", "Oscillatory", "Vibratory"], ans: 1, explain: "Moving in a circle around a fixed center is Circular Motion." },
            { q: "A car slowing and speeding in traffic shows:", options: ["Uniform", "Non-uniform", "Circular", "Periodic"], ans: 1, explain: "Speed changes make the motion non-uniform." },
            { q: "Identify the odd one out: Swing, Pendulum, Vibrating string, Moving train.", options: ["Swing", "Pendulum", "String", "Moving train"], ans: 3, explain: "The train moves in a line; the others are back-and-forth periodic motions." },
            { q: "Meera (10 min) and Brother (6 min) walk 600m. Who is faster?", options: ["Meera", "Brother", "Same", "Unknown"], ans: 1, explain: "The Brother took less time, so his speed was higher." },
            { q: "A screw being tightened shows which motions?", options: ["Turning only", "Forward only", "Circular and Translatory", "Oscillatory"], ans: 2, explain: "The screw rotates while moving forward into the surface!" }
        ];

        let curIdx = 0, score = 0, attempts = 0, timer, timeLeft = 45;

        function shuffleQuestions(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('brand-layer').style.opacity = '0';
                setTimeout(() => document.getElementById('brand-layer').classList.add('hidden'), 800);
            }, 2000);
        };

        function startQuiz() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            shuffleQuestions(questions);
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timer);
            attempts = 0;
            timeLeft = 45;

            const data = questions[curIdx];
            document.getElementById('q-count').innerText = curIdx + 1;
            document.getElementById('q-text').innerText = data.q;
            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('btn-continue').classList.add('hidden');
            document.getElementById('progress-bar').style.width = (curIdx / questions.length * 100) + '%';
            
            document.getElementById('timer-bar').style.transition = 'none';
            document.getElementById('timer-bar').style.width = '100%';
            document.getElementById('timer-bar').offsetHeight; 
            document.getElementById('timer-bar').style.transition = 'width 1s linear';

            const box = document.getElementById('options-box');
            box.innerHTML = '';
            data.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-item';
                btn.innerText = opt;
                btn.onclick = () => checkAns(i, btn);
                box.appendChild(btn);
            });
            startTimer();
        }

        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-bar').style.width = (timeLeft / 45 * 100) + '%';
                if(timeLeft <= 0) { 
                    clearInterval(timer); 
                    endTurnTimeOut(); 
                }
            }, 1000);
        }

        function checkAns(idx, btn) {
            clearInterval(timer);
            const data = questions[curIdx];
            const feedback = document.getElementById('feedback-box');
            
            document.querySelectorAll('.option-item').forEach(b => b.disabled = true);

            if(idx === data.ans) {
                btn.classList.add('correct');
                audio.correct.play().catch(e => console.log("Audio block"));
                
                audio.correct.onended = () => {
                    audio.claps.play().catch(e => console.log("Audio block"));
                    
                    if(attempts === 0) {
                        score += (timeLeft * 100); 
                    } else {
                        score += 50; 
                    }
                    
                    document.getElementById('score').innerText = score;
                    feedback.innerHTML = `<b>🌟 Spot On!</b><br>${data.explain}`;
                    feedback.classList.remove('hidden');
                    document.getElementById('btn-continue').classList.remove('hidden');
                };
            } else {
                btn.classList.add('wrong');
                audio.wrong.play().catch(e => console.log("Audio block"));
                
                audio.wrong.onended = () => {
                    attempts++;
                    if (attempts < 2) {
                        document.querySelectorAll('.option-item').forEach(b => {
                            if(!b.classList.contains('wrong')) b.disabled = false;
                        });
                        feedback.innerHTML = `<b>Wrong!</b> You have 1 chance left.`;
                        feedback.classList.remove('hidden');
                        startTimer();
                    } else {
                        const btns = document.querySelectorAll('.option-item');
                        btns[data.ans].classList.add('correct'); 
                        feedback.innerHTML = `<b>No more chances!</b> The correct answer was: <i>${data.options[data.ans]}</i>.<br>${data.explain}`;
                        feedback.classList.remove('hidden');
                        document.getElementById('btn-continue').classList.remove('hidden');
                    }
                };
            }
        }

        function endTurnTimeOut() {
            document.querySelectorAll('.option-item').forEach(b => b.disabled = true);
            const data = questions[curIdx];
            const feedback = document.getElementById('feedback-box');
            const btns = document.querySelectorAll('.option-item');
            
            btns[data.ans].classList.add('correct'); 
            feedback.innerHTML = `<b>⏰ Time out!</b> The correct answer was: <i>${data.options[data.ans]}</i>.<br>${data.explain}`;
            feedback.classList.remove('hidden');
            document.getElementById('btn-continue').classList.remove('hidden');
        }

        function nextQuestion() {
            curIdx++;
            if(curIdx < questions.length) loadQuestion();
            else showResult();
        }

        function showResult() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} Points`;
            audio.claps.play().catch(e => console.log("Audio block"));
            
            if(score >= 25000) {
                document.getElementById('result-msg').innerText = "Incredible velocity and accuracy! You are a master of physical motion! 🏆";
            } else if(score >= 12000) {
                document.getElementById('result-msg').innerText = "Great job! Excellent overall metric performance values.";
            } else {
                document.getElementById('result-msg').innerText = "Good effort! Let's study and review motion profiles once more.";
            }
        }
    </script>
</body>
</html>
